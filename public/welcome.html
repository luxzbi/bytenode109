<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bytenode — 시작하기</title>
<style>
:root{
  --bg:#0a0a0a; --bg2:#111111; --bg3:#1a1a1a;
  --border:#262626; --border2:#333333;
  --text:#e8e8e8; --text2:#999999; --accent:#c8c8c8;
  --err:#ff6b6b; --ok:#6bcf8e;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI","Apple SD Gothic Neo",sans-serif;}
body{display:flex;align-items:center;justify-content:center;padding:20px;}
.card{
  width:100%;max-width:400px;background:var(--bg2);
  border:1px solid var(--border);border-radius:14px;padding:36px 32px;
}
.logo{font-size:22px;font-weight:700;letter-spacing:-.5px;text-align:center;}
.logo span{color:var(--text2);}
.sub{font-size:13px;color:var(--text2);text-align:center;margin:8px 0 28px;}
.tabs{display:flex;gap:6px;margin-bottom:22px;background:var(--bg3);border-radius:9px;padding:4px;}
.tabs button{
  flex:1;padding:9px 0;border:none;border-radius:6px;background:none;
  color:var(--text2);font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
}
.tabs button.on{background:var(--bg);color:var(--text);}
label{display:block;font-size:12.5px;color:var(--text2);margin:14px 0 6px;}
input{
  width:100%;padding:11px 13px;border-radius:8px;font-size:14px;
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);outline:none;font-family:inherit;
}
input:focus{border-color:var(--accent);}
.btn{
  width:100%;margin-top:24px;padding:12px 0;border:none;border-radius:8px;
  background:var(--text);color:#0a0a0a;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
.btn:hover{background:#fff;}
.btn:disabled{opacity:.5;cursor:default;}
.msg{font-size:13px;margin-top:14px;text-align:center;min-height:18px;}
.msg.err{color:var(--err);}
.msg.ok{color:var(--ok);}
.foot{font-size:12px;color:var(--text2);text-align:center;margin-top:22px;}
.foot a{color:var(--accent);}
#nameRow{display:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">bytenode<span>109</span></div>
  <div class="sub">계정 하나로 bytenode와 bytewrite를 모두 이용하세요</div>

  <div class="tabs">
    <button id="tabSignup" class="on" onclick="setMode('signup')">회원가입</button>
    <button id="tabLogin" onclick="setMode('login')">로그인</button>
  </div>

  <form id="form" autocomplete="on">
    <label>아이디</label>
    <input id="username" autocomplete="username" required>
    <div id="nameRow">
      <label>표시 이름</label>
      <input id="displayName">
    </div>
    <label>비밀번호</label>
    <input id="password" type="password" autocomplete="current-password" required minlength="6" maxlength="128">
    <button class="btn" id="submitBtn" type="submit">가입하기</button>
  </form>
  <div class="msg" id="msg"></div>

  <div class="foot"><a href="/">bytenode 홈으로 →</a></div>
</div>

<script>
let mode = 'signup';
const $ = id => document.getElementById(id);

function setMode(m) {
  mode = m;
  $('tabSignup').classList.toggle('on', m === 'signup');
  $('tabLogin').classList.toggle('on', m === 'login');
  $('nameRow').style.display = m === 'signup' ? 'block' : 'none';
  $('submitBtn').textContent = m === 'signup' ? '가입하기' : '로그인';
  $('msg').textContent = '';
}
setMode('signup');

$('form').onsubmit = async e => {
  e.preventDefault();
  const btn = $('submitBtn'), msg = $('msg');
  const username = $('username').value.trim();
  const password = $('password').value;
  const displayName = $('displayName').value.trim();
  if (mode === 'signup' && !displayName) { msg.className = 'msg err'; msg.textContent = '표시 이름을 입력하세요.'; return; }

  btn.disabled = true; msg.className = 'msg'; msg.textContent = '처리 중…';
  try {
    const url = mode === 'signup' ? '/api/auth/register' : '/api/auth/login';
    const body = mode === 'signup' ? { username, displayName, password } : { username, password };
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '요청에 실패했습니다.');
    localStorage.setItem('bn_token', data.token);
    localStorage.setItem('bn_me', JSON.stringify(data.user));
    msg.className = 'msg ok';
    msg.textContent = (mode === 'signup' ? '가입 완료! ' : '로그인 성공! ') + '이동 중…';
    // SSO: ?redirect=<원래 서비스 주소>가 있으면 토큰을 URL 해시로 붙여 되돌려보냄.
    // 해시(#)는 서버 로그에 남지 않고, 받는 쪽 JS가 location.hash에서 꺼내 저장한다.
    const back = new URLSearchParams(location.search).get('redirect');
    let dest = '/';
    if (back) {
      try {
        const u = new URL(back, location.origin);
        if (u.protocol === 'https:' || u.protocol === 'http:') {
          u.hash = 'bn_token=' + encodeURIComponent(data.token);
          dest = u.href;
        }
      } catch (_) {}
    }
    setTimeout(() => { location.href = dest; }, 700);
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = err.message;
    btn.disabled = false;
  }
};
</script>
</body>
</html>
