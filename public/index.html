  if (/^featured:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'featured', title:p[0]||'', text:p[1]||'', color:p[2]||null };
  }
  if (/^newscard:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'newscard', title:p[0]||'', text:p[1]||'', category:p[2]||'' };
  }
  if (/^nlsection:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'nlsection', text:p[0]||'', color:p[1]||null };
  }
  if (/^subscribe:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'subscribe', text:p[0]||'', btn:p[1]||'구독하기' };
  }
  if (/^nlfooter:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'nlfooter', org:p[0]||'', unsub:p[1]||'' };
  }
  if (/^issuemeta:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'issuemeta', issue:p[0]||'', date:p[1]||'', publisher:p[2]||'', audience:p[3]||'' };
  }
  if (/^mgcover:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'mgcover', name:p[0]||'', slogan:p[1]||'', meta:p[2]||'', color:p[3]||'#0f172a' };
  }
  if (/^mgtoc:\s*/.test(cmd)) {
    const items = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim()).filter(Boolean);
    return { type:'mgtoc', items };
  }
  if (/^article:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'article', title:p[0]||'', author:p[1]||'', date:p[2]||'', category:p[3]||'', body:p[4]||'' };
  }

  // ── flashstory ──
  if (/^storyslide:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'storyslide', color:p[0]||'#0f172a', color2:p[1]||null };
  }
  if (/^bigtext:\s*/.test(cmd)) return { type:'bigtext', text: cmd.slice(cmd.indexOf(':')+1).trim() };
  if (/^storycaption:\s*/.test(cmd)) return { type:'storycaption', text: cmd.slice(cmd.indexOf(':')+1).trim() };
  if (/^storyemoji:\s*/.test(cmd)) return { type:'storyemoji', icon: cmd.slice(cmd.indexOf(':')+1).trim() };
  if (/^storytag:\s*/.test(cmd)) {
    const tags = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim()).filter(Boolean);
    return { type:'storytag', tags };
  }

  // byteflash
  if (/^card-front:\s*/.test(cmd)) return { type:'flash-front', text: cmd.slice(cmd.indexOf(':')+1).trim() };
  if (/^card-back:\s*/.test(cmd))  return { type:'flash-back',  text: cmd.slice(cmd.indexOf(':')+1).trim() };

  // bytestep
  if (/^step:\s*/.test(cmd)) {
    const rest = cmd.slice(cmd.indexOf(':')+1).trim();
    const numM = rest.match(/^(\d+)\s*,/);
    const num = numM ? parseInt(numM[1]) : 1;
    const after = numM ? rest.slice(numM[0].length).trim() : rest;
    const titleM = after.match(/title:\s*([^,]+)/);
    const contentM = after.match(/content:\s*([\s\S]*)/);
    return { type:'step', num, title: titleM ? titleM[1].trim() : '', content: contentM ? contentM[1].trim() : '' };
  }

  // byteflow
  if (/^node:\s*/.test(cmd)) {
    const rest = cmd.slice(cmd.indexOf(':')+1).trim();
    const idM = rest.match(/^([^,]+),/);
    const id = idM ? idM[1].trim() : rest;
    const labelM = rest.match(/label:\s*(.+)/);
    return { type:'flow-node', id, label: labelM ? labelM[1].trim() : id };
  }
  if (/^edge:\s*/.test(cmd)) {
    const rest = cmd.slice(cmd.indexOf(':')+1).trim();
    const arrowM = rest.match(/([^,\-]+?)\s*->\s*([^,]+)/);
    const from = arrowM ? arrowM[1].trim() : '';
    const to = arrowM ? arrowM[2].trim() : '';
    const descM = rest.match(/desc:\s*(.+)/);
    return { type:'flow-edge', from, to, desc: descM ? descM[1].trim() : '' };
  }

  // byteroadmap
  if (/^milestone:\s*/.test(cmd)) {
    const rest = cmd.slice(cmd.indexOf(':')+1).trim();
    const periodM = rest.match(/^([^,]+),/);
    const period = periodM ? periodM[1].trim() : rest;
    const after = periodM ? rest.slice(periodM[0].length).trim() : '';
    const titleM = after.match(/title:\s*([^,]+)/);
    const badgeM = after.match(/badge:\s*([^,]+)/);
    const contentM = after.match(/content:\s*([\s\S]*)/);
    return { type:'roadmap-item', period, title: titleM ? titleM[1].trim() : '', badge: badgeM ? badgeM[1].trim() : '', content: contentM ? contentM[1].trim() : '' };
  }

  // ── canvas layout (bytenode-ppt 1e) ──
  if (/^(grid|partition):\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    const layout = parseGridLayoutSpec(p[0] || '2');
    return { type:'grid-open', cols: layout.cols, rows: layout.rows, template: layout.template, rowsTemplate: layout.rowsTemplate, gap: normalizeCssSize(p[1], '16px') };
  }
  if (/^gridcell$/.test(cmd.trim())) return { type:'gridcell-open' };
  if (/^(?:\/gridcell|endcell)$/.test(cmd.trim())) return { type:'gridcell-close' };
  if (/^endgrid$/.test(cmd.trim())) return { type:'grid-close' };

  if (/^freebox:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split(',').map(s=>s.trim().replace('%',''));
    let x = parseFloat(p[0])||0, y = parseFloat(p[1])||0;
    let w = parseFloat(p[2])||50, h = parseFloat(p[3])||50;
    const z = Math.max(10, parseInt(p[4])||10);
    x = Math.max(0, Math.min(100, x)); y = Math.max(0, Math.min(100, y));
    w = Math.max(1, Math.min(100, w)); h = Math.max(1, Math.min(100, h));
    if (x + w > 100) w = 100 - x;
    if (y + h > 100) h = 100 - y;
    return { type:'freebox-open', x, y, w, h, z };
  }
  if (/^endbox$/.test(cmd.trim())) return { type:'freebox-close' };

  if (/^meshbg:\s*/.test(cmd)) {
    const colors = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim()).filter(Boolean);
    return { type:'meshbg', colors };
  }

  if (/^svg-asset:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split(',').map(s=>s.trim());
    return { type:'svg-open', w: parseInt(p[0])||400, h: parseInt(p[1])||300 };
  }
  if (/^svg-rect:\s*/.test(cmd)) {
    const p = splitCommaDepth(cmd.slice(cmd.indexOf(':')+1));
    return { type:'svg-rect', x:p[0]||'0', y:p[1]||'0', w:p[2]||'100', h:p[3]||'50', fill:p[4]||'#60a5fa', rx:p[5]||'4' };
  }
  if (/^svg-circle:\s*/.test(cmd)) {
    const p = splitCommaDepth(cmd.slice(cmd.indexOf(':')+1));
    return { type:'svg-circle', cx:p[0]||'50', cy:p[1]||'50', r:p[2]||'40', fill:p[3]||'#60a5fa' };
  }
  if (/^svg-line:\s*/.test(cmd)) {
    const p = splitCommaDepth(cmd.slice(cmd.indexOf(':')+1));
    return { type:'svg-line', x1:p[0]||'0', y1:p[1]||'0', x2:p[2]||'100', y2:p[3]||'100', color:p[4]||'#60a5fa', sw:p[5]||'2' };
  }
  if (/^svg-text:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'svg-text', x:p[0]||'50', y:p[1]||'50', text:p[2]||'', color:p[3]||'#e8e8e8', size:p[4]||'14' };
  }
  if (/^endsvg$/.test(cmd.trim())) return { type:'svg-close' };

  // ── 인라인 색상 스팬 <c: #색 | 텍스트> ──
  if (/^c:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'colorspan', color: p[0]||'#60a5fa', content: p.slice(1).join('|') };
  }
  // ── 인라인 그라데이션 스팬 <gc: #색1,#색2 | 텍스트> ──
  if (/^gc:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    const colors = (p[0]||'#60a5fa,#a78bfa').split(',').map(s=>s.trim());
    return { type:'gradspan', c1: colors[0]||'#60a5fa', c2: colors[1]||'#a78bfa', content: p.slice(1).join('|') };
  }
  // ── 멀티컬러 텍스트 <colortext: #f00:단어 | 일반 | #0f0:초록> ──
  if (/^colortext:\s*/.test(cmd)) {
    const items = cmd.slice(cmd.indexOf(':')+1).split('|').map(s => {
      const s2 = s.trim();
      const m = s2.match(/^(#[0-9a-fA-F]{3,8}):(.*)/);
      return m ? { color: m[1], text: m[2].trim() } : { color: null, text: s2 };
    }).filter(i=>i.text);
    return { type:'colortext', items };
  }
  // ── 배경 패널 <bgblock: 색상> or <bgblock: #c1,#c2 | 둥글기> ──
  if (/^bgblock:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    const colors = (p[0]||'#1e3a8a').split(',').map(s=>s.trim());
    const radius = p[1]||'0px';
    const bg = colors.length > 1
      ? `linear-gradient(135deg,${colors[0]},${colors[1]})`
      : colors[0];
    return { type:'bgblock', bg, radius };
  }
  // ── 배경 2분할 <bgsplit: v|h | 비율% | 색1 | 색2> ──
  if (/^bgsplit:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    const dir = (p[0]||'v').toLowerCase();
    return { type:'bgsplit', dir, ratio: parseFloat((p[1]||'50').replace('%',''))||50, c1: p[2]||'#1e3a8a', c2: p[3]||'#0a0f1e' };
  }
  // ── 고급 표 <xtable: H1|H2 // R1|R2 // R3|R4 | head:#색 | stripe:#색> ──
  if (/^xtable:\s*/.test(cmd)) {
    const raw = cmd.slice(cmd.indexOf(':')+1);
    const headMatch = raw.match(/\|\s*head:(#[0-9a-fA-F]{3,8})/i);
    const stripeMatch = raw.match(/\|\s*stripe:(#[0-9a-fA-F]{3,8})/i);
    const borderMatch = raw.match(/\|\s*border:(#[0-9a-fA-F]{3,8})/i);
    const clean = raw
      .replace(/\|\s*head:#[0-9a-fA-F]{3,8}/gi,'')
      .replace(/\|\s*stripe:#[0-9a-fA-F]{3,8}/gi,'')
      .replace(/\|\s*border:#[0-9a-fA-F]{3,8}/gi,'');
    const rows = clean.split('//').map(r=>r.split('|').map(c=>c.trim())).filter(r=>r.some(Boolean));
    return { type:'xtable', rows, headColor: headMatch?.[1]||null, stripeColor: stripeMatch?.[1]||null, borderColor: borderMatch?.[1]||'rgba(255,255,255,.15)' };
  }

  // ── 3단 컬럼 <columns3: 내용1 | 내용2 | 내용3> ──
  if (/^columns3:\s*/.test(cmd)) {
    const cols = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim()).slice(0,3);
    while (cols.length < 3) cols.push('');
    return { type:'columns3', cols };
  }
  // ── 2×2 정보 그리드 <grid2x2: 제목1:내용1 | 제목2:내용2 | 제목3:내용3 | 제목4:내용4 | accent:#색> ──
  if (/^grid2x2:\s*/.test(cmd)) {
    const raw = cmd.slice(cmd.indexOf(':')+1);
    const accentMatch = raw.match(/\|\s*accent:(#[0-9a-fA-F]{3,8})/i);
    const clean = raw.replace(/\|\s*accent:#[0-9a-fA-F]{3,8}/gi,'');
    const cells = clean.split('|').map(s=>s.trim()).slice(0,4).map(s=>{
      const ci = s.indexOf(':');
      return ci > -1 ? { title: s.slice(0,ci).trim(), body: s.slice(ci+1).trim() } : { title:'', body:s };
    });
    while (cells.length < 4) cells.push({ title:'', body:'' });
    return { type:'grid2x2', cells, accent: accentMatch?.[1]||'#60a5fa' };
  }
  // ── 글로우 그라데이션 텍스트 <textglow: #색1,#색2 | 텍스트 | 크기> ──
  if (/^textglow:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    const colors = (p[0]||'#38bdf8,#a78bfa').split(',').map(s=>s.trim());
    return { type:'textglow', c1: colors[0]||'#38bdf8', c2: colors[1]||'#a78bfa', text: p[1]||'', size: parseInt(p[2]||'7')||7 };
  }
  // ── 어노테이션 박스 <annotate: 텍스트 | #색> ──
  if (/^annotate:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'annotate', text: p[0]||'', color: p[1]||'#fbbf24' };
  }
  // ── A vs B 비교 <comparison: A라벨 | B라벨 // 항목 | A값 | B값> ──
  if (/^comparison:\s*/.test(cmd)) {
    const raw = cmd.slice(cmd.indexOf(':')+1);
    const rows = raw.split('//').map(r=>r.split('|').map(c=>c.trim()));
    const [headerRow, ...dataRows] = rows;
    const labelA = headerRow[0]||'A', labelB = headerRow[1]||'B';
    const items = dataRows.filter(r=>r.length>=3).map(r=>({ label:r[0], a:r[1], b:r[2] }));
    return { type:'comparison', labelA, labelB, items };
  }
  // ── 강조 인용 박스 <accent: #색 | 텍스트> ──
  if (/^accent:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    const color = /^#[0-9a-fA-F]{3,8}$/.test(p[0]||'') ? p[0] : '#60a5fa';
    const text = /^#[0-9a-fA-F]{3,8}$/.test(p[0]||'') ? p.slice(1).join('|') : p.join('|');
    return { type:'accent', color, text };
  }
  // ── 매거진 레이아웃 <magazine: 이미지URL | 제목 | 내용 | left/right> ──
  if (/^magazine:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'magazine', img: p[0]||'', title: p[1]||'', body: p[2]||'', side: (p[3]||'left').toLowerCase() };
  }
  // ── 글래스모피즘 패널 <glasspanel: 텍스트 | blur | opacity | #border> ──
  if (/^glasspanel:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'glasspanel', text: p[0]||'', blur: p[1]||'14px', opacity: p[2]||'0.08', border: p[3]||'rgba(255,255,255,.18)' };
  }
  // ── 아웃라인(중공) 텍스트 <hollow: #색 | 굵기 | 텍스트 | 크기> ──
  if (/^hollow:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'hollow', color: p[0]||'#60a5fa', stroke: p[1]||'2px', text: p[2]||'', size: parseInt(p[3]||'7')||7 };
  }
  // ── KPI 애니메이션 카운터 <statcount: 값 | 라벨 | #색 | prefix | suffix> ──
  if (/^statcount:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'statcount', val: p[0]||'0', label: p[1]||'', color: p[2]||'#60a5fa', prefix: p[3]||'', suffix: p[4]||'' };
  }
  // ── 순환 프로세스 다이어그램 <cycle: 단계1 | 단계2 | ... | accent:#색> ──
  if (/^cycle:\s*/.test(cmd)) {
    const raw = cmd.slice(cmd.indexOf(':')+1);
    const accentMatch = raw.match(/\|\s*accent:(#[0-9a-fA-F]{3,8})/i);
    const accent = accentMatch?.[1]||'#60a5fa';
    const steps = raw.replace(/\|\s*accent:#[0-9a-fA-F]{3,8}/gi,'').split('|').map(s=>s.trim()).filter(Boolean);
    return { type:'cycle', steps, accent };
  }
  // ── 디바이스 프레임 목업 <mockup: laptop/mobile/tablet | 이미지URL | 제목> ──
  if (/^mockup:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':')+1).split('|').map(s=>s.trim());
    return { type:'mockup', device: (p[0]||'laptop').toLowerCase(), img: p[1]||'', title: p[2]||'' };
  }

  return null; // 알 수 없는 명령어 → 무시
}

/* ─ groupSpecialBlocks: 연속 특수블록 묶기 ─ */
function groupSpecialBlocks(blocks) {
  const FLASH = new Set(['flash-front','flash-back']);
  const STEP  = new Set(['step']);
  const FLOW  = new Set(['flow-node','flow-edge']);
  const ROAD  = new Set(['roadmap-item']);
  const out = [];
  let i = 0;
  while (i < blocks.length) {
    const b = blocks[i];
    if (FLASH.has(b.type)) {
      const cards = [];
      while (i < blocks.length && FLASH.has(blocks[i].type)) cards.push(blocks[i++]);
      const pairs = [];
      for (let j = 0; j < cards.length; j += 2) {
        pairs.push({ front: cards[j]?.text || '', back: cards[j+1]?.text || '' });
      }
      out.push({ type:'flashdeck', cards: pairs }); continue;
    }
    if (STEP.has(b.type)) {
      const steps = [];
      while (i < blocks.length && STEP.has(blocks[i].type)) steps.push(blocks[i++]);
      out.push({ type:'stepgroup', steps }); continue;
    }
    if (FLOW.has(b.type)) {
      const nodes = [], edges = [];
      while (i < blocks.length && FLOW.has(blocks[i].type)) {
        if (blocks[i].type === 'flow-node') nodes.push(blocks[i]);
        else edges.push(blocks[i]);
        i++;
      }
      out.push({ type:'flowgraph', nodes, edges }); continue;
    }
    if (ROAD.has(b.type)) {
      const items = [];
      while (i < blocks.length && ROAD.has(blocks[i].type)) items.push(blocks[i++]);
      out.push({ type:'roadmap', items }); continue;
    }
    // ── grid layout ──
    if (b.type === 'grid-open') {
      const { cols, rows, template, rowsTemplate, gap } = b; i++;
      const cells = [];
      let curCell = null;
      while (i < blocks.length && blocks[i].type !== 'grid-close') {
        if (blocks[i].type === 'gridcell-open') { curCell = []; i++; continue; }
        if (blocks[i].type === 'gridcell-close') { if (curCell) cells.push(curCell); curCell = null; i++; continue; }
        if (curCell) curCell.push(blocks[i++]);
        else i++;
      }
      if (curCell) cells.push(curCell);
      if (i < blocks.length) i++;
      out.push({ type:'ppt-grid', cols, rows, template, rowsTemplate, gap, cells }); continue;
    }
    // ── freebox: collect adjacent boxes into one responsive 16:9 canvas ──
    // Works with or without <endbox> tags: uses next <freebox:> as delimiter if no <endbox>
    if (b.type === 'freebox-open') {
      const boxes = [];
      let fb = b; // include the first freebox-open (already consumed as b)
      while (fb) {
        const inner = [];
        while (i < blocks.length) {
          const cur = blocks[i];
          if (cur.type === 'freebox-open' || cur.type === 'freebox-close') break;
          inner.push(cur);
          i++;
        }
        boxes.push({ x: fb.x, y: fb.y, w: fb.w, h: fb.h, z: fb.z, blocks: groupSpecialBlocks(inner) });
        if (i < blocks.length && blocks[i].type === 'freebox-close') i++; // consume optional endbox
        while (i < blocks.length && (blocks[i].type === 'linebreak' || blocks[i].type === 'vgap')) i++;
        fb = (i < blocks.length && blocks[i].type === 'freebox-open') ? blocks[i++] : null;
      }
      out.push({ type:'freecanvas', boxes }); continue;
    }
    // ── svg-asset ──
    if (b.type === 'svg-open') {
      const { w, h } = b; i++;
      const elements = [];
      while (i < blocks.length && blocks[i].type !== 'svg-close') elements.push(blocks[i++]);
      if (i < blocks.length) i++;
      out.push({ type:'svg-asset', w, h, elements }); continue;
    }
    // ── slide: slidebg + content 병합 ──
    if (b.type === 'slide' || b.type === 'slidecover') {
      const slideBlock = { ...b }; i++;
      // linebreak/vgap 건너뛰며 slidebg 찾기
      let k = i;
      while (k < blocks.length && (blocks[k].type === 'linebreak' || blocks[k].type === 'vgap')) k++;
      if (k < blocks.length && blocks[k].type === 'slidebg') {
        slideBlock.bg = blocks[k].spec;
        i = k + 1;
      }
      // 다음 slide/slidecover 까지 내용 수집
      const content = [];
      while (i < blocks.length && blocks[i].type !== 'slide' && blocks[i].type !== 'slidecover') {
        if (blocks[i].type !== 'slidebg') content.push(blocks[i]);
        i++;
      }
      const meshBlock = content.find(x => x.type === 'meshbg');
      if (meshBlock) slideBlock.meshColors = meshBlock.colors;
      slideBlock.content = groupSpecialBlocks(content.filter(x => x.type !== 'meshbg'));
      out.push(slideBlock); continue;
    }

    out.push(b); i++;
  }
  return out;
}

/* ─ 2단계: 블록 → HTML ─ */
function renderBlocks(blocks, _isInner) {
  const cols = getGridCols();
  let html = '';
  // 최상위 호출에서만 카운터 초기화 (재귀 시 유지)
  if (!_isInner) {
    renderBlocks._slideNum = 0;
    renderBlocks._h1 = 0; renderBlocks._h2 = 0; renderBlocks._h3 = 0;
  }

  blocks = groupSpecialBlocks(blocks);
  for (const b of blocks) {
    switch (b.type) {
      case 'vgap':
        // 빈 줄(Enter) → 세로 간격
        html += '<div style="height:14px"></div>';
        break;

      case 'linebreak':
        html += '<br>';
        break;

      case 'hgap':
        html += `<span style="display:inline-block;width:${(b.n||1)*18}px"></span>`;
        break;

      case 'title':
        html += `<h1 style="font-size:2rem;font-weight:800;line-height:1.3;margin:6px 0">${renderInlineContent(b.text)}</h1>`;
        break;

      case 'gradtext': {
        const sz = FONT_SIZES[Math.min(Math.max(b.size||7,1),9)]||'1.3rem';
        html += `<div style="font-size:${sz};font-weight:900;line-height:1.35;margin:8px 0;background:${makeLinearGradientCss(b.c1,b.c2)};-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;max-width:100%;word-break:break-word">${renderInlineContent(b.text)}</div>`;
        break;
      }

      case 'gradbox': {
        const fg = String(b.tone||'dark').toLowerCase()==='light' ? '#111827' : '#ffffff';
        html += `<div style="margin:10px 0;padding:16px 18px;border-radius:10px;background:${makeLinearGradientCss(b.c1,b.c2)};color:${fg};font-weight:800;box-shadow:0 16px 40px rgba(0,0,0,.18);break-inside:avoid">${renderInlineContent(b.text)}</div>`;
        break;
      }

      case 'gradshape': {
        const fg = String(b.tone||'dark').toLowerCase()==='light' ? '#111827' : '#ffffff';
        const shape = String(b.shape||'rect').toLowerCase();
        const radius = shape === 'circle' ? '999px' : shape === 'pill' ? '999px' : shape === 'diamond' ? '12px' : '14px';
        const rotate = shape === 'diamond' ? 'transform:rotate(45deg);' : '';
        const innerRotate = shape === 'diamond' ? 'transform:rotate(-45deg);' : '';
        html += `<div style="display:inline-flex;align-items:center;justify-content:center;width:${esc(b.w)};height:${esc(b.h)};margin:10px 12px 10px 0;border-radius:${radius};background:${makeLinearGradientCss(b.c1,b.c2)};color:${fg};font-weight:900;text-align:center;box-shadow:0 18px 45px rgba(0,0,0,.20);${rotate}"><span style="padding:10px;${innerRotate}">${renderInlineContent(b.text)}</span></div>`;
        break;
      }

      case 'text': {
        const sz = FONT_SIZES[Math.min(Math.max(b.size,1),9)]||'1rem';
        const safeColor = b.color && /^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]{2,30}$|^rgba?\([\d\s,%.]+\)$/.test(b.color) ? b.color : null;
        const st = `font-size:${sz};${safeColor?`color:${safeColor};`:''}line-height:1.75;white-space:pre-wrap;display:inline;`;
        const lm = b.content.match(/^\{([^}]+)\}\s*([\s\S]*)/);
        if (lm) {
          html += `<a href="${esc(lm[1])}" target="_blank" rel="noopener" style="${st}text-decoration:underline;opacity:.85">${renderInlineContent(lm[2]||lm[1])}</a>`;
        } else {
          html += `<span style="${st}">${renderInlineContent(b.content)}</span>`;
        }
        break;
      }

      case 'img': {
        if (!b.url) break;
        let imgHtml;
        if (b.sizeX && b.sizeY) {
          const w = Math.min(b.sizeX / cols * 100, 100) + '%';
          const h = b.sizeY * 28 + 'px';
          const pos = b.align==='up'?'top':b.align==='down'?'bottom':'center';
          imgHtml = `<div style="width:${w};height:${h};overflow:hidden;border-radius:4px;margin:6px 0;display:flex;align-items:${b.align==='up'?'flex-start':b.align==='down'?'flex-end':'center'}"><img src="${esc(b.url)}" style="width:100%;object-fit:cover;object-position:${pos}" alt="" onerror="this.parentElement.style.display='none'"/></div>`;
        } else {
          imgHtml = `<img src="${esc(b.url)}" style="max-width:100%;display:block;border-radius:4px;margin:6px 0" alt="" onerror="this.style.display='none'"/>`;
        }
        html += b.link ? `<a href="${esc(b.link)}" target="_blank" rel="noopener">${imgHtml}</a>` : imgHtml;
        break;
      }

      case 'video': {
        if (!b.url) break;
        if (b.sizeX && b.sizeY) {
          const w = Math.min(b.sizeX / cols * 100, 100) + '%';
          const h = b.sizeY * 28 + 'px';
          html += `<div style="width:${w};height:${h};overflow:hidden;border-radius:4px;margin:6px 0;background:#000">
            <video src="${esc(b.url)}" controls style="width:100%;height:100%;object-fit:contain"></video>
          </div>`;
        } else {
          html += `<video src="${esc(b.url)}" controls style="max-width:100%;display:block;border-radius:4px;margin:6px 0"></video>`;
        }
        break;
      }

      case 'bold':
        html += `<strong style="font-weight:700;display:inline">${renderInlineContent(b.content)}</strong>`;
        break;

      case 'italic':
        html += `<em style="font-style:italic;display:inline">${renderInlineContent(b.content)}</em>`;
        break;

      case 'mark':
        html += `<mark style="background:#ffe066;color:#222;padding:0 4px;border-radius:3px;display:inline">${renderInlineContent(b.content)}</mark>`;
        break;

      case 'codeinline':
        html += `<code style="font-family:Consolas,monospace;background:rgba(255,255,255,.1);color:#aef;padding:2px 8px;border-radius:4px;font-size:.9em;display:inline">${renderInlineContent(b.content)}</code>`;
        break;

      case 'codeblock': {
        const escaped = b.content
          .replace(/\\gt/g, '>').replace(/\\lt/g, '<')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const langBadge = b.lang ? `<span style="font-size:10px;opacity:.5;float:right;font-family:sans-serif">${b.lang}</span>` : '';
        html += `<pre style="background:#111827;border:1px solid var(--border2);border-radius:8px;padding:16px;overflow-x:auto;font-family:Consolas,'Courier New',monospace;font-size:13px;line-height:1.7;color:#93c5fd;margin:12px 0;break-inside:avoid;white-space:pre">${langBadge}${escaped}</pre>`;
        break;
      }

      case 'center':
        html += `<div style="text-align:center;padding:4px 0">${renderInlineContent(b.content)}</div>`;
        break;

      case 'right':
        html += `<div style="text-align:right;padding:4px 0">${renderInlineContent(b.content)}</div>`;
        break;

      case 'indent':
        html += `<div style="padding-left:28px;border-left:2px solid var(--border2);margin:4px 0;color:var(--accent)">${renderInlineContent(b.content)}</div>`;
        break;

      case 'quote':
        html += `<blockquote style="border-left:3px solid var(--accent);padding:10px 16px;margin:8px 0;background:rgba(255,255,255,.04);font-style:italic;color:var(--accent);border-radius:0 6px 6px 0">${renderInlineContent(b.content)}</blockquote>`;
        break;

      case 'box':
        html += `<div style="border:1px solid var(--border2);border-radius:6px;padding:14px 18px;margin:8px 0;color:var(--text)">${renderInlineContent(b.content)}</div>`;
        break;

      case 'callout':
        html += `<div style="background:rgba(200,200,200,.08);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 18px;margin:8px 0;color:var(--text)">${renderInlineContent(b.content)}</div>`;
        break;

      case 'badge':
        html += `<span style="display:inline-block;background:rgba(255,255,255,.12);color:var(--accent);font-size:.78rem;padding:2px 10px;border-radius:20px;border:1px solid var(--border2);margin:2px 2px">${renderInlineContent(b.content)}</span>`;
        break;

      case 'divider': {
        const sz = Math.min(Math.max(b.size||1, 1), 10);
        html += `<hr style="border:none;border-top:${sz}px solid var(--border2);margin:10px 0;width:100%;border-radius:${sz}px"/>`;
        break;
      }

      case 'spacer':
        html += `<div style="height:${(b.lenQ||1)}px"></div>`;
        break;

      case 'line':
        html += `<hr style="border:none;border-top:1px solid var(--border2);margin:8px 0;width:${Math.min(b.pct||100,100)}%"/>`;
        break;

      case 'gallery': {
        if (!b.urls?.length) break;
        const gcols = Math.min(b.urls.length, 3);
        html += `<div style="display:grid;grid-template-columns:repeat(${gcols},1fr);gap:6px;margin:8px 0">${b.urls.map(u=>`<img src="${esc(u)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px" alt=""/>`).join('')}</div>`;
        break;
      }

      case 'table': {
        if (!b.rows?.length) break;
        const [head, ...body] = b.rows;
        const mkCell = (tag, cells) =>
          `<tr>${cells.map(c=>`<${tag} style="border:1px solid var(--border2);padding:8px 12px;text-align:left;font-size:14px;${tag==='th'?'background:var(--bg3);font-weight:600;':'background:var(--bg2);'}">${esc(c)}</${tag}>`).join('')}</tr>`;
        html += `<div style="overflow-x:auto;margin:10px 0"><table style="border-collapse:collapse;width:100%;min-width:300px">
          ${!b.noHeader ? `<thead>${mkCell('th', head)}</thead><tbody>${body.map(r=>mkCell('td',r)).join('')}</tbody>` : `<tbody>${b.rows.map(r=>mkCell('td',r)).join('')}</tbody>`}
        </table></div>`;
        break;
      }

      case 'model3d': {
        if (!b.src) break;
        const hMap3d = { small: 280, medium: 420, large: 580 };
        const mh = hMap3d[b.size] || 420;
        const attrs = b.autorotate ? 'auto-rotate camera-controls' : 'camera-controls';
        html += `<div style="margin:12px 0;border-radius:8px;overflow:hidden;border:1px solid var(--border2)">
          <model-viewer src="${esc(b.src)}" ${attrs} style="width:100%;height:${mh}px;background:var(--bg2)" shadow-intensity="1" environment-image="neutral" loading="lazy">
            <div slot="progress-bar" style="display:none"></div>
          </model-viewer>
        </div>`;
        break;
      }

      case 'stat': {
        const sc = b.color && /^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]{2,20}$/.test(b.color) ? b.color : 'var(--accent)';
        html += `<div style="display:inline-block;text-align:center;margin:10px 16px 10px 0;vertical-align:top;max-width:100%;word-break:break-all">
          <div style="font-size:clamp(1.4rem,4vw,2.6rem);font-weight:800;color:${sc};line-height:1.1">${esc(b.value)}</div>
          <div style="font-size:.8rem;color:var(--muted);margin-top:4px;max-width:120px;word-break:keep-all;white-space:normal">${esc(b.label)}</div>
        </div>`;
        break;
      }

      case 'progress': {
        const pc = b.color && /^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]{2,20}$/.test(b.color) ? b.color : 'var(--accent)';
        html += `<div style="margin:8px 0">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
            <span>${esc(b.label)}</span><span style="color:${pc};font-weight:600">${b.pct}%</span>
          </div>
          <div style="background:var(--bg3);border-radius:99px;height:10px;overflow:hidden">
            <div style="width:${b.pct}%;background:${pc};height:100%;border-radius:99px;transition:width .6s ease"></div>
          </div>
        </div>`;
        break;
      }

      case 'piechart':
      case 'donut':
      case 'barchart':
      case 'hbar':
      case 'linechart':
      case 'areachart':
      case 'radar': {
        if (!b.items?.length) break;
        const cid = 'c' + Math.random().toString(36).slice(2,8);
        const hMapC = { small: 220, medium: 320, large: 460 };
        const ch = hMapC[b.size] || 320;
        const isPie = b.type === 'piechart' || b.type === 'donut';
        html += `<div class="bn-chart" style="margin:12px 0;padding:14px;background:var(--bg2);border-radius:10px;border:1px solid var(--border2);width:100%;box-sizing:border-box" data-chart="${esc(JSON.stringify(b))}">
          ${b.title ? `<div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text);text-align:center">${esc(b.title)}</div>` : ''}
          <canvas id="${cid}" style="${isPie ? '' : `max-height:${ch}px`}"></canvas>
        </div>`;
        break;
      }

      // ── flashinfo 25종 렌더러 ──

      case 'timeline': {
        if (!b.items?.length) break;
        html += `<div style="margin:14px 0;position:relative;padding-left:24px;border-left:2px solid var(--accent)">`;
        b.items.forEach((it,i) => {
          html += `<div style="position:relative;margin-bottom:20px;break-inside:avoid">
            <div style="position:absolute;left:-30px;top:2px;width:12px;height:12px;border-radius:50%;background:${CHART_PALETTE[i%CHART_PALETTE.length]};border:2px solid var(--bg)"></div>
            <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px">${esc(it.label)}</div>
            <div style="font-size:14px;color:var(--text)">${esc(it.text)}</div>
          </div>`;
        });
        html += `</div>`; break;
      }

      case 'steps': {
        if (!b.items?.length) break;
        html += `<div style="display:flex;flex-wrap:wrap;gap:0;margin:14px 0;align-items:stretch">`;
        b.items.forEach((step,i) => {
          const c = CHART_PALETTE[i%CHART_PALETTE.length];
          const isLast = i===b.items.length-1;
          html += `<div style="display:flex;align-items:center;flex:1;min-width:100px;break-inside:avoid">
            <div style="flex:1;background:${c}22;border:1px solid ${c};border-radius:6px;padding:10px 12px;text-align:center">
              <div style="font-size:11px;font-weight:800;color:${c}">${i+1}</div>
              <div style="font-size:13px;color:var(--text);margin-top:2px">${esc(step)}</div>
            </div>
            ${!isLast?`<div style="font-size:18px;color:var(--muted);padding:0 4px">›</div>`:''}
          </div>`;
        });
        html += `</div>`; break;
      }

      case 'columns': {
        html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0">
          <div style="padding:14px;background:var(--bg2);border-radius:8px;border:1px solid var(--border2)">${esc(b.a||'')}</div>
          <div style="padding:14px;background:var(--bg2);border-radius:8px;border:1px solid var(--border2)">${esc(b.b||'')}</div>
        </div>`; break;
      }

      case 'cardrow': {
        if (!b.items?.length) break;
        html += `<div style="display:flex;flex-wrap:wrap;gap:12px;margin:12px 0">`;
        b.items.forEach(it => {
          const c = (it.color && /^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]{2,20}$/.test(it.color)) ? it.color : 'var(--accent)';
          html += `<div style="flex:1;min-width:140px;padding:14px;background:var(--bg2);border-radius:10px;border-top:3px solid ${c};border:1px solid var(--border2);break-inside:avoid">
            <div style="font-weight:700;color:${c};font-size:14px;margin-bottom:6px">${esc(it.title)}</div>
            <div style="font-size:13px;color:var(--text)">${esc(it.text)}</div>
          </div>`;
        });
        html += `</div>`; break;
      }

      case 'banner': {
        const bc = (b.color && /^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]{2,20}$/.test(b.color)) ? b.color : 'var(--accent)';
        html += `<div style="margin:12px 0;padding:16px 24px;background:${bc};border-radius:8px;text-align:center;font-weight:700;font-size:15px;color:#fff;break-inside:avoid">${esc(b.text)}</div>`; break;
      }

      case 'highlight': {
        const hc = (b.color && /^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]{2,20}$/.test(b.color)) ? b.color : 'var(--accent)';
        html += `<div style="display:flex;gap:14px;margin:12px 0;padding:16px;background:var(--bg2);border-radius:10px;border-left:4px solid ${hc};break-inside:avoid">
          <div style="font-size:28px;flex-shrink:0">${esc(b.icon)}</div>
          <div>
            <div style="font-weight:700;font-size:15px;color:${hc};margin-bottom:4px">${esc(b.title)}</div>
            <div style="font-size:13px;color:var(--text)">${esc(b.text)}</div>
          </div>
        </div>`; break;
      }

      case 'checklist': {
        if (!b.items?.length) break;
        html += `<div style="margin:10px 0">`;
        b.items.forEach(it => {
          html += `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border2)">
            <span style="color:#4ade80;font-size:16px;flex-shrink:0">✓</span>
            <span style="font-size:14px;color:var(--text)">${esc(it)}</span>
          </div>`;
        });
        html += `</div>`; break;
      }

      case 'numberedlist': {
        if (!b.items?.length) break;
        html += `<div style="margin:10px 0">`;
        b.items.forEach((it,i) => {
          const c = CHART_PALETTE[i%CHART_PALETTE.length];
          html += `<div style="display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px solid var(--border2);break-inside:avoid">
            <span style="min-width:26px;height:26px;border-radius:50%;background:${c};color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</span>
            <span style="font-size:14px;color:var(--text);padding-top:4px">${esc(it)}</span>
          </div>`;
        });
        html += `</div>`; break;
      }

      case 'iconrow': {
        if (!b.items?.length) break;
        html += `<div style="display:flex;flex-wrap:wrap;gap:16px;margin:12px 0;justify-content:center">`;
        b.items.forEach((it,i) => {
          html += `<div style="text-align:center;min-width:80px">
            <div style="font-size:32px">${esc(it.icon)}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(it.text)}</div>
          </div>`;
        });
        html += `</div>`; break;
      }

      case 'pictogram': {
        const total = b.count||10;
        html += `<div style="margin:10px 0">
          <div style="font-size:22px;letter-spacing:4px;line-height:1.6">`;
        for(let i=0;i<total;i++) html += esc(b.icon||'⭐');
        html += `</div>`;
        if(b.label) html += `<div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(b.label)}</div>`;
        html += `</div>`; break;
      }

      case 'divlabel': {
        html += `<div style="display:flex;align-items:center;gap:12px;margin:18px 0">
          <div style="flex:1;height:1px;background:var(--border2)"></div>
          <div style="font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;letter-spacing:.08em;text-transform:uppercase">${esc(b.text)}</div>
          <div style="flex:1;height:1px;background:var(--border2)"></div>
        </div>`; break;
      }

      case 'kpi': {
        const kc = (b.color && /^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]{2,20}$/.test(b.color)) ? b.color : 'var(--accent)';
        const changeColor = b.up ? '#4ade80' : b.down ? '#f87171' : 'var(--muted)';
        html += `<div style="display:inline-block;padding:16px 20px;background:var(--bg2);border-radius:10px;border:1px solid var(--border2);min-width:120px;margin:8px 10px 8px 0;break-inside:avoid;vertical-align:top">
          <div style="font-size:2rem;font-weight:800;color:${kc};line-height:1">${esc(b.value)}</div>
          ${b.change?`<div style="font-size:12px;color:${changeColor};font-weight:600;margin-top:2px">${esc(b.change)}</div>`:''}
          <div style="font-size:11px;color:var(--muted);margin-top:4px">${esc(b.label)}</div>
        </div>`; break;
      }

      case 'pullquote': {
        html += `<div style="margin:20px 0;padding:24px 28px;background:var(--bg2);border-radius:12px;text-align:center;break-inside:avoid">
          <div style="font-size:40px;color:var(--accent);line-height:.6;margin-bottom:12px">"</div>
          <div style="font-size:18px;font-weight:600;color:var(--text);line-height:1.6;font-style:italic">${esc(b.text)}</div>
          ${b.source?`<div style="margin-top:14px;font-size:13px;color:var(--muted)">— ${esc(b.source)}</div>`:''}
        </div>`; break;
      }

      case 'tagcloud': {
        if (!b.items?.length) break;
        const maxS = Math.max(...b.items.map(i=>i.size));
        html += `<div style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center">`;
        b.items.forEach((it,i) => {
          const ratio = it.size/maxS;
          const fs = 11 + Math.round(ratio*16);
          const op = 0.5 + ratio*0.5;
          html += `<span style="font-size:${fs}px;color:${CHART_PALETTE[i%CHART_PALETTE.length]};opacity:${op.toFixed(2)};font-weight:${ratio>0.6?700:400};padding:2px 4px">${esc(it.label)}</span>`;
        });
        html += `</div>`; break;
      }

      case 'versus': {
        if (!b.rows?.length) break;
        html += `<div style="margin:12px 0;break-inside:avoid">
          <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-bottom:10px;text-align:center">
            <div style="font-weight:700;color:${CHART_PALETTE[0]};font-size:15px">${esc(b.a)}</div>
            <div style="color:var(--muted);font-size:13px">vs</div>
            <div style="font-weight:700;color:${CHART_PALETTE[1]};font-size:15px">${esc(b.b)}</div>
          </div>`;
        b.rows.forEach(row => {
          const total = (row.av||0)+(row.bv||0)||1;
          const aPct = Math.round(row.av/total*100);
          html += `<div style="margin-bottom:8px">
            <div style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:3px">${esc(row.label)}</div>
            <div style="display:flex;height:20px;border-radius:99px;overflow:hidden">
              <div style="width:${aPct}%;background:${CHART_PALETTE[0]};display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:10px;color:#fff;font-weight:700">${row.av}</div>
              <div style="flex:1;background:${CHART_PALETTE[1]};display:flex;align-items:center;padding-left:6px;font-size:10px;color:#fff;font-weight:700">${row.bv}</div>
            </div>
          </div>`;
        });
        html += `</div>`; break;
      }

      case 'funnel': {
        if (!b.items?.length) break;
        const maxV = Math.max(...b.items.map(i=>i.value))||1;
        html += `<div style="margin:14px 0">`;
        b.items.forEach((it,i) => {
          const w = 40 + Math.round((it.value/maxV)*60);
          const c = CHART_PALETTE[i%CHART_PALETTE.length];
          html += `<div style="display:flex;flex-direction:column;align-items:center;margin-bottom:2px;break-inside:avoid">
            <div style="width:${w}%;background:${c};padding:10px 0;text-align:center;border-radius:4px;transition:width .3s">
              <span style="font-size:13px;font-weight:600;color:#fff">${esc(it.label)}</span>
              <span style="font-size:12px;color:rgba(255,255,255,.8);margin-left:8px">${it.value}</span>
            </div>
            ${i<b.items.length-1?`<div style="width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:8px solid ${c}"></div>`:''}
          </div>`;
        });
        html += `</div>`; break;
      }

      case 'pyramid': {
        if (!b.items?.length) break;
        const n = b.items.length;
        html += `<div style="margin:14px 0">`;
        b.items.forEach((it,i) => {
          const w = 20 + Math.round(((i+1)/n)*80);
          const c = CHART_PALETTE[i%CHART_PALETTE.length];
          html += `<div style="display:flex;justify-content:center;margin-bottom:2px;break-inside:avoid">
            <div style="width:${w}%;background:${c};padding:9px 0;text-align:center;border-radius:3px">
              <span style="font-size:12px;font-weight:600;color:#fff">${esc(it.label)}</span>
              ${it.value?`<span style="font-size:11px;color:rgba(255,255,255,.75);margin-left:6px">${it.value}</span>`:''}
            </div>
          </div>`;
        });
        html += `</div>`; break;
      }

      case 'gauge': {
        const gid2 = 'g' + Math.random().toString(36).slice(2,8);
        const gc = (b.color && /^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]{2,20}$/.test(b.color)) ? b.color : '#60a5fa';
        const angle = b.pct * 1.8; // 0~180도
        html += `<div style="margin:12px 0;text-align:center;break-inside:avoid">
          <div style="display:inline-block;position:relative;width:160px;height:85px;overflow:hidden">
            <div style="position:absolute;width:160px;height:160px;border-radius:50%;background:conic-gradient(${gc} 0deg ${angle}deg, var(--bg3) ${angle}deg 180deg, transparent 180deg 360deg);bottom:0"></div>
            <div style="position:absolute;width:120px;height:120px;border-radius:50%;background:var(--bg);bottom:-60px;left:20px"></div>
            <div style="position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:20px;font-weight:800;color:${gc}">${b.pct}%</div>
          </div>
          ${b.label?`<div style="font-size:13px;color:var(--muted);margin-top:8px">${esc(b.label)}</div>`:''}
        </div>`; break;
      }

      case 'bubbles': {
        if (!b.items?.length) break;
        const maxBV = Math.max(...b.items.map(i=>i.value))||1;
        html += `<div style="display:flex;flex-wrap:wrap;gap:12px;margin:12px 0;align-items:flex-end;justify-content:center">`;
        b.items.forEach((it,i) => {
          const sz = 40 + Math.round((it.value/maxBV)*80);
          const c = CHART_PALETTE[i%CHART_PALETTE.length];
          html += `<div style="display:flex;flex-direction:column;align-items:center;gap:6px">
            <div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${c}33;border:2px solid ${c};display:flex;align-items:center;justify-content:center;flex-direction:column">
              <span style="font-size:${Math.max(10,sz/5)}px;font-weight:700;color:${c}">${it.value}</span>
            </div>
            <span style="font-size:11px;color:var(--muted);text-align:center;max-width:80px">${esc(it.label)}</span>
          </div>`;
        });
        html += `</div>`; break;
      }

      case 'heatmap': {
        if (!b.rows?.length) break;
        const allVals = b.rows.flatMap(r=>r.map(c=>c.value));
        const minHV=Math.min(...allVals), maxHV=Math.max(...allVals)||1;
        html += `<div style="margin:12px 0;overflow-x:auto;break-inside:avoid">`;
        if(b.title) html += `<div style="font-size:13px;font-weight:600;margin-bottom:8px">${esc(b.title)}</div>`;
        html += `<table style="border-collapse:collapse;width:100%">`;
        b.rows.forEach(row => {
          html += `<tr>`;
          row.forEach(cell => {
            const ratio = (cell.value-minHV)/(maxHV-minHV||1);
            const r=Math.round(96*ratio+96), g=Math.round(165*(1-ratio)+50), bv=Math.round(250*(1-ratio)+50);
            html += `<td style="padding:8px 10px;background:rgb(${r},${g},${bv});text-align:center;font-size:12px;font-weight:600;color:#fff;border:1px solid rgba(0,0,0,.1)">
              <div style="font-size:10px;opacity:.8">${esc(cell.label)}</div>
              <div>${cell.value}</div>
            </td>`;
          });
          html += `</tr>`;
        });
        html += `</table></div>`; break;
      }

      case 'stacked':
      case 'mixed':
      case 'scatter':
      case 'bubblechart':
      case 'waterfall': {
        const cid2 = 'c' + Math.random().toString(36).slice(2,8);
        const hMapC2 = { small:220, medium:320, large:460 };
        const ch2 = hMapC2[b.size]||320;
        html += `<div class="bn-chart" style="margin:12px 0;padding:14px;background:var(--bg2);border-radius:10px;border:1px solid var(--border2);break-inside:avoid" data-chart="${esc(JSON.stringify(b))}">
          ${b.title?`<div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text)">${esc(b.title)}</div>`:''}
          <canvas id="${cid2}" style="max-height:${ch2}px"></canvas>
        </div>`; break;
      }

      case 'graph': {
        if (!b.fns?.length) break;
        const gid = 'g' + Math.random().toString(36).slice(2,8);
        const hMap = { small: 240, medium: 340, large: 480 };
        const gh = hMap[b.size] || 340;
        html += `<div id="${gid}" class="bn-graph" style="margin:12px 0;height:${gh}px;border-radius:8px;overflow:hidden;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px" data-fns="${esc(JSON.stringify(b.fns))}" data-xmin="${b.xMin}" data-xmax="${b.xMax}">그래프 로딩 중...</div>`;
        break;
      }

      // ── flashppt ──
      case 'slidecover': {
        const bgSpec = parseBgSpec(b.color || '#1e3a5f');
        const bgStyle = bgSpec ? bgSpec.cssProps : `background:${b.color||'#1e3a5f'};`;
        html += `<div style="${bgStyle}border-radius:10px;padding:60px 40px;text-align:center;margin:16px 0;break-inside:avoid;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div style="font-size:2.2rem;font-weight:800;color:#fff;line-height:1.3;margin-bottom:16px">${esc(b.title)}</div>
          ${b.subtitle?`<div style="font-size:1.1rem;color:rgba(255,255,255,.75);margin-bottom:0">${esc(b.subtitle)}</div>`:''}
        </div>`; break;
      }
      case 'slide': {
        if(!renderBlocks._slideNum) renderBlocks._slideNum=0;
        renderBlocks._slideNum++;
        const slideBgSpec = b.bg ? parseBgSpec(b.bg) : null;
        const bgCss = slideBgSpec ? slideBgSpec.cssProps : '';
        // 배경이 밝은지 판단: #fff / #f8 / #fa / white / light 계열 → 어두운 텍스트
        const isLight = b.bg && /(?:#f[0-9a-f]{5}|#f[0-9a-f]{2}\b|#fff|#ffffff|white|\|\s*#f[0-9a-f])/i.test(b.bg);
        const textCol  = isLight ? '#1e293b' : '#ffffff';
        const mutedCol = isLight ? '#475569' : 'rgba(255,255,255,.7)';
        const borderCol = isLight ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.2)';
        html += `<div style="position:relative;margin:24px 0 0;break-before:page;break-inside:avoid;border-radius:12px;overflow:hidden;${bgCss}${!bgCss?'background:var(--bg2);':''}" data-slide="${renderBlocks._slideNum}">
          ${b.meshColors ? `<div aria-hidden="true" style="position:absolute;inset:-12%;z-index:0;pointer-events:none;${makeMeshLayerStyle(b.meshColors,80)}"></div>` : ''}
          <div style="position:relative;z-index:1;padding:16px 20px 0;">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
              <span style="background:${isLight?'#3b82f6':'var(--accent)'};color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:99px">${renderBlocks._slideNum}</span>
              <div style="flex:1;height:1px;background:${borderCol}"></div>
            </div>
            <div style="font-size:1.4rem;font-weight:700;color:${textCol}">${esc(b.title)}</div>
            ${b.subtitle?`<div style="font-size:.95rem;color:${mutedCol};margin-top:4px">${esc(b.subtitle)}</div>`:''}
          </div>
          <div style="position:relative;z-index:1;padding:12px 20px 20px;--text:${textCol};--muted:${mutedCol};--muted2:${mutedCol};--border2:${borderCol};--bg3:${isLight?'rgba(255,255,255,.72)':'rgba(15,23,42,.42)'};--bg2:${isLight?'rgba(255,255,255,.9)':'rgba(15,23,42,.55)'};">
            ${b.content ? renderBlocks(b.content, true) : ''}
          </div>
        </div>`; break;
      }
      case 'slidebg': {
        // groupSpecialBlocks에서 이미 병합됨 — 단독 출현 시 무시
        break;
      }
      case 'slidenote': {
        html += `<div style="margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--muted2);font-size:11px;color:var(--muted);font-style:italic">📝 ${esc(b.text)}</div>`; break;
      }
      case 'agenda': {
        if (!b.items?.length) break;
        html += `<div style="display:flex;flex-direction:column;gap:8px;margin:12px 0">`;
        b.items.forEach((item, i) => {
          const col = CHART_PALETTE[i % CHART_PALETTE.length];
          html += `<div style="display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg3);border-radius:8px;border-left:3px solid ${col};break-inside:avoid">
            <span style="background:${col};color:#fff;font-size:11px;font-weight:700;min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</span>
            <span style="font-size:14px;color:var(--text);font-weight:500">${esc(item)}</span>
          </div>`;
        });
        html += `</div>`; break;
      }
      case 'columns2': {
        html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0;break-inside:avoid">
          <div style="background:var(--bg3);border-radius:8px;padding:16px;border:1px solid var(--border2)"><div style="font-size:13px;color:var(--text);line-height:1.7">${renderInlineContent(b.left)}</div></div>
          <div style="background:var(--bg3);border-radius:8px;padding:16px;border:1px solid var(--border2)"><div style="font-size:13px;color:var(--text);line-height:1.7">${renderInlineContent(b.right)}</div></div>
        </div>`; break;
      }

      // ── flashreport ──
      case 'reportcover': {
        html += `<div style="text-align:center;padding:60px 20px;margin:0 0 24px;border-bottom:2px solid var(--border2);break-inside:avoid">
          <div style="font-size:1.8rem;font-weight:800;color:var(--text);margin-bottom:12px;line-height:1.4">${esc(b.title)}</div>
          ${b.subtitle?`<div style="font-size:1rem;color:var(--muted);margin-bottom:24px">${esc(b.subtitle)}</div>`:''}
          <div style="font-size:.9rem;color:var(--muted)">${b.author?esc(b.author):''}${b.author&&b.date?' · ':''}${b.date?esc(b.date):''}</div>
        </div>`; break;
      }
      case 'abstract': {
        html += `<div style="background:var(--bg3);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:16px 20px;margin:16px 0;break-inside:avoid">
          <div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.1em;margin-bottom:8px">ABSTRACT / 요약</div>
          <div style="font-size:13px;color:var(--text);line-height:1.8;font-style:italic">${esc(b.text)}</div>
        </div>`; break;
      }
      case 'rh1': {
        if(!renderBlocks._h1) renderBlocks._h1=0;
        renderBlocks._h1++; renderBlocks._h2=0; renderBlocks._h3=0;
        html += `<div style="margin:24px 0 8px;break-after:avoid"><span style="font-size:1.3rem;font-weight:800;color:var(--text)">${renderBlocks._h1}. ${esc(b.text)}</span></div>`; break;
      }
      case 'rh2': {
        if(!renderBlocks._h2) renderBlocks._h2=0;
        renderBlocks._h2++; renderBlocks._h3=0;
        const h1n = renderBlocks._h1||1;
        html += `<div style="margin:16px 0 6px;break-after:avoid"><span style="font-size:1.1rem;font-weight:700;color:var(--text)">${h1n}.${renderBlocks._h2}. ${esc(b.text)}</span></div>`; break;
      }
      case 'rh3': {
        if(!renderBlocks._h3) renderBlocks._h3=0;
        renderBlocks._h3++;
        const h1n2=renderBlocks._h1||1, h2n=renderBlocks._h2||1;
        html += `<div style="margin:12px 0 4px;break-after:avoid"><span style="font-size:1rem;font-weight:600;color:var(--text)">${h1n2}.${h2n}.${renderBlocks._h3}. ${esc(b.text)}</span></div>`; break;
      }
      case 'footnote': {
        html += `<div style="margin-top:8px;padding-top:6px;border-top:1px solid var(--border2);font-size:11px;color:var(--muted)">* ${esc(b.text)}</div>`; break;
      }
      case 'caption': {
        html += `<div style="text-align:center;font-size:12px;color:var(--muted);font-style:italic;margin:4px 0 12px">${esc(b.text)}</div>`; break;
      }
      case 'toc': {
        html += `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 20px;margin:16px 0;break-inside:avoid">
          <div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.1em;margin-bottom:10px">목차 (Table of Contents)</div>
          <ol style="margin:0;padding-left:20px;color:var(--text);font-size:13px;line-height:1.9">
            ${b.items.map(it=>`<li>${esc(it)}</li>`).join('')}
          </ol>
        </div>`; break;
      }
      case 'transmittal': {
        html += `<div style="border:1px solid var(--border2);border-radius:8px;padding:16px 20px;margin:16px 0;break-inside:avoid">
          <div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.1em;margin-bottom:10px">전송문 (Transmittal Letter)</div>
          <div style="font-size:13px;color:var(--text);line-height:1.8">
            ${b.to?`<div><bt>수신:</bt> ${esc(b.to)}</div>`:''}
            ${b.from?`<div><bt>발신:</bt> ${esc(b.from)}</div>`:''}
            ${b.date?`<div><bt>날짜:</bt> ${esc(b.date)}</div>`:''}
            ${b.body?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border2)">${esc(b.body)}</div>`:''}
          </div>
        </div>`; break;
      }
      case 'experiment': {
        html += `<div style="background:var(--bg3);border-left:4px solid #60a5fa;border-radius:0 8px 8px 0;padding:16px 20px;margin:16px 0;break-inside:avoid">
          <div style="font-size:11px;font-weight:700;color:#60a5fa;letter-spacing:.1em;margin-bottom:8px">실험 개요: ${esc(b.name)}</div>
          <table style="width:100%;font-size:13px;color:var(--text);border-collapse:collapse">
            ${b.purpose?`<tr><td style="font-weight:700;width:80px;padding:3px 8px 3px 0;vertical-align:top">목적</td><td>${esc(b.purpose)}</td></tr>`:''}
            ${b.apparatus?`<tr><td style="font-weight:700;padding:3px 8px 3px 0;vertical-align:top">장치·재료</td><td>${esc(b.apparatus)}</td></tr>`:''}
            ${b.method?`<tr><td style="font-weight:700;padding:3px 8px 3px 0;vertical-align:top">방법</td><td>${esc(b.method)}</td></tr>`:''}
          </table>
        </div>`; break;
      }
      case 'recommendation': {
        html += `<div style="background:#4ade8022;border:1px solid #4ade80;border-radius:8px;padding:16px 20px;margin:16px 0;break-inside:avoid">
          <div style="font-size:11px;font-weight:700;color:#4ade80;letter-spacing:.1em;margin-bottom:8px">★ 권고안 (Recommendation)</div>
          <div style="font-size:13px;color:var(--text);line-height:1.8">${esc(b.text)}</div>
        </div>`; break;
      }
      case 'glossary': {
        html += `<div style="display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:13px;color:var(--text);margin:4px 0;break-inside:avoid">
          <div style="font-weight:700;color:var(--accent)">${esc(b.term)}</div>
          <div style="color:var(--muted)">${esc(b.def)}</div>
        </div>`; break;
      }
      case 'appendix': {
        html += `<div style="border:1px dashed var(--border2);border-radius:8px;padding:14px 18px;margin:16px 0;break-inside:avoid">
          <div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;margin-bottom:8px">【부록】 ${esc(b.title)}</div>
          ${b.body?`<div style="font-size:13px;color:var(--text);line-height:1.8">${esc(b.body)}</div>`:''}
        </div>`; break;
      }

      // ── flashresume ──
      case 'resumeheader': {
        html += `<div style="padding:20px 0 16px;border-bottom:2px solid var(--accent);margin-bottom:16px;break-inside:avoid">
          <div style="font-size:1.8rem;font-weight:800;color:var(--text)">${esc(b.name)}</div>
          <div style="font-size:1rem;color:var(--accent);font-weight:600;margin:4px 0">${esc(b.role)}</div>
          <div style="font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;margin-top:6px">
            ${b.email?`<span>✉ ${esc(b.email)}</span>`:''}
            ${b.phone?`<span>📞 ${esc(b.phone)}</span>`:''}
            ${b.link?`<span>🔗 ${esc(b.link)}</span>`:''}
          </div>
        </div>`; break;
      }
      case 'resumesection': {
        html += `<div style="margin:18px 0 8px;break-after:avoid">
          <div style="font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--border2);padding-bottom:4px">${esc(b.text)}</div>
        </div>`; break;
      }
      case 'experience': {
        html += `<div style="margin-bottom:14px;break-inside:avoid">
          <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px">
            <span style="font-weight:700;font-size:14px;color:var(--text)">${esc(b.company)}</span>
            <span style="font-size:12px;color:var(--muted)">${esc(b.period)}</span>
          </div>
          <div style="font-size:13px;color:var(--accent);margin:2px 0">${esc(b.role)}</div>
          <div style="font-size:13px;color:var(--muted);margin-top:4px">${esc(b.desc)}</div>
        </div>`; break;
      }
      case 'education': {
        html += `<div style="margin-bottom:10px;break-inside:avoid;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px">
          <div>
            <span style="font-weight:700;font-size:14px;color:var(--text)">${esc(b.school)}</span>
            <span style="font-size:13px;color:var(--muted);margin-left:8px">${esc(b.major)}</span>
            ${b.degree?`<span style="font-size:12px;color:var(--accent);margin-left:6px">${esc(b.degree)}</span>`:''}
          </div>
          <span style="font-size:12px;color:var(--muted)">${esc(b.period)}</span>
        </div>`; break;
