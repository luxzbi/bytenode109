<style>
:root {
  --bg:       #0a0a0a;
  --bg2:      #111111;
  --bg3:      #1a1a1a;
  --border:   rgba(255,255,255,0.08);
  --border2:  rgba(255,255,255,0.14);
  --text:     #e8e8e8;
  --muted:    #888;
  --muted2:   #555;
  --white:    #fff;
  --accent:   #c8c8c8;
  --danger:   #e05252;
  --success:  #52c87a;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI","Apple SD Gothic Neo",sans-serif;}
a{color:inherit;text-decoration:none;}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit;}
input,textarea,select{font-family:inherit;}

/* ── 배너 ── */
#banner{
  position:fixed;top:0;left:0;right:0;z-index:999;
  background:#1c1c1c;border-bottom:1px solid var(--border2);
  padding:8px 20px;display:flex;align-items:center;justify-content:space-between;
  font-size:13px;color:var(--accent);
  transform:translateY(-100%);transition:transform .35s ease;
}
#banner.show{transform:translateY(0);}
#banner .banner-close{opacity:.5;font-size:18px;line-height:1;margin-left:12px;}
#banner .banner-close:hover{opacity:1;}

/* ── 헤더 ── */
#header{
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,10,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
}
#header .logo{font-size:1.25rem;font-weight:800;letter-spacing:.12em;color:var(--white);}
#header .logo span{color:var(--muted);}
.header-right{display:flex;align-items:center;gap:12px;overflow:hidden;flex-wrap:nowrap;}
.hamburger{
  display:none;background:none;border:1px solid var(--border2);
  border-radius:6px;padding:5px 9px;cursor:pointer;color:var(--text);
  font-size:18px;line-height:1;
}
.mobile-nav{
  display:none;position:fixed;top:50px;left:0;right:0;z-index:200;
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:10px 12px;flex-direction:column;gap:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  max-height:calc(100vh - 50px);overflow-y:auto;
}
.mobile-nav.open{display:flex;}
.mobile-nav .hbtn{width:100%;text-align:left;padding:11px 14px;font-size:14px;border-radius:8px;}
.mobile-nav .avatar-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.mobile-nav .avatar-row img,.mobile-nav .avatar-row span.av{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:14px;}
.mobile-nav-overlay{display:none;position:fixed;inset:0;z-index:199;background:rgba(0,0,0,.3);}
.mobile-nav-overlay.open{display:block;}
.hbtn{
  padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;
  border:1px solid var(--border2);background:transparent;color:var(--text);
  transition:background .18s,border-color .18s;white-space:nowrap;flex-shrink:0;
}
.hbtn:hover{background:var(--bg3);border-color:var(--accent);}
.hbtn.primary{background:var(--white);color:#111;border-color:var(--white);}
.hbtn.primary:hover{background:#ddd;}
.avatar-btn{
  width:32px;height:32px;border-radius:50%;overflow:hidden;
  border:1px solid var(--border2);background:var(--bg3);
  display:flex;align-items:center;justify-content:center;font-size:14px;
  cursor:pointer;
}
.avatar-btn img{width:100%;height:100%;object-fit:cover;}

/* ── 메인 레이아웃 ── */
#app{min-height:calc(100vh - 52px);}

/* ── 페이지 공통 ── */
.page{max-width:840px;margin:0 auto;padding:36px 20px 80px;}
.page-wide{max-width:1100px;margin:0 auto;padding:36px 20px 80px;}

/* ── 홈 피드 ── */
.feed-grid{display:flex;flex-direction:column;gap:1px;border:1px solid var(--border);}
.feed-card{
  background:var(--bg2);padding:22px 26px;
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;
  border-bottom:1px solid var(--border);transition:background .15s;
  cursor:pointer;
}
.feed-card:last-child{border-bottom:none;}
.feed-card:hover{background:var(--bg3);}
.feed-card-info{}
.feed-card-title{font-size:1.1rem;font-weight:700;color:var(--white);margin-bottom:6px;line-height:1.4;}
.feed-card-meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;}
.feed-card-cover{
  width:90px;height:68px;border-radius:4px;overflow:hidden;
  background:var(--bg3);flex-shrink:0;
}
.feed-card-cover img{width:100%;height:100%;object-fit:cover;}
.tag{
  display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;
  background:var(--bg3);border:1px solid var(--border2);color:var(--muted);margin-right:4px;margin-top:4px;
}

/* ── 게시글 상세 ── */
.post-header{margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:20px;}
.post-title{font-size:1.9rem;font-weight:800;color:var(--white);line-height:1.3;margin-bottom:10px;}
.post-meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;}
.post-body{line-height:1.7;}

/* ── 커스텀 에디터 ── */
.editor-wrap{
  border:1px solid var(--border2);border-radius:8px;overflow:hidden;
  background:var(--bg2);
}
.editor-toolbar{
  background:var(--bg3);border-bottom:1px solid var(--border);
  padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
}
.editor-toolbar button{
  padding:4px 10px;border-radius:4px;font-size:12px;font-weight:600;
  border:1px solid var(--border2);background:var(--bg2);color:var(--text);
}
.editor-toolbar button:hover{background:var(--bg);border-color:var(--accent);}
.editor-toolbar .sep{width:1px;height:20px;background:var(--border2);margin:0 4px;}
.editor-grid{
  display:grid;
  padding:16px;gap:0;
  font-family:"Courier New",monospace;
}
.editor-cell{
  border:1px solid rgba(255,255,255,0.05);
  min-height:28px;
  display:flex;align-items:center;
  position:relative;
  overflow:hidden;
}
.editor-cell.empty{background:transparent;}
#codeInput{
  width:100%;background:var(--bg3);color:var(--text);border:none;outline:none;
  font-family:"Courier New",monospace;font-size:13px;line-height:1.6;
  padding:16px;resize:none;min-height:200px;
  overflow-x:auto;overflow-y:auto;
  white-space:pre;word-wrap:normal;
}
#codeInput::-webkit-scrollbar{height:6px;background:var(--bg2);}
#codeInput::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:3px;}
.editor-tabs{display:flex;border-bottom:1px solid var(--border);}
.editor-tab{
  padding:8px 18px;font-size:13px;font-weight:600;
  border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);
}
.editor-tab.active{border-bottom-color:var(--white);color:var(--white);}

/* ── PPT 슬라이드 에디터 ── */
#pptEditorWrap{display:none;border:1px solid var(--border2);border-radius:8px;overflow:hidden;background:var(--bg2);margin-bottom:16px;}
.ppt-editor-inner{display:flex;min-height:480px;}
#pptSlideList{
  width:180px;flex-shrink:0;background:var(--bg3);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.ppt-list-header{
  padding:10px 12px;font-size:11px;font-weight:700;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.ppt-slide-item{
  padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
  transition:background .15s;min-height:52px;position:relative;
}
.ppt-slide-item:hover{background:rgba(255,255,255,.04);}
.ppt-slide-item.active{background:rgba(255,255,255,.08);color:var(--text);}
.ppt-slide-num{
  font-size:10px;font-weight:700;min-width:18px;height:18px;
  background:var(--muted2);color:#fff;border-radius:4px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.ppt-slide-item.active .ppt-slide-num{background:var(--accent);}
.ppt-slide-title{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.3}
.ppt-slide-del{
  opacity:0;font-size:15px;color:var(--danger);padding:2px 4px;border-radius:4px;
  transition:opacity .15s;flex-shrink:0;line-height:1;
}
.ppt-slide-item:hover .ppt-slide-del{opacity:.7;}
.ppt-slide-del:hover{opacity:1 !important;}
.ppt-add-btn{
  margin:10px;padding:7px;border-radius:6px;font-size:12px;font-weight:600;
  border:1px dashed var(--border2);color:var(--muted);text-align:center;cursor:pointer;
  transition:background .15s,color .15s;
}
.ppt-add-btn:hover{background:rgba(255,255,255,.05);color:var(--text);}
.ppt-add-duplicate{
  margin:0 10px 6px;padding:5px;border-radius:6px;font-size:11px;
  border:1px dashed var(--border2);color:var(--muted2);text-align:center;cursor:pointer;
  transition:background .15s;
}
.ppt-add-duplicate:hover{background:rgba(255,255,255,.04);color:var(--muted);}
#pptCodeArea{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.ppt-code-header{
  padding:8px 14px;background:var(--bg3);border-bottom:1px solid var(--border);
  font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;
}
#pptSlideInput{
  flex:1;width:100%;background:var(--bg3);color:var(--text);border:none;outline:none;
  font-family:"Courier New",monospace;font-size:13px;line-height:1.6;
  padding:16px;resize:none;min-height:200px;overflow-x:auto;overflow-y:auto;
  white-space:pre;word-wrap:normal;
}
#pptSlideInput::-webkit-scrollbar{width:6px;background:var(--bg2);}
#pptSlideInput::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:3px;}
.ppt-toolbar{
  display:flex;align-items:center;gap:8px;padding:8px 14px;
  background:var(--bg3);border-top:1px solid var(--border);flex-wrap:wrap;
}
.ppt-preview-panel{padding:20px;overflow:auto;}

/* ── 발표 모드 ── */
#presentOverlay{
  display:none;position:fixed;inset:0;z-index:9999;
  background:#000;flex-direction:column;
}
#presentOverlay.active{display:flex;}
#presentSlide{
  flex:1;display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.present-slide-content{
  width:100%;max-width:calc(100vh * 16/9);
  aspect-ratio:16/9;background:#0a0a0a;
  position:relative;overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,.8);
}
.present-slide-content .rendered-body{
  padding:40px 56px;height:100%;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-start;
}
#presentNav{
  height:48px;background:rgba(0,0,0,.7);display:flex;
  align-items:center;justify-content:space-between;padding:0 24px;
  gap:16px;flex-shrink:0;
}
#presentNav button{
  padding:6px 18px;border-radius:6px;font-size:13px;font-weight:600;
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);
  color:#fff;cursor:pointer;transition:background .15s;
}
#presentNav button:hover{background:rgba(255,255,255,.18);}
#presentNav button:disabled{opacity:.3;cursor:default;}
#presentCounter{font-size:13px;color:rgba(255,255,255,.6);}
#presentProgress{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.1);}
#presentProgressBar{height:100%;background:#60a5fa;transition:width .3s;}

/* ── 렌더된 본문 ── */
.rendered-body{}
.r-title{font-size:2rem;font-weight:800;line-height:1.3;margin-bottom:16px;}
.r-block{margin-bottom:4px;line-height:1.6;}
.r-img{display:block;max-width:100%;border-radius:4px;margin:8px 0;}
.r-hr-v{display:inline-block;width:1px;background:var(--border2);vertical-align:middle;margin:0 4px;}
.r-hr-h{display:block;border:none;height:1px;background:var(--border2);margin:8px 0;}
.r-video{max-width:100%;border-radius:4px;margin:8px 0;}

/* ── 모달 ── */
.modal-overlay{
  position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--bg2);border:1px solid var(--border2);border-radius:10px;
  padding:32px;width:90%;max-width:480px;
  transform:translateY(12px);transition:transform .2s;
  max-height:90vh;overflow-y:auto;
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal h2{font-size:1.25rem;font-weight:700;margin-bottom:20px;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
.form-row input,.form-row textarea,.form-row select{
  width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;
  padding:9px 12px;color:var(--text);font-size:14px;outline:none;
}
.form-row input:focus,.form-row textarea:focus{border-color:var(--accent);}
.form-row textarea{resize:vertical;min-height:80px;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.btn{
  padding:8px 20px;border-radius:6px;font-size:14px;font-weight:600;
  border:1px solid var(--border2);background:var(--bg3);color:var(--text);
  cursor:pointer;transition:background .15s;
}
.btn:hover{background:var(--bg);}
.btn.primary{background:var(--white);color:#111;border-color:var(--white);}
.btn.primary:hover{background:#ddd;}
.btn.danger{background:rgba(224,82,82,.12);color:var(--danger);border-color:rgba(224,82,82,.3);}
.btn.danger:hover{background:rgba(224,82,82,.22);}

/* ── 관리자 패널 ── */
.admin-sidebar{
  width:200px;flex-shrink:0;border-right:1px solid var(--border);
  padding:20px 0;
}
.admin-sidebar a{
  display:block;padding:9px 20px;font-size:14px;color:var(--muted);
  border-left:3px solid transparent;transition:color .15s;
}
.admin-sidebar a:hover,.admin-sidebar a.active{color:var(--white);border-left-color:var(--white);background:var(--bg3);}
.admin-layout{display:flex;min-height:calc(100vh - 52px);}
.admin-content{flex:1;padding:32px;overflow-x:auto;}
.admin-mobile-tabs{
  display:none;overflow-x:auto;gap:6px;padding:10px 14px;
  border-bottom:1px solid var(--border);background:var(--bg2);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.admin-mobile-tabs::-webkit-scrollbar{display:none;}
.admin-mobile-tabs a{
  white-space:nowrap;flex-shrink:0;padding:7px 14px;border-radius:20px;
  font-size:13px;border:1px solid var(--border2);color:var(--muted);
}
.admin-mobile-tabs a.active{background:var(--white);color:#111;border-color:var(--white);}
.admin-title{font-size:1.4rem;font-weight:700;margin-bottom:20px;}
.admin-table{width:100%;border-collapse:collapse;font-size:13px;}
.admin-table th,.admin-table td{padding:10px 14px;border-bottom:1px solid var(--border);text-align:left;}
.admin-table th{color:var(--muted);font-weight:600;background:var(--bg3);}
.admin-table tr:hover td{background:var(--bg3);}

/* ── 내 저장소 ── */
.mybox-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;transition:background .15s;}
.mybox-item:hover{background:var(--bg3);}
.mybox-vis{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap;flex-shrink:0;}
.mybox-vis.pub{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3);}
.mybox-vis.priv{background:rgba(148,163,184,.12);color:#94a3b8;border:1px solid rgba(148,163,184,.25);}
.mybox-title{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mybox-date{font-size:11px;color:var(--muted);flex-shrink:0;white-space:nowrap;}
.mybox-del{font-size:11px;padding:3px 8px;flex-shrink:0;}
.mybox-quota{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-bottom:20px;}
.mybox-quota-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#a78bfa);transition:width .4s;}

/* ── 프롬프트 목록 ── */
.prompt-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;transition:background .15s;}
.prompt-row:hover{background:var(--bg3);}
.prompt-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(139,92,246,.18);color:#a78bfa;border:1px solid rgba(139,92,246,.3);white-space:nowrap;flex-shrink:0;}
.prompt-name{font-size:13px;font-weight:600;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prompt-note{font-size:11px;color:var(--muted);flex-shrink:0;}
.prompt-date{font-size:11px;color:var(--muted2);flex-shrink:0;white-space:nowrap;}
.prompt-detail{display:none;padding:12px 14px 14px;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;background:var(--bg);margin-top:-4px;}
.prompt-detail.open{display:block;}
.prompt-detail pre{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:12px 14px;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:var(--text);max-height:320px;overflow-y:auto;}
.prompt-copy-btn{margin-top:8px;font-size:12px;padding:4px 14px;}

/* ── 공지 패널 ── */
.notice-list{display:flex;flex-direction:column;gap:10px;}
.notice-item{
  background:var(--bg3);border:1px solid var(--border);border-radius:6px;
  padding:14px 18px;
}
.notice-item h4{font-size:14px;font-weight:700;margin-bottom:4px;}
.notice-item p{font-size:13px;color:var(--muted);}
.notice-item .notice-meta{font-size:11px;color:var(--muted2);margin-top:6px;}

/* ── 계정설정 ── */
.settings-section{
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:24px;margin-bottom:16px;
}
.settings-section h3{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--white);}
.avatar-preview{
  width:72px;height:72px;border-radius:50%;border:2px solid var(--border2);
  object-fit:cover;background:var(--bg3);margin-bottom:10px;
}

/* ── 로그인/가입 ── */
.auth-wrap{
  display:flex;align-items:center;justify-content:center;
  min-height:calc(100vh - 52px);
}
.auth-box{
  width:90%;max-width:400px;
  background:var(--bg2);border:1px solid var(--border2);border-radius:10px;
  padding:36px 32px;
}
.auth-box h2{font-size:1.4rem;font-weight:800;margin-bottom:24px;text-align:center;}
.auth-switch{text-align:center;font-size:13px;color:var(--muted);margin-top:14px;}
.auth-switch a{color:var(--accent);cursor:pointer;}

/* ── 에디터 미리보기 그리드 ── */
.preview-grid{
  display:grid;gap:0;
  border:1px solid var(--border);
  background:var(--bg2);
}
.preview-row{display:flex;}
.preview-cell{
  border:1px solid rgba(255,255,255,0.04);
  display:flex;align-items:center;justify-content:center;
  min-height:28px;overflow:hidden;
  font-size:13px;position:relative;
}

/* ── byteflash ── */
.flashdeck{position:relative;width:100%;max-width:560px;margin:18px auto;}
.flashdeck-viewport{width:100%;perspective:1200px;}
.flash-card{width:100%;min-height:180px;position:relative;transform-style:preserve-3d;transition:transform .5s ease;cursor:pointer;}
.flash-card.flipped{transform:rotateY(180deg);}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:28px 24px;font-size:1.05rem;line-height:1.6;text-align:center;}
.flash-front{background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(139,92,246,.12));border:1px solid rgba(139,92,246,.35);}
.flash-back{background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(5,150,105,.08));border:1px solid rgba(16,185,129,.35);transform:rotateY(180deg);}
.flashdeck-nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px;}
.flashdeck-nav button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#ccc;border-radius:8px;padding:5px 14px;cursor:pointer;font-size:13px;}
.flashdeck-nav button:hover{background:rgba(255,255,255,.13);}
.flashdeck-counter{font-size:12px;color:#888;}
.flashdeck-hint{font-size:11px;color:#666;text-align:center;margin-top:4px;}

/* ── bytestep ── */
.stepgroup{display:flex;flex-direction:column;gap:0;margin:18px 0;}
.step-item{display:flex;gap:0;opacity:.45;transition:opacity .3s;}
.step-item.active{opacity:1;}
.step-left{display:flex;flex-direction:column;align-items:center;width:36px;flex-shrink:0;}
.step-circle{width:32px;height:32px;border-radius:50%;background:rgba(99,102,241,.25);border:2px solid rgba(99,102,241,.5);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#a5b4fc;flex-shrink:0;transition:background .3s,border-color .3s;}
.step-item.active .step-circle{background:rgba(99,102,241,.6);border-color:#818cf8;color:#fff;}
.step-line{width:2px;flex:1;min-height:20px;background:rgba(255,255,255,.08);}
.step-item:last-child .step-line{display:none;}
.step-body{padding:4px 0 20px 14px;flex:1;}
.step-title{font-weight:600;font-size:1rem;margin-bottom:4px;color:#e2e8f0;}
.step-content{font-size:.9rem;color:#94a3b8;line-height:1.6;}
.stepgroup-controls{display:flex;gap:8px;margin-top:4px;padding-left:50px;}
.stepgroup-controls button{background:rgba(99,102,241,.2);border:1px solid rgba(99,102,241,.4);color:#a5b4fc;border-radius:7px;padding:4px 14px;cursor:pointer;font-size:13px;}
.stepgroup-controls button:hover{background:rgba(99,102,241,.35);}

/* ── byteflow ── */
.flowgraph-wrap{position:relative;overflow:auto;margin:18px 0;}
.flowgraph-svg{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;}
.flowgraph-nodes{display:flex;flex-wrap:wrap;gap:14px;padding:16px;position:relative;z-index:1;}
.flow-node{border-radius:10px;padding:10px 18px;font-size:.9rem;font-weight:500;border:1px solid rgba(99,102,241,.4);background:rgba(99,102,241,.13);color:#c7d2fe;white-space:nowrap;cursor:default;}

/* ── byteroadmap ── */
.roadmap{display:flex;flex-direction:column;gap:0;margin:18px 0;position:relative;padding-left:28px;}
.roadmap::before{content:'';position:absolute;left:10px;top:8px;bottom:8px;width:2px;background:linear-gradient(to bottom,rgba(139,92,246,.6),rgba(99,102,241,.3));}
.roadmap-item{position:relative;padding:0 0 28px 24px;}
.roadmap-item::before{content:'';position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:50%;background:#7c3aed;border:2px solid #a78bfa;box-shadow:0 0 8px rgba(139,92,246,.5);}
.roadmap-period{font-size:.78rem;font-weight:600;color:#a78bfa;letter-spacing:.04em;margin-bottom:3px;}
.roadmap-title{font-size:1rem;font-weight:700;color:#e2e8f0;margin-bottom:6px;}
.roadmap-body{font-size:.88rem;color:#94a3b8;line-height:1.6;}
.roadmap-badge{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;}
.badge-green{background:rgba(16,185,129,.2);color:#34d399;border:1px solid rgba(16,185,129,.35);}
.badge-blue{background:rgba(59,130,246,.2);color:#60a5fa;border:1px solid rgba(59,130,246,.35);}
.badge-red{background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(239,68,68,.35);}
.badge-yellow{background:rgba(245,158,11,.2);color:#fbbf24;border:1px solid rgba(245,158,11,.35);}
.badge-purple{background:rgba(139,92,246,.2);color:#a78bfa;border:1px solid rgba(139,92,246,.35);}
.badge-gray{background:rgba(148,163,184,.15);color:#94a3b8;border:1px solid rgba(148,163,184,.25);}

/* ── 반응형 ── */
/* 태블릿 + 모바일: 1024px 이하에서 햄버거 메뉴 */
@media(max-width:1024px){
  #header{padding:0 14px;height:50px;}
  .header-right{display:none;}
  .hamburger{display:block;}
  input,textarea,select{font-size:16px!important;}
}
@media(max-width:600px){
  /* 피드 */
  .page{padding:20px 12px 60px;}
  .page-wide{padding:20px 12px 60px;}
  .feed-card{padding:14px 12px;}
  .feed-card-cover{width:64px;height:50px;}
  .feed-card-title{font-size:1rem;}
  /* 게시글 */
  .post-title{font-size:1.4rem;}
  .post-actions{flex-wrap:wrap;}
  /* 에디터 */
  #codeInput,#pptSlideInput{font-size:12px;min-height:160px;}
  .ppt-editor-inner{flex-direction:column;}
  #pptSlideList{width:100%;height:auto;max-height:180px;border-right:none;border-bottom:1px solid var(--border);}
  .editor-toolbar{gap:4px;}
  .editor-toolbar button{padding:3px 7px;font-size:11px;}
  /* 모드 선택 헤더 */
  #writeModalGrid{grid-template-columns:1fr !important;}
  /* 관리자 */
  .admin-sidebar{display:none;}
  .admin-mobile-tabs{display:flex!important;}
  .admin-layout{flex-direction:column;}
  .admin-content{padding:14px;overflow-x:auto;}
  .admin-table{font-size:12px;}
  .admin-table th,.admin-table td{padding:7px 8px;}
  /* 인증 */
  .auth-box{padding:24px 18px;}
  /* freecanvas 모바일: 절대위치 레이아웃 숨기고 스택 표시 */
  .freecanvas-wrap{display:none!important;}
  .freecanvas-mobile{display:flex!important;}
  /* ppt-grid 모바일: 단일 컬럼 */
  .ppt-grid-inner{grid-template-columns:1fr!important;}
}

.err{color:var(--danger);font-size:13px;margin-top:6px;}
.ok{color:var(--success);font-size:13px;margin-top:6px;}
.spinner{
  display:inline-block;width:18px;height:18px;border-radius:50%;
  border:2px solid rgba(255,255,255,.2);border-top-color:var(--white);
  animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── 코드 설명서 모달 ── */
.help-content{font-size:13px;line-height:1.8;color:var(--text);}
.help-content h3{color:var(--white);font-size:14px;margin:16px 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px;}
.help-content code{
  background:var(--bg3);border:1px solid var(--border);
  padding:1px 6px;border-radius:3px;font-family:"Courier New",monospace;font-size:12px;color:#aef;
}
.help-content .cmd-row{display:flex;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
.help-content .cmd{
  background:var(--bg3);border:1px solid var(--border2);padding:3px 8px;
  border-radius:3px;font-family:"Courier New",monospace;font-size:12px;color:#aef;
}
.help-content .desc{font-size:12px;color:var(--muted);padding-top:2px;}

.post-actions{display:flex;gap:8px;margin-top:16px;}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:20px;}
.back-btn:hover{color:var(--white);}
</style>
</head>
<body>

<!-- 발표 모드 오버레이 -->
<div id="presentOverlay">
  <div id="presentProgress"><div id="presentProgressBar" style="width:0%"></div></div>
  <div id="presentSlide">
    <div class="present-slide-content">
      <div id="presentBody" class="rendered-body"></div>
    </div>
  </div>
  <div id="presentNav">
    <button id="presentPrev" onclick="presentMove(-1)">◀ 이전</button>
    <div style="display:flex;align-items:center;gap:16px">
      <span id="presentCounter">1 / 1</span>
      <button onclick="endPresentation()" style="background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4)">✕ 종료</button>
    </div>
    <button id="presentNext" onclick="presentMove(1)">다음 ▶</button>
  </div>
</div>

<!-- 배너 공지 -->
<div id="banner">
  <span id="bannerText"></span>
  <button class="banner-close" onclick="closeBanner()">✕</button>
</div>

<!-- 헤더 -->
<div id="header">
  <div class="logo" onclick="showPage('home')" style="cursor:pointer">byte<span>node</span><span id="logoBadge" hidden style="font-size:.55rem;font-weight:400;color:var(--muted);letter-spacing:.05em;margin-left:7px;vertical-align:middle"></span></div>
  <div class="header-right" id="headerRight"></div>
  <button class="hamburger" id="hamburgerBtn" onclick="toggleMobileMenu()">☰</button>
</div>
<div class="mobile-nav-overlay" id="mobileNavOverlay" onclick="closeMobileMenu()"></div>
<div class="mobile-nav" id="mobileNav"></div>

<div id="app"></div>

<footer id="siteFooter" style="text-align:center;padding:32px 20px 40px;font-size:13px;color:var(--muted);border-top:1px solid var(--border);margin-top:60px">
  <div style="margin-bottom:8px">
    <a href="/privacy.html" style="color:var(--muted);text-decoration:none;margin:0 10px" onmouseover="this.style.color='var(--fg)'" onmouseout="this.style.color='var(--muted)'">개인정보처리방침</a>
    <span style="opacity:.4">|</span>
    <a href="/terms.html" style="color:var(--muted);text-decoration:none;margin:0 10px" onmouseover="this.style.color='var(--fg)'" onmouseout="this.style.color='var(--muted)'">이용약관</a>
    <span style="opacity:.4">|</span>
    <a href="/licenses.html" style="color:var(--muted);text-decoration:none;margin:0 10px" onmouseover="this.style.color='var(--fg)'" onmouseout="this.style.color='var(--muted)'">오픈소스 라이선스</a>
  </div>
  <div style="opacity:.45">© 2026 bytenode. AI 생성 콘텐츠가 포함될 수 있습니다.</div>
</footer>

<!-- 공통 모달 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modalBox"></div>
</div>

<script src="/app-main.js"></script>

<!-- 챗봇 위젯 -->
<div id="chatbotWidget" style="position:fixed;right:20px;bottom:20px;z-index:9000;display:flex;flex-direction:column;align-items:flex-end;gap:10px">
  <div id="chatbotWindow" style="display:none;width:360px;height:560px;background:rgba(18,18,28,.96);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:16px;overflow:hidden;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,.6)">
    <div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);flex-shrink:0">
      <span style="font-size:20px">🤖</span>
      <div>
        <div style="font-size:14px;font-weight:700;color:#e2e8f0">bytenode AI 도우미</div>
        <div style="font-size:11px;color:rgba(255,255,255,.45)">무엇이든 물어보세요</div>
      </div>
      <button onclick="chatbotClose()" style="margin-left:auto;background:none;border:none;color:rgba(255,255,255,.5);font-size:20px;cursor:pointer;line-height:1">✕</button>
    </div>
    <div id="chatbotMessages" style="flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth"></div>
    <div id="chatbotBtns" style="overflow-y:auto;padding:8px 12px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:5px;max-height:150px"></div>
    <div style="padding:10px 12px;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:6px;flex-shrink:0">
      <input id="chatbotInput" type="text" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter')chatbotSendAI()" style="flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 12px;color:#e2e8f0;font-size:13px;outline:none">
      <button onclick="chatbotSendAI()" style="background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;border-radius:8px;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">➤</button>
    </div>
  </div>
  <button id="chatbotToggle" onclick="chatbotToggle()" style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 20px rgba(59,130,246,.5);transition:transform .15s" onmouseover="this.style.transform='scale(1.08)'" onmouseout="this.style.transform='scale(1)'">💬</button>
</div>

<script src="/app-init.js"></script>
</body>
</html>
