        const c = (b.color && /^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]{2,30}$|^rgba?\([\d\s,%.]+\)$/.test(b.color)) ? b.color : 'var(--border2)';
        html += `<hr style="border:none;border-top:1px solid ${c};margin:8px 0;width:100%"/>`;
        break;
      }

      case 'vr': {
        const c = (b.color && /^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]{2,30}$|^rgba?\([\d\s,%.]+\)$/.test(b.color)) ? b.color : 'var(--border2)';
        const h = b.lenQ ? b.lenQ*28+'px' : '1.4em';
        html += `<span style="display:inline-block;width:1px;background:${c};height:${h};vertical-align:middle;margin:0 6px"></span>`;
        break;
      }

      case 'flashdeck': {
        const id = 'fd'+(Math.random()*1e8|0);
        const cardsJson = JSON.stringify(b.cards).replace(/</g,'\\u003c');
        html += `<div class="flashdeck" data-fdid="${id}">
          <div class="flashdeck-viewport">
            <div class="flash-card" id="${id}-card">
              <div class="flash-face flash-front" id="${id}-front"></div>
              <div class="flash-face flash-back" id="${id}-back"></div>
            </div>
          </div>
          <div class="flashdeck-nav">
            <button onclick="fdPrev('${id}')">◀ 이전</button>
            <span class="flashdeck-counter" id="${id}-ctr"></span>
            <button onclick="fdNext('${id}')">다음 ▶</button>
          </div>
          <div class="flashdeck-hint">카드를 클릭하면 뒤집힙니다</div>
          <script type="application/json" id="${id}-data">${cardsJson}<\/script>
        </div>`; break;
      }

      case 'stepgroup': {
        const id = 'sg'+(Math.random()*1e8|0);
        let stepsHtml = b.steps.map((s,i)=>`
          <div class="step-item${i===0?' active':''}" id="${id}-s${i}">
            <div class="step-left">
              <div class="step-circle">${esc(String(s.num||i+1))}</div>
              <div class="step-line"></div>
            </div>
            <div class="step-body">
              <div class="step-title">${esc(s.title)}</div>
              <div class="step-content">${esc(s.content)}</div>
            </div>
          </div>`).join('');
        html += `<div class="stepgroup" data-sgid="${id}" data-total="${b.steps.length}" data-cur="0">
          ${stepsHtml}
          <div class="stepgroup-controls">
            <button onclick="sgPrev('${id}')">◀ 이전</button>
            <button onclick="sgNext('${id}')">다음 ▶</button>
          </div>
        </div>`; break;
      }

      case 'flowgraph': {
        const id = 'fg'+(Math.random()*1e8|0);
        const nodesHtml = b.nodes.map(n=>`<div class="flow-node" data-nid="${esc(n.id)}" id="${id}-${esc(n.id)}">${esc(n.label)}</div>`).join('');
        const edgesJson = JSON.stringify(b.edges).replace(/</g,'\\u003c');
        html += `<div class="flowgraph-wrap" id="${id}" style="min-height:120px">
          <svg class="flowgraph-svg" id="${id}-svg"></svg>
          <div class="flowgraph-nodes">${nodesHtml}</div>
          <script type="application/json" id="${id}-edges">${edgesJson}<\/script>
        </div>`; break;
      }

      case 'roadmap': {
        const itemsHtml = b.items.map(item=>{
          const badgeClass = {green:'badge-green',blue:'badge-blue',red:'badge-red',yellow:'badge-yellow',purple:'badge-purple'}[item.badge?.toLowerCase()] || 'badge-gray';
          const badgeHtml = item.badge ? `<span class="roadmap-badge ${badgeClass}">${esc(item.badge)}</span>` : '';
          return `<div class="roadmap-item">
            <div class="roadmap-period">${esc(item.period)}</div>
            <div class="roadmap-title">${esc(item.title)}${badgeHtml}</div>
            <div class="roadmap-body">${esc(item.content)}</div>
          </div>`;
        }).join('');
        html += `<div class="roadmap">${itemsHtml}</div>`; break;
      }

      // ── canvas layout (bytenode-ppt 1e) ──
      case 'meshbg': {
        html += `<div aria-hidden="true" style="height:120px;margin:8px 0;border-radius:10px;overflow:hidden;${makeMeshLayerStyle(b.colors,36)}"></div>`;
        break;
      }
      case 'ppt-grid': {
        const rowCss = b.rowsTemplate ? `grid-template-rows:${b.rowsTemplate};` : '';
        html += `<div class="ppt-grid-inner" style="display:grid;grid-template-columns:${esc(b.template || `repeat(${b.cols||2},1fr)`)};${rowCss}gap:${esc(b.gap)};margin:14px 0;min-height:${b.rows && b.rows > 1 ? '320px' : 'auto'}">`;
        (b.cells||[]).forEach(cell => {
          html += `<div style="background:var(--bg3);border-radius:8px;padding:14px;border:1px solid var(--border2);min-width:0;overflow:hidden">`;
          html += renderBlocks(cell, true);
          html += `</div>`;
        });
        html += `</div>`; break;
      }
      case 'colortext': {
        const spans = (b.items||[]).map(item => {
          const txt = esc(item.text);
          return item.color ? `<span style="color:${esc(item.color)}">${txt}</span>` : txt;
        });
        html += `<div style="margin:8px 0;line-height:1.7;font-size:1rem;flex-wrap:wrap;display:flex;gap:4px;align-items:baseline">${spans.join('')}</div>`;
        break;
      }
      case 'bgblock': {
        html += `<div style="width:100%;min-height:14px;border-radius:${esc(b.radius||'0px')};background:${esc(b.bg)};margin:4px 0"></div>`;
        break;
      }
      case 'bgsplit': {
        const isV = b.dir !== 'h';
        html += `<div style="width:100%;min-height:70px;border-radius:8px;background:linear-gradient(${isV?'90deg':'180deg'},${esc(b.c1)} ${b.ratio}%,${esc(b.c2)} ${b.ratio}%);margin:8px 0"></div>`;
        break;
      }
      case 'xtable': {
        if (!b.rows?.length) break;
        const [head, ...body] = b.rows;
        const hBg = b.headColor || '#1e40af';
        const bdr = b.borderColor || 'rgba(255,255,255,.15)';
        const renderXCell = c => { const m = String(c||'').match(/^(.*?)::(#[0-9a-fA-F]{3,8})$/); return m ? { text: m[1], color: m[2] } : { text: c, color: null }; };
        const mkTh = cells => `<tr>${cells.map(c=>{ const {text}=renderXCell(c); return `<th style="border:1px solid ${bdr};padding:9px 14px;text-align:left;font-size:13px;font-weight:700;background:${hBg};color:#fff">${esc(text)}</th>`; }).join('')}</tr>`;
        const mkTd = (cells, ri) => {
          const rowBg = b.stripeColor && ri%2===0 ? b.stripeColor : 'var(--bg2)';
          return `<tr>${cells.map(c=>{ const {text,color}=renderXCell(c); return `<td style="border:1px solid ${bdr};padding:8px 14px;font-size:13px;background:${rowBg};${color?`color:${color};font-weight:600`:''}">${esc(text)}</td>`; }).join('')}</tr>`;
        };
        html += `<div style="overflow-x:auto;margin:12px 0;border-radius:8px;overflow:hidden;border:1px solid ${bdr}">
          <table style="border-collapse:collapse;width:100%;min-width:280px">
            <thead>${mkTh(head)}</thead>
            <tbody>${body.map((r,i)=>mkTd(r,i)).join('')}</tbody>
          </table></div>`;
        break;
      }
      case 'columns3': {
        html += `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:12px 0">`;
        (b.cols||[]).forEach(col => {
          html += `<div style="background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:14px;font-size:13px;line-height:1.7">${renderInlineContent(col)}</div>`;
        });
        html += `</div>`;
        break;
      }
      case 'grid2x2': {
        const acc = b.accent||'#60a5fa';
        html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0">`;
        (b.cells||[]).forEach(cell => {
          html += `<div style="background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;border-top:3px solid ${esc(acc)}">
            ${cell.title ? `<div style="font-size:12px;font-weight:700;color:${esc(acc)};margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">${esc(cell.title)}</div>` : ''}
            <div style="font-size:13px;color:var(--text2);line-height:1.7">${renderInlineContent(cell.body)}</div>
          </div>`;
        });
        html += `</div>`;
        break;
      }
      case 'textglow': {
        const fsMap = {1:'.75rem',2:'.85rem',3:'1rem',4:'1.15rem',5:'1.35rem',6:'1.6rem',7:'2rem',8:'2.5rem',9:'3.2rem'};
        const fs = fsMap[Math.min(9,Math.max(1,b.size||7))]||'2rem';
        const grad = `linear-gradient(135deg,${esc(b.c1)},${esc(b.c2)})`;
        const glowColor = b.c1;
        html += `<div style="text-align:center;margin:14px 0;padding:10px 0">
          <span style="font-size:${fs};font-weight:900;background:${grad};-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;filter:drop-shadow(0 0 18px ${esc(glowColor)}88);letter-spacing:-.01em">${esc(b.text)}</span>
        </div>`;
        break;
      }
      case 'annotate': {
        const noteColor = b.color||'#fbbf24';
        const isYellow = noteColor.toLowerCase().includes('fbf') || noteColor.toLowerCase().includes('fd') || noteColor === '#fbbf24';
        const textColor = isYellow ? '#1a1200' : '#fff';
        html += `<div style="display:inline-block;background:${esc(noteColor)};color:${textColor};padding:14px 18px;border-radius:4px;font-size:13px;line-height:1.7;max-width:100%;margin:10px 0;box-shadow:3px 4px 0 rgba(0,0,0,.25);transform:rotate(-0.5deg);position:relative">
          ${renderInlineContent(b.text)}
        </div>`;
        break;
      }
      case 'comparison': {
        html += `<div style="margin:14px 0;border-radius:10px;overflow:hidden;border:1px solid var(--border2)">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--bg3)">
            <div style="padding:10px 14px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border2)">항목</div>
            <div style="padding:10px 14px;font-size:13px;font-weight:700;color:#60a5fa;text-align:center;border-bottom:1px solid var(--border2)">${esc(b.labelA)}</div>
            <div style="padding:10px 14px;font-size:13px;font-weight:700;color:#f472b6;text-align:center;border-bottom:1px solid var(--border2)">${esc(b.labelB)}</div>
          </div>`;
        (b.items||[]).forEach((item,ri) => {
          const rowBg = ri%2===0 ? 'var(--bg2)' : 'var(--bg3)';
          html += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;background:${rowBg}">
            <div style="padding:9px 14px;font-size:13px;font-weight:600;color:var(--text);border-top:${ri?'1px solid var(--border2)':'none'}">${esc(item.label)}</div>
            <div style="padding:9px 14px;font-size:13px;color:#93c5fd;text-align:center;border-top:${ri?'1px solid var(--border2)':'none'}">${renderInlineContent(item.a)}</div>
            <div style="padding:9px 14px;font-size:13px;color:#f9a8d4;text-align:center;border-top:${ri?'1px solid var(--border2)':'none'}">${renderInlineContent(item.b)}</div>
          </div>`;
        });
        html += `</div>`;
        break;
      }
      case 'accent': {
        const ac = b.color||'#60a5fa';
        html += `<div style="border-left:4px solid ${esc(ac)};background:rgba(255,255,255,.04);padding:14px 18px;border-radius:0 8px 8px 0;margin:10px 0;font-size:14px;line-height:1.75;color:var(--text)">${renderInlineContent(b.text)}</div>`;
        break;
      }
      case 'magazine': {
        const imgSide = b.side === 'right';
        const imgBlock = b.img ? `<div style="flex:0 0 45%;max-width:45%"><img src="${esc(b.img)}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;display:block"/></div>` : '';
        const txtBlock = `<div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:8px">
          ${b.title ? `<div style="font-size:1.2rem;font-weight:800;color:var(--text);line-height:1.3">${renderInlineContent(b.title)}</div>` : ''}
          ${b.body ? `<div style="font-size:13px;color:var(--text2);line-height:1.7">${renderInlineContent(b.body)}</div>` : ''}
        </div>`;
        html += `<div style="display:flex;gap:20px;margin:16px 0;align-items:stretch;min-height:160px;flex-wrap:wrap">
          ${imgSide ? txtBlock + imgBlock : imgBlock + txtBlock}
        </div>`;
        break;
      }
      case 'glasspanel': {
        const blurVal = esc(b.blur||'14px');
        const bgAlpha = parseFloat(b.opacity||'0.08');
        const bdrCol = esc(b.border||'rgba(255,255,255,.18)');
        html += `<div style="background:rgba(255,255,255,${bgAlpha});backdrop-filter:blur(${blurVal});-webkit-backdrop-filter:blur(${blurVal});border:1px solid ${bdrCol};border-radius:14px;padding:18px 22px;margin:12px 0;color:var(--text);line-height:1.75;font-size:14px;box-shadow:0 4px 24px rgba(0,0,0,.18)">${renderInlineContent(b.text)}</div>`;
        break;
      }
      case 'hollow': {
        const fsMap = {1:'.75rem',2:'.85rem',3:'1rem',4:'1.2rem',5:'1.4rem',6:'1.7rem',7:'2.1rem',8:'2.8rem',9:'3.5rem'};
        const fs = fsMap[Math.min(9,Math.max(1,b.size||7))]||'2.1rem';
        const col = /^#[0-9a-fA-F]{3,8}$/.test(b.color||'') ? b.color : '#60a5fa';
        const sw = b.stroke||'2px';
        html += `<div style="text-align:center;margin:14px 0;padding:8px 0"><span style="font-size:${fs};font-weight:900;-webkit-text-stroke:${sw} ${esc(col)};color:transparent;display:inline-block;letter-spacing:-.01em;line-height:1.2">${esc(b.text)}</span></div>`;
        break;
      }
      case 'statcount': {
        const col = /^#[0-9a-fA-F]{3,8}$/.test(b.color||'') ? b.color : '#60a5fa';
        html += `<div style="display:inline-flex;flex-direction:column;align-items:center;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:16px 28px;margin:8px;border-top:3px solid ${esc(col)}">
          <span style="font-size:2.2rem;font-weight:900;color:${esc(col)};line-height:1;font-variant-numeric:tabular-nums" data-count-to="${esc(b.val)}" data-prefix="${esc(b.prefix)}" data-suffix="${esc(b.suffix)}">${esc(b.prefix)}${esc(b.val)}${esc(b.suffix)}</span>
          ${b.label ? `<span style="font-size:12px;color:var(--muted);margin-top:6px;font-weight:600;text-align:center">${esc(b.label)}</span>` : ''}
        </div>`;
        break;
      }
      case 'cycle': {
        const steps = b.steps||[];
        if (!steps.length) break;
        const acc = b.accent||'#60a5fa';
        html += `<div style="display:flex;align-items:center;flex-wrap:wrap;gap:0;margin:16px 0;justify-content:center">`;
        steps.forEach((step, i) => {
          html += `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;min-width:80px;max-width:120px;text-align:center">
            <div style="width:48px;height:48px;border-radius:50%;background:${esc(acc)};color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 12px ${esc(acc)}66">${i+1}</div>
            <div style="font-size:12px;color:var(--text2);line-height:1.4;font-weight:600">${esc(step)}</div>
          </div>`;
          if (i < steps.length - 1) {
            html += `<div style="font-size:18px;color:${esc(acc)};opacity:.6;margin:0 4px;padding-bottom:22px;flex-shrink:0">→</div>`;
          } else if (steps.length > 2) {
            html += `<div style="font-size:18px;color:${esc(acc)};opacity:.6;margin:0 4px;padding-bottom:22px;flex-shrink:0">↩</div>`;
          }
        });
        html += `</div>`;
        break;
      }
      case 'mockup': {
        const device = b.device||'laptop';
        const imgUrl = b.img ? esc(b.img) : '';
        const imgEl = imgUrl ? `<img src="${imgUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"/>` : `<div style="width:100%;height:100%;background:var(--bg3);border-radius:inherit;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px">화면 미리보기</div>`;
        if (device === 'mobile') {
          html += `<div style="display:flex;flex-direction:column;align-items:center;margin:16px 0">
            ${b.title ? `<div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600">${esc(b.title)}</div>` : ''}
            <div style="width:140px;background:#1a1a2e;border-radius:28px;padding:10px 6px;box-shadow:0 0 0 2px #2a2a3e,0 8px 32px rgba(0,0,0,.5)">
              <div style="background:#111;border-radius:4px;width:40px;height:4px;margin:0 auto 6px"></div>
              <div style="border-radius:16px;overflow:hidden;height:240px">${imgEl}</div>
              <div style="background:#111;border-radius:50%;width:24px;height:24px;margin:6px auto 0"></div>
            </div>
          </div>`;
        } else if (device === 'tablet') {
          html += `<div style="display:flex;flex-direction:column;align-items:center;margin:16px 0">
            ${b.title ? `<div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600">${esc(b.title)}</div>` : ''}
            <div style="width:240px;background:#1a1a2e;border-radius:18px;padding:12px 8px;box-shadow:0 0 0 2px #2a2a3e,0 8px 32px rgba(0,0,0,.5)">
              <div style="border-radius:10px;overflow:hidden;height:180px">${imgEl}</div>
              <div style="background:#111;border-radius:50%;width:20px;height:20px;margin:8px auto 0"></div>
            </div>
          </div>`;
        } else {
          html += `<div style="display:flex;flex-direction:column;align-items:center;margin:16px 0">
            ${b.title ? `<div style="font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:600">${esc(b.title)}</div>` : ''}
            <div style="max-width:480px;width:100%">
              <div style="background:#1e1e2e;border-radius:10px 10px 0 0;padding:8px 10px;display:flex;gap:5px;align-items:center;box-shadow:0 0 0 1px #2a2a3e">
                <div style="width:8px;height:8px;border-radius:50%;background:#ef4444"></div>
                <div style="width:8px;height:8px;border-radius:50%;background:#fbbf24"></div>
                <div style="width:8px;height:8px;border-radius:50%;background:#4ade80"></div>
                <div style="flex:1;background:#111;border-radius:4px;height:12px;margin-left:6px"></div>
              </div>
              <div style="border:1px solid #2a2a3e;border-top:none;border-radius:0 0 6px 6px;overflow:hidden;height:220px">${imgEl}</div>
              <div style="background:#1e1e2e;height:10px;border-radius:0 0 4px 4px;margin:0 16px;border:1px solid #2a2a3e;border-top:none"></div>
              <div style="background:#2a2a3e;height:6px;border-radius:0 0 8px 8px;margin:0 32px;"></div>
            </div>
          </div>`;
        }
        break;
      }
      case 'freecanvas': {
        // On mobile (<600px), stack boxes vertically instead of absolute 16:9
        html += `<div class="freecanvas-wrap" style="position:relative;width:100%;padding-top:56.25%;margin:8px 0;overflow:hidden">
          <div style="position:absolute;inset:0">`;
        (b.boxes||[]).forEach(fb => {
          // bgblock/bgsplit as first block → use as freebox background
          let fbBg = 'transparent';
          let contentBlocks = fb.blocks;
          const first = fb.blocks[0];
          if (first?.type === 'bgblock') { fbBg = first.bg; contentBlocks = fb.blocks.slice(1); }
          else if (first?.type === 'bgsplit') {
            fbBg = `linear-gradient(${first.dir!=='h'?'90deg':'180deg'},${first.c1} ${first.ratio}%,${first.c2} ${first.ratio}%)`;
            contentBlocks = fb.blocks.slice(1);
          }
          html += `<div style="position:absolute;left:${fb.x}%;top:${fb.y}%;width:${fb.w}%;height:${fb.h}%;z-index:${fb.z};overflow:hidden;background:${fbBg};padding:6px;box-sizing:border-box">`;
          html += renderBlocks(contentBlocks, true);
          html += `</div>`;
        });
        html += `</div></div>
        <div class="freecanvas-mobile" style="display:none;flex-direction:column;gap:10px;margin:8px 0">`;
        (b.boxes||[]).sort((a,b)=>a.z-b.z).forEach(fb => {
          html += `<div style="background:var(--bg2);border-radius:8px;padding:10px;border:1px solid var(--border2)">`;
          html += renderBlocks(fb.blocks, true);
          html += `</div>`;
        });
        html += `</div>`; break;
      }
      case 'svg-asset': {
        const svgW = b.w, svgH = b.h;
        let svgInner = '';
        let svgDefs = ''; let svgGradN = 0;
        const svgFill = fill => {
          const raw = String(fill||'').trim();
          const m = raw.match(/^grad(?:ient)?\(([^,]+),([^\)]+)\)$/i);
          if (!m) return esc(raw);
          const id = 'sg' + (++svgGradN) + '-' + Math.random().toString(36).slice(2,6);
          svgDefs += `<linearGradient id="${id}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${esc(safeCssColor(m[1], '#60a5fa'))}"/><stop offset="100%" stop-color="${esc(safeCssColor(m[2], '#a78bfa'))}"/></linearGradient>`;
          return `url(#${id})`;
        };
        (b.elements||[]).forEach(el => {
          if (el.type === 'svg-rect') {
            svgInner += `<rect x="${esc(el.x)}" y="${esc(el.y)}" width="${esc(el.w)}" height="${esc(el.h)}" fill="${svgFill(el.fill)}" rx="${esc(el.rx)}"/>`;
          } else if (el.type === 'svg-circle') {
            svgInner += `<circle cx="${esc(el.cx)}" cy="${esc(el.cy)}" r="${esc(el.r)}" fill="${svgFill(el.fill)}"/>`;
          } else if (el.type === 'svg-line') {
            svgInner += `<line x1="${esc(el.x1)}" y1="${esc(el.y1)}" x2="${esc(el.x2)}" y2="${esc(el.y2)}" stroke="${esc(el.color)}" stroke-width="${esc(el.sw)}" stroke-linecap="round"/>`;
          } else if (el.type === 'svg-text') {
            svgInner += `<text x="${esc(el.x)}" y="${esc(el.y)}" fill="${esc(el.color)}" font-size="${esc(el.size)}" font-family="Segoe UI,sans-serif">${esc(el.text)}</text>`;
          }
        });
        html += `<div style="margin:14px 0;overflow:auto;border-radius:8px;background:var(--bg3);padding:12px;border:1px solid var(--border2)">
          <svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg" style="display:block;max-width:100%;height:auto">${svgDefs?`<defs>${svgDefs}</defs>`:''}${svgInner}</svg>
        </div>`; break;
      }
    }
  }
  return html || '<p style="color:var(--muted)">내용이 없습니다.</p>';
}

function renderByteCode(code) {
  return renderBlocks(parseByteCode(code));
}

function renderMath(el) {

const _fdState = {};
function fdInit(id) {
  const dataEl = document.getElementById(id+'-data');
  if (!dataEl) return;
  _fdState[id] = { cards: JSON.parse(dataEl.textContent), cur: 0 };
  fdRender(id);
  document.getElementById(id+'-card')?.addEventListener('click', ()=>fdFlip(id));
}
function fdRender(id) {
  const s = _fdState[id]; if (!s) return;
  const card = document.getElementById(id+'-card');
  const front = document.getElementById(id+'-front');
  const back  = document.getElementById(id+'-back');
  const ctr   = document.getElementById(id+'-ctr');
  if (!card) return;
  card.classList.remove('flipped');
  front.textContent = s.cards[s.cur]?.front || '';
  back.textContent  = s.cards[s.cur]?.back  || '';
  if (ctr) ctr.textContent = `${s.cur+1} / ${s.cards.length}`;
}
function fdFlip(id) { document.getElementById(id+'-card')?.classList.toggle('flipped'); }
function fdPrev(id) { const s=_fdState[id]; if(!s)return; s.cur=(s.cur-1+s.cards.length)%s.cards.length; fdRender(id); }
function fdNext(id) { const s=_fdState[id]; if(!s)return; s.cur=(s.cur+1)%s.cards.length; fdRender(id); }

/* ── byteflow SVG edges ── */
function renderFlowEdges(wrap) {
  const svg = wrap.querySelector('.flowgraph-svg'); if(!svg) return;
  const edgesEl = wrap.querySelector('[id$="-edges"]'); if(!edgesEl) return;
  const edges = JSON.parse(edgesEl.textContent||'[]');
  const wrapRect = wrap.getBoundingClientRect();
  svg.innerHTML = '';
  edges.forEach(e=>{
    const fromEl = wrap.querySelector(`[data-nid="${CSS.escape(e.from)}"]`);
    const toEl   = wrap.querySelector(`[data-nid="${CSS.escape(e.to)}"]`);
    if(!fromEl||!toEl) return;
    const fR = fromEl.getBoundingClientRect(), tR = toEl.getBoundingClientRect();
    const x1 = fR.left+fR.width/2-wrapRect.left, y1 = fR.top+fR.height/2-wrapRect.top;
    const x2 = tR.left+tR.width/2-wrapRect.left, y2 = tR.top+tR.height/2-wrapRect.top;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1); line.setAttribute('y1',y1);
    line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    line.setAttribute('stroke','rgba(99,102,241,.55)'); line.setAttribute('stroke-width','2');
    line.setAttribute('marker-end','url(#arr)');
    svg.appendChild(line);
    if(e.desc){
      const tx = document.createElementNS('http://www.w3.org/2000/svg','text');
      tx.setAttribute('x',(x1+x2)/2); tx.setAttribute('y',(y1+y2)/2-4);
      tx.setAttribute('fill','#94a3b8'); tx.setAttribute('font-size','11');
      tx.setAttribute('text-anchor','middle'); tx.textContent = e.desc;
      svg.appendChild(tx);
    }
  });
  // add arrowhead marker
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `<marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="rgba(99,102,241,.7)"/></marker>`;
  svg.insertBefore(defs, svg.firstChild);
  // set svg height
  const nodesDiv = wrap.querySelector('.flowgraph-nodes');
  if(nodesDiv) svg.style.height = nodesDiv.offsetHeight+'px';
}

/* ── renderInteractive: called after renderCharts ── */
function renderInteractive(el) {
  el.querySelectorAll('.flashdeck').forEach(fd => fdInit(fd.dataset.fdid));
  el.querySelectorAll('.flowgraph-wrap').forEach(fw => { setTimeout(()=>renderFlowEdges(fw), 80); });
  initStatCounters(el);
}
function initStatCounters(el) {
  if (!el) return;
  el.querySelectorAll('[data-count-to]').forEach(span => {
    const raw = String(span.dataset.countTo||'');
    const end = parseFloat(raw.replace(/[^0-9.]/g,''))||0;
    const pre = span.dataset.prefix||'';
    const suf = span.dataset.suffix||'';
    const dec = raw.includes('.') ? raw.split('.')[1].length : 0;
    const dur = 1400;
    const startTime = performance.now();
    const step = t => {
      const p = Math.min((t - startTime) / dur, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      const cur = ease * end;
      span.textContent = pre + (dec ? cur.toFixed(dec) : Math.round(cur).toLocaleString('ko-KR')) + suf;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

const CHART_PALETTE = ['#60a5fa','#4ade80','#f472b6','#facc15','#fb923c','#a78bfa','#34d399','#f87171','#38bdf8','#e879f9'];

function renderCharts(el) {
  if (!el) return;
  if (typeof Chart === 'undefined') { setTimeout(() => renderCharts(el), 400); return; }
  el.querySelectorAll('.bn-chart').forEach(div => {
    try {
      const b = JSON.parse(div.dataset.chart || '{}');
      const canvas = div.querySelector('canvas');
      if (!canvas || !b.items?.length) return;
      const labels = b.items.map(i => i.label);
      const values = b.items.map(i => i.value);
      const isDark = document.body.classList.contains('dark') || true;
      Chart.defaults.color = 'rgba(200,200,200,.8)';
      Chart.defaults.borderColor = 'rgba(255,255,255,.08)';

      let type, data, options = { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom' } } };

      if (b.type === 'piechart' || b.type === 'donut') {
        type = 'doughnut';
        const total = values.reduce((a, v) => a + v, 0);
        data = { labels, datasets: [{ data: values, backgroundColor: CHART_PALETTE, borderWidth: 2, borderColor: 'rgba(0,0,0,.3)', cutout: b.type === 'donut' ? '55%' : '2%', hoverOffset: 6 }] };
        options.aspectRatio = 2;
        options.layout = { padding: { top: 8, bottom: 8, left: 8, right: 8 } };
        options.plugins.legend = {
          position: 'right',
          align: 'center',
          labels: { padding: 14, font: { size: 13 }, color: 'rgba(220,220,220,.9)', boxWidth: 14, boxHeight: 14,
            generateLabels: chart => chart.data.labels.map((lbl, i) => {
              const val = chart.data.datasets[0].data[i];
              const pct = total > 0 ? Math.round(val / total * 100) : val;
              return { text: `${lbl}  ${pct}%`, fillStyle: CHART_PALETTE[i % CHART_PALETTE.length], strokeStyle: 'transparent', index: i };
            })
          }
        };
        options.plugins.tooltip = { callbacks: { label: ctx => { const pct = total > 0 ? Math.round(ctx.raw / total * 100) : ctx.raw; return ` ${ctx.label}: ${pct}%`; } } };
      } else if (b.type === 'barchart') {
        type = 'bar';
        data = { labels, datasets: [{ data: values, backgroundColor: CHART_PALETTE.slice(0, values.length), borderRadius: 6, borderWidth: 0 }] };
        options.scales = { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,.06)' } }, x: { grid: { display: false } } };
        options.plugins.legend = { display: false };
      } else if (b.type === 'hbar') {
        type = 'bar';
        data = { labels, datasets: [{ data: values, backgroundColor: CHART_PALETTE.slice(0, values.length), borderRadius: 6, borderWidth: 0 }] };
        options.indexAxis = 'y';
        options.scales = { x: { beginAtZero: true, grid: { color: 'rgba(255,255,255,.06)' } }, y: { grid: { display: false } } };
        options.plugins.legend = { display: false };
      } else if (b.type === 'linechart') {
        type = 'line';
        data = { labels, datasets: [{ data: values, borderColor: CHART_PALETTE[0], backgroundColor: 'transparent', tension: 0.35, pointRadius: 4, pointBackgroundColor: CHART_PALETTE[0], borderWidth: 2 }] };
        options.scales = { y: { beginAtZero: false, grid: { color: 'rgba(255,255,255,.06)' } }, x: { grid: { display: false } } };
        options.plugins.legend = { display: false };
      } else if (b.type === 'areachart') {
        type = 'line';
        data = { labels, datasets: [{ data: values, borderColor: CHART_PALETTE[0], backgroundColor: 'rgba(96,165,250,.18)', fill: true, tension: 0.35, pointRadius: 4, pointBackgroundColor: CHART_PALETTE[0], borderWidth: 2 }] };
        options.scales = { y: { beginAtZero: false, grid: { color: 'rgba(255,255,255,.06)' } }, x: { grid: { display: false } } };
        options.plugins.legend = { display: false };
      } else if (b.type === 'radar') {
        type = 'radar';
        data = { labels, datasets: [{ data: values, borderColor: CHART_PALETTE[0], backgroundColor: 'rgba(96,165,250,.15)', pointBackgroundColor: CHART_PALETTE[0], borderWidth: 2, pointRadius: 4 }] };
        options.scales = { r: { grid: { color: 'rgba(255,255,255,.1)' }, angleLines: { color: 'rgba(255,255,255,.1)' }, pointLabels: { color: 'rgba(200,200,200,.8)', font: { size: 12 } }, ticks: { display: false } } };
        options.plugins.legend = { display: false };

      } else if (b.type === 'stacked') {
        type = 'bar';
        const maxDs = Math.max(...(b.items||[]).map(i=>i.values?.length||0));
        const dsLabels = b.dsLabels||[];
        data = {
          labels: (b.items||[]).map(i=>i.label),
          datasets: Array.from({length:maxDs},(_,di)=>({
            label: dsLabels[di]||`항목${di+1}`,
            data: (b.items||[]).map(i=>(i.values||[])[di]||0),
            backgroundColor: CHART_PALETTE[di%CHART_PALETTE.length]+'bb',
            borderRadius: di===maxDs-1?6:0, borderWidth:0
          }))
        };
        options.scales = { x:{stacked:true,grid:{display:false}}, y:{stacked:true,beginAtZero:true,grid:{color:'rgba(255,255,255,.06)'}} };

      } else if (b.type === 'mixed') {
        type = 'bar';
        const barLabels = (b.bars||[]).map(i=>i.label);
        const lineLabels = (b.lines||[]).map(i=>i.label);
        const allLabels = [...new Set([...barLabels,...lineLabels])];
        data = { labels: allLabels, datasets: [
          { type:'bar', label:'', data: allLabels.map(l=>{ const f=(b.bars||[]).find(i=>i.label===l); return f?f.value:null; }), backgroundColor: CHART_PALETTE[0]+'99', borderRadius:6, borderWidth:0 },
          { type:'line', label:'', data: allLabels.map(l=>{ const f=(b.lines||[]).find(i=>i.label===l); return f?f.value:null; }), borderColor: CHART_PALETTE[2], backgroundColor:'transparent', tension:0.35, pointRadius:4, pointBackgroundColor:CHART_PALETTE[2], borderWidth:2 }
        ]};
        options.scales = { y:{beginAtZero:true,grid:{color:'rgba(255,255,255,.06)'}}, x:{grid:{display:false}} };
        options.plugins.legend = { display: false };

      } else if (b.type === 'scatter') {
        type = 'scatter';
        data = { datasets: [{ data: b.points||[], backgroundColor: CHART_PALETTE[0]+'cc', pointRadius:6, pointHoverRadius:8 }] };
        options.scales = { x:{grid:{color:'rgba(255,255,255,.06)'}}, y:{grid:{color:'rgba(255,255,255,.06)'}} };
        options.plugins.legend = { display: false };

      } else if (b.type === 'bubblechart') {
        type = 'bubble';
        data = { datasets: (b.items||[]).map((it,i)=>({ label:it.label, data:[{x:it.x,y:it.y,r:it.r}], backgroundColor:CHART_PALETTE[i%CHART_PALETTE.length]+'99', borderColor:CHART_PALETTE[i%CHART_PALETTE.length] })) };
        options.scales = { x:{grid:{color:'rgba(255,255,255,.06)'}}, y:{grid:{color:'rgba(255,255,255,.06)'}} };

      } else if (b.type === 'waterfall') {
        type = 'bar';
        let running = 0;
        const floatData = [], barData = [], bgColors = [];
        (b.items||[]).forEach(it => {
          floatData.push(it.value>=0 ? running : running+it.value);
          barData.push(Math.abs(it.value));
          bgColors.push(it.value>=0 ? CHART_PALETTE[0]+'cc' : '#f87171cc');
          running += it.value;
        });
        data = { labels:(b.items||[]).map(i=>i.label), datasets:[
          { data:floatData, backgroundColor:'rgba(0,0,0,0)', borderWidth:0 },
          { data:barData, backgroundColor:bgColors, borderRadius:4, borderWidth:0 }
        ]};
        options.scales = { x:{stacked:true,grid:{display:false}}, y:{stacked:true,beginAtZero:true,grid:{color:'rgba(255,255,255,.06)'}} };
        options.plugins.legend = { display: false };

      } else return;

      new Chart(canvas, { type, data, options });
    } catch(e) { console.warn('[chart]', e); }
  });
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function timeAgo(ts) {
  const d = Date.now() - ts;
  if (d < 60000) return '방금 전';
  if (d < 3600000) return Math.floor(d/60000)+'분 전';
  if (d < 86400000) return Math.floor(d/3600000)+'시간 전';
  if (d < 2592000000) return Math.floor(d/86400000)+'일 전';
  return new Date(ts).toLocaleDateString('ko');
}

<script>
let _cbFaqs = [], _cbOpen = false, _cbHistory = [], _cbAiLoading = false;

async function chatbotLoadFaqs() {
  try {
    const data = await fetch('/api/chatbot/faqs').then(r=>r.json());
    _cbFaqs = data.faqs || [];
  } catch(e) { _cbFaqs = []; }
}

function chatbotToggle() {
  _cbOpen = !_cbOpen;

  if (_cbOpen) {

}
function chatbotClose() { _cbOpen = false; document.getElementById('chatbotWindow').style.display='none'; document.getElementById('chatbotToggle').textContent='💬'; }

const CB_PAGE = 6;
function chatbotShowFaqs(offset) {
  offset = offset || 0;
  const btns = document.getElementById('chatbotBtns');
  if (offset === 0) btns.innerHTML = '';
  const slice = _cbFaqs.slice(offset, offset + CB_PAGE);
  slice.forEach(faq => {
    const btn = document.createElement('button');
    btn.textContent = faq.question;
    btn.style.cssText = 'text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;transition:background .15s;line-height:1.45;width:100%';
    btn.onmouseover = () => btn.style.background = 'rgba(255,255,255,.12)';
    btn.onmouseout = () => btn.style.background = 'rgba(255,255,255,.07)';
    btn.onclick = () => chatbotAsk(faq);
    btns.appendChild(btn);
  });
  if (offset + CB_PAGE < _cbFaqs.length) {
    const more = document.createElement('button');
    more.textContent = `더 보기 (${_cbFaqs.length - offset - CB_PAGE}개 남음)`;
    more.style.cssText = 'background:none;border:1px dashed rgba(255,255,255,.2);color:rgba(255,255,255,.45);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;transition:color .15s;width:100%';
    more.onmouseover = () => { more.style.color='rgba(255,255,255,.75)'; more.style.borderColor='rgba(255,255,255,.4)'; };
    more.onmouseout = () => { more.style.color='rgba(255,255,255,.45)'; more.style.borderColor='rgba(255,255,255,.2)'; };
    more.onclick = () => { btns.removeChild(more); chatbotShowFaqs(offset + CB_PAGE); };
    btns.appendChild(more);
  }
}

function chatbotAsk(faq) {
  chatbotUserMsg(faq.question);
  _cbHistory.push({ role: 'user', content: faq.question });
  setTimeout(() => {
    chatbotBotMsg(faq.answer);
    _cbHistory.push({ role: 'assistant', content: faq.answer });
    const btns = document.getElementById('chatbotBtns');
    btns.innerHTML = '';
    if (faq.followUps?.length) {
      const label = document.createElement('div');
      label.textContent = '추가로 궁금한 점이 있으신가요?';
      label.style.cssText = 'font-size:12px;color:rgba(255,255,255,.45);padding:0 2px 4px';
      btns.appendChild(label);
      faq.followUps.forEach(fu => {
        const btn = document.createElement('button');
        btn.textContent = fu.question;
        btn.style.cssText = 'text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#e2e8f0;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;transition:background .15s;line-height:1.45';
        btn.onmouseover = () => btn.style.background = 'rgba(255,255,255,.12)';
        btn.onmouseout = () => btn.style.background = 'rgba(255,255,255,.07)';
        btn.onclick = () => { chatbotUserMsg(fu.question); setTimeout(() => { chatbotBotMsg(fu.answer); chatbotShowResetBtn(); }, 220); };
        btns.appendChild(btn);
      });
    }
    chatbotShowResetBtn();
  }, 220);
}

function chatbotShowResetBtn() {
  const btns = document.getElementById('chatbotBtns');
  const existing = btns.querySelector('.cb-reset');
  if (existing) return;
  const btn = document.createElement('button');
  btn.className = 'cb-reset';
  btn.textContent = '🏠 처음으로';
  btn.style.cssText = 'background:none;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.5);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;margin-top:2px;transition:color .15s';
  btn.onmouseover = () => btn.style.color='rgba(255,255,255,.85)';
  btn.onmouseout = () => btn.style.color='rgba(255,255,255,.5)';
  btn.onclick = () => { document.getElementById('chatbotBtns').innerHTML = ''; chatbotShowFaqs(); };
  btns.appendChild(btn);
}

function chatbotUserMsg(text) {
  const msgs = document.getElementById('chatbotMessages');
  const div = document.createElement('div');
  div.style.cssText = 'align-self:flex-end;max-width:80%;background:rgba(59,130,246,.25);border:1px solid rgba(59,130,246,.4);color:#e2e8f0;border-radius:12px 12px 2px 12px;padding:9px 13px;font-size:13px;line-height:1.5;word-break:break-word';
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}
function chatbotBotMsg(text) {
  const msgs = document.getElementById('chatbotMessages');
  const div = document.createElement('div');
  div.style.cssText = 'align-self:flex-start;max-width:88%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#e2e8f0;border-radius:12px 12px 12px 2px;padding:9px 13px;font-size:13px;line-height:1.55;word-break:break-word;white-space:pre-wrap';
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}
function chatbotLoadingMsg() {
  const msgs = document.getElementById('chatbotMessages');
  const div = document.createElement('div');
  div.id = 'cbLoading';
  div.style.cssText = 'align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.45);border-radius:12px 12px 12px 2px;padding:9px 13px;font-size:13px';
  div.textContent = '생각 중...';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

async function chatbotSendAI() {
  if (_cbAiLoading) return;
  const input = document.getElementById('chatbotInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  chatbotUserMsg(msg);
  document.getElementById('chatbotBtns').innerHTML = '';
  _cbHistory.push({ role: 'user', content: msg });
  _cbAiLoading = true;
  chatbotLoadingMsg();
  try {
    const r = await fetch('/api/chatbot/ai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, history: _cbHistory.slice(-10) })
    });
    const data = await r.json();
    const loading = document.getElementById('cbLoading');
    if (loading) loading.remove();
    const reply = data.reply || data.error || '오류가 발생했습니다.';
    chatbotBotMsg(reply);
    _cbHistory.push({ role: 'assistant', content: reply });
    chatbotShowResetBtn();
  } catch(e) {
    const loading = document.getElementById('cbLoading');
    if (loading) loading.remove();
    chatbotBotMsg('네트워크 오류가 발생했습니다.');
  } finally {
    _cbAiLoading = false;
  }
}

chatbotLoadFaqs();
</script>
</body>
</html>
