﻿<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<title>bytenode</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/mhchem.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/function-plot@1/dist/function-plot.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/libs/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>
<style>
:root {
  --bg:       #0a0a0a;
  --bg2:      #111111;
  --bg3:      #1a1a1a;
  --border:   rgba(255,255,255,0.08);
  --border2:  rgba(255,255,255,0.14);
  --text:     #e8e8e8;
  --muted:    #888;
  --muted2:   #555;
  --white:    #fff;
  --accent:   #c8c8c8;
  --danger:   #e05252;
  --success:  #52c87a;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI","Apple SD Gothic Neo",sans-serif;}
a{color:inherit;text-decoration:none;}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit;}
input,textarea,select{font-family:inherit;}

/* ── 배너 ── */
#banner{
  position:fixed;top:0;left:0;right:0;z-index:999;
  background:#1c1c1c;border-bottom:1px solid var(--border2);
  padding:8px 20px;display:flex;align-items:center;justify-content:space-between;
  font-size:13px;color:var(--accent);
  transform:translateY(-100%);transition:transform .35s ease;
}
#banner.show{transform:translateY(0);}
#banner .banner-close{opacity:.5;font-size:18px;line-height:1;margin-left:12px;}
#banner .banner-close:hover{opacity:1;}

/* ── 헤더 ── */
#header{
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,10,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;
}
#header .logo{font-size:1.25rem;font-weight:800;letter-spacing:.12em;color:var(--white);}
#header .logo span{color:var(--muted);}
.header-right{display:flex;align-items:center;gap:12px;overflow:hidden;flex-wrap:nowrap;}
.hamburger{
  display:none;background:none;border:1px solid var(--border2);
  border-radius:6px;padding:5px 9px;cursor:pointer;color:var(--text);
  font-size:18px;line-height:1;
}
.mobile-nav{
  display:none;position:fixed;top:50px;left:0;right:0;z-index:200;
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:10px 12px;flex-direction:column;gap:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  max-height:calc(100vh - 50px);overflow-y:auto;
}
.mobile-nav.open{display:flex;}
.mobile-nav .hbtn{width:100%;text-align:left;padding:11px 14px;font-size:14px;border-radius:8px;}
.mobile-nav .avatar-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.mobile-nav .avatar-row img,.mobile-nav .avatar-row span.av{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:14px;}
.mobile-nav-overlay{display:none;position:fixed;inset:0;z-index:199;background:rgba(0,0,0,.3);}
.mobile-nav-overlay.open{display:block;}
.hbtn{
  padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;
  border:1px solid var(--border2);background:transparent;color:var(--text);
  transition:background .18s,border-color .18s;white-space:nowrap;flex-shrink:0;
}
.hbtn:hover{background:var(--bg3);border-color:var(--accent);}
.hbtn.primary{background:var(--white);color:#111;border-color:var(--white);}
.hbtn.primary:hover{background:#ddd;}
.avatar-btn{
  width:32px;height:32px;border-radius:50%;overflow:hidden;
  border:1px solid var(--border2);background:var(--bg3);
  display:flex;align-items:center;justify-content:center;font-size:14px;
  cursor:pointer;
}
.avatar-btn img{width:100%;height:100%;object-fit:cover;}

/* ── 메인 레이아웃 ── */
#app{min-height:calc(100vh - 52px);}

/* ── 페이지 공통 ── */
.page{max-width:840px;margin:0 auto;padding:36px 20px 80px;}
.page-wide{max-width:1100px;margin:0 auto;padding:36px 20px 80px;}

/* ── 홈 피드 ── */
.feed-grid{display:flex;flex-direction:column;gap:1px;border:1px solid var(--border);}
.feed-card{
  background:var(--bg2);padding:22px 26px;
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;
  border-bottom:1px solid var(--border);transition:background .15s;
  cursor:pointer;
}
.feed-card:last-child{border-bottom:none;}
.feed-card:hover{background:var(--bg3);}
.feed-card-info{}
.feed-card-title{font-size:1.1rem;font-weight:700;color:var(--white);margin-bottom:6px;line-height:1.4;}
.feed-card-meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;}
.feed-card-cover{
  width:90px;height:68px;border-radius:4px;overflow:hidden;
  background:var(--bg3);flex-shrink:0;
}
.feed-card-cover img{width:100%;height:100%;object-fit:cover;}
.tag{
  display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;
  background:var(--bg3);border:1px solid var(--border2);color:var(--muted);margin-right:4px;margin-top:4px;
}

/* ── 게시글 상세 ── */
.post-header{margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:20px;}
.post-title{font-size:1.9rem;font-weight:800;color:var(--white);line-height:1.3;margin-bottom:10px;}
.post-meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;}
.post-body{line-height:1.7;}

/* ── 커스텀 에디터 ── */
.editor-wrap{
  border:1px solid var(--border2);border-radius:8px;overflow:hidden;
  background:var(--bg2);
}
.editor-toolbar{
  background:var(--bg3);border-bottom:1px solid var(--border);
  padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
}
.editor-toolbar button{
  padding:4px 10px;border-radius:4px;font-size:12px;font-weight:600;
  border:1px solid var(--border2);background:var(--bg2);color:var(--text);
}
.editor-toolbar button:hover{background:var(--bg);border-color:var(--accent);}
.editor-toolbar .sep{width:1px;height:20px;background:var(--border2);margin:0 4px;}
.editor-grid{
  display:grid;
  padding:16px;gap:0;
  font-family:"Courier New",monospace;
}
.editor-cell{
  border:1px solid rgba(255,255,255,0.05);
  min-height:28px;
  display:flex;align-items:center;
  position:relative;
  overflow:hidden;
}
.editor-cell.empty{background:transparent;}
#codeInput{
  width:100%;background:var(--bg3);color:var(--text);border:none;outline:none;
  font-family:"Courier New",monospace;font-size:13px;line-height:1.6;
  padding:16px;resize:none;min-height:200px;
  overflow-x:auto;overflow-y:auto;
  white-space:pre;word-wrap:normal;
}
#codeInput::-webkit-scrollbar{height:6px;background:var(--bg2);}
#codeInput::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:3px;}
.editor-tabs{display:flex;border-bottom:1px solid var(--border);}
.editor-tab{
  padding:8px 18px;font-size:13px;font-weight:600;
  border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);
}
.editor-tab.active{border-bottom-color:var(--white);color:var(--white);}

/* ── PPT 슬라이드 에디터 ── */
#pptEditorWrap{display:none;border:1px solid var(--border2);border-radius:8px;overflow:hidden;background:var(--bg2);margin-bottom:16px;}
.ppt-editor-inner{display:flex;min-height:480px;}
#pptSlideList{
  width:180px;flex-shrink:0;background:var(--bg3);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.ppt-list-header{
  padding:10px 12px;font-size:11px;font-weight:700;color:var(--muted);
  letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.ppt-slide-item{
  padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
  transition:background .15s;min-height:52px;position:relative;
}
.ppt-slide-item:hover{background:rgba(255,255,255,.04);}
.ppt-slide-item.active{background:rgba(255,255,255,.08);color:var(--text);}
.ppt-slide-num{
  font-size:10px;font-weight:700;min-width:18px;height:18px;
  background:var(--muted2);color:#fff;border-radius:4px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.ppt-slide-item.active .ppt-slide-num{background:var(--accent);}
.ppt-slide-title{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.3}
.ppt-slide-del{
  opacity:0;font-size:15px;color:var(--danger);padding:2px 4px;border-radius:4px;
  transition:opacity .15s;flex-shrink:0;line-height:1;
}
.ppt-slide-item:hover .ppt-slide-del{opacity:.7;}
.ppt-slide-del:hover{opacity:1 !important;}
.ppt-add-btn{
  margin:10px;padding:7px;border-radius:6px;font-size:12px;font-weight:600;
  border:1px dashed var(--border2);color:var(--muted);text-align:center;cursor:pointer;
  transition:background .15s,color .15s;
}
.ppt-add-btn:hover{background:rgba(255,255,255,.05);color:var(--text);}
.ppt-add-duplicate{
  margin:0 10px 6px;padding:5px;border-radius:6px;font-size:11px;
  border:1px dashed var(--border2);color:var(--muted2);text-align:center;cursor:pointer;
  transition:background .15s;
}
.ppt-add-duplicate:hover{background:rgba(255,255,255,.04);color:var(--muted);}
#pptCodeArea{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.ppt-code-header{
  padding:8px 14px;background:var(--bg3);border-bottom:1px solid var(--border);
  font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;
}
#pptSlideInput{
  flex:1;width:100%;background:var(--bg3);color:var(--text);border:none;outline:none;
  font-family:"Courier New",monospace;font-size:13px;line-height:1.6;
  padding:16px;resize:none;min-height:200px;overflow-x:auto;overflow-y:auto;
  white-space:pre;word-wrap:normal;
}
#pptSlideInput::-webkit-scrollbar{width:6px;background:var(--bg2);}
#pptSlideInput::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:3px;}
.ppt-toolbar{
  display:flex;align-items:center;gap:8px;padding:8px 14px;
  background:var(--bg3);border-top:1px solid var(--border);flex-wrap:wrap;
}
.ppt-preview-panel{padding:20px;overflow:auto;}

/* ── 발표 모드 ── */
#presentOverlay{
  display:none;position:fixed;inset:0;z-index:9999;
  background:#000;flex-direction:column;
}
#presentOverlay.active{display:flex;}
#presentSlide{
  flex:1;display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.present-slide-content{
  width:100%;max-width:calc(100vh * 16/9);
  aspect-ratio:16/9;background:#0a0a0a;
  position:relative;overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,.8);
}
.present-slide-content .rendered-body{
  padding:40px 56px;height:100%;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-start;
}
#presentNav{
  height:48px;background:rgba(0,0,0,.7);display:flex;
  align-items:center;justify-content:space-between;padding:0 24px;
  gap:16px;flex-shrink:0;
}
#presentNav button{
  padding:6px 18px;border-radius:6px;font-size:13px;font-weight:600;
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);
  color:#fff;cursor:pointer;transition:background .15s;
}
#presentNav button:hover{background:rgba(255,255,255,.18);}
#presentNav button:disabled{opacity:.3;cursor:default;}
#presentCounter{font-size:13px;color:rgba(255,255,255,.6);}
#presentProgress{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.1);}
#presentProgressBar{height:100%;background:#60a5fa;transition:width .3s;}

/* ── 렌더된 본문 ── */
.rendered-body{}
.r-title{font-size:2rem;font-weight:800;line-height:1.3;margin-bottom:16px;}
.r-block{margin-bottom:4px;line-height:1.6;}
.r-img{display:block;max-width:100%;border-radius:4px;margin:8px 0;}
.r-hr-v{display:inline-block;width:1px;background:var(--border2);vertical-align:middle;margin:0 4px;}
.r-hr-h{display:block;border:none;height:1px;background:var(--border2);margin:8px 0;}
.r-video{max-width:100%;border-radius:4px;margin:8px 0;}

/* ── 모달 ── */
.modal-overlay{
  position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--bg2);border:1px solid var(--border2);border-radius:10px;
  padding:32px;width:90%;max-width:480px;
  transform:translateY(12px);transition:transform .2s;
  max-height:90vh;overflow-y:auto;
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal h2{font-size:1.25rem;font-weight:700;margin-bottom:20px;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
.form-row input,.form-row textarea,.form-row select{
  width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;
  padding:9px 12px;color:var(--text);font-size:14px;outline:none;
}
.form-row input:focus,.form-row textarea:focus{border-color:var(--accent);}
.form-row textarea{resize:vertical;min-height:80px;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.btn{
  padding:8px 20px;border-radius:6px;font-size:14px;font-weight:600;
  border:1px solid var(--border2);background:var(--bg3);color:var(--text);
  cursor:pointer;transition:background .15s;
}
.btn:hover{background:var(--bg);}
.btn.primary{background:var(--white);color:#111;border-color:var(--white);}
.btn.primary:hover{background:#ddd;}
.btn.danger{background:rgba(224,82,82,.12);color:var(--danger);border-color:rgba(224,82,82,.3);}
.btn.danger:hover{background:rgba(224,82,82,.22);}

/* ── 관리자 패널 ── */
.admin-sidebar{
  width:200px;flex-shrink:0;border-right:1px solid var(--border);
  padding:20px 0;
}
.admin-sidebar a{
  display:block;padding:9px 20px;font-size:14px;color:var(--muted);
  border-left:3px solid transparent;transition:color .15s;
}
.admin-sidebar a:hover,.admin-sidebar a.active{color:var(--white);border-left-color:var(--white);background:var(--bg3);}
.admin-layout{display:flex;min-height:calc(100vh - 52px);}
.admin-content{flex:1;padding:32px;overflow-x:auto;}
.admin-mobile-tabs{
  display:none;overflow-x:auto;gap:6px;padding:10px 14px;
  border-bottom:1px solid var(--border);background:var(--bg2);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.admin-mobile-tabs::-webkit-scrollbar{display:none;}
.admin-mobile-tabs a{
  white-space:nowrap;flex-shrink:0;padding:7px 14px;border-radius:20px;
  font-size:13px;border:1px solid var(--border2);color:var(--muted);
}
.admin-mobile-tabs a.active{background:var(--white);color:#111;border-color:var(--white);}
.admin-title{font-size:1.4rem;font-weight:700;margin-bottom:20px;}
.admin-table{width:100%;border-collapse:collapse;font-size:13px;}
.admin-table th,.admin-table td{padding:10px 14px;border-bottom:1px solid var(--border);text-align:left;}
.admin-table th{color:var(--muted);font-weight:600;background:var(--bg3);}
.admin-table tr:hover td{background:var(--bg3);}

/* ── 내 저장소 ── */
.mybox-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;transition:background .15s;}
.mybox-item:hover{background:var(--bg3);}
.mybox-vis{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap;flex-shrink:0;}
.mybox-vis.pub{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3);}
.mybox-vis.priv{background:rgba(148,163,184,.12);color:#94a3b8;border:1px solid rgba(148,163,184,.25);}
.mybox-title{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mybox-date{font-size:11px;color:var(--muted);flex-shrink:0;white-space:nowrap;}
.mybox-del{font-size:11px;padding:3px 8px;flex-shrink:0;}
.mybox-quota{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-bottom:20px;}
.mybox-quota-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#a78bfa);transition:width .4s;}

/* ── 프롬프트 목록 ── */
.prompt-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;transition:background .15s;}
.prompt-row:hover{background:var(--bg3);}
.prompt-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(139,92,246,.18);color:#a78bfa;border:1px solid rgba(139,92,246,.3);white-space:nowrap;flex-shrink:0;}
.prompt-name{font-size:13px;font-weight:600;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prompt-note{font-size:11px;color:var(--muted);flex-shrink:0;}
.prompt-date{font-size:11px;color:var(--muted2);flex-shrink:0;white-space:nowrap;}
.prompt-detail{display:none;padding:12px 14px 14px;border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;background:var(--bg);margin-top:-4px;}
.prompt-detail.open{display:block;}
.prompt-detail pre{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:12px 14px;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:var(--text);max-height:320px;overflow-y:auto;}
.prompt-copy-btn{margin-top:8px;font-size:12px;padding:4px 14px;}

/* ── 공지 패널 ── */
.notice-list{display:flex;flex-direction:column;gap:10px;}
.notice-item{
  background:var(--bg3);border:1px solid var(--border);border-radius:6px;
  padding:14px 18px;
}
.notice-item h4{font-size:14px;font-weight:700;margin-bottom:4px;}
.notice-item p{font-size:13px;color:var(--muted);}
.notice-item .notice-meta{font-size:11px;color:var(--muted2);margin-top:6px;}

/* ── 계정설정 ── */
.settings-section{
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:24px;margin-bottom:16px;
}
.settings-section h3{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--white);}
.avatar-preview{
  width:72px;height:72px;border-radius:50%;border:2px solid var(--border2);
  object-fit:cover;background:var(--bg3);margin-bottom:10px;
}

/* ── 로그인/가입 ── */
.auth-wrap{
  display:flex;align-items:center;justify-content:center;
  min-height:calc(100vh - 52px);
}
.auth-box{
  width:90%;max-width:400px;
  background:var(--bg2);border:1px solid var(--border2);border-radius:10px;
  padding:36px 32px;
}
.auth-box h2{font-size:1.4rem;font-weight:800;margin-bottom:24px;text-align:center;}
.auth-switch{text-align:center;font-size:13px;color:var(--muted);margin-top:14px;}
.auth-switch a{color:var(--accent);cursor:pointer;}

/* ── 에디터 미리보기 그리드 ── */
.preview-grid{
  display:grid;gap:0;
  border:1px solid var(--border);
  background:var(--bg2);
}
.preview-row{display:flex;}
.preview-cell{
  border:1px solid rgba(255,255,255,0.04);
  display:flex;align-items:center;justify-content:center;
  min-height:28px;overflow:hidden;
  font-size:13px;position:relative;
}

/* ── byteflash ── */
.flashdeck{position:relative;width:100%;max-width:560px;margin:18px auto;}
.flashdeck-viewport{width:100%;perspective:1200px;}
.flash-card{width:100%;min-height:180px;position:relative;transform-style:preserve-3d;transition:transform .5s ease;cursor:pointer;}
.flash-card.flipped{transform:rotateY(180deg);}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:28px 24px;font-size:1.05rem;line-height:1.6;text-align:center;}
.flash-front{background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(139,92,246,.12));border:1px solid rgba(139,92,246,.35);}
.flash-back{background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(5,150,105,.08));border:1px solid rgba(16,185,129,.35);transform:rotateY(180deg);}
.flashdeck-nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px;}
.flashdeck-nav button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#ccc;border-radius:8px;padding:5px 14px;cursor:pointer;font-size:13px;}
.flashdeck-nav button:hover{background:rgba(255,255,255,.13);}
.flashdeck-counter{font-size:12px;color:#888;}
.flashdeck-hint{font-size:11px;color:#666;text-align:center;margin-top:4px;}

/* ── bytestep ── */
.stepgroup{display:flex;flex-direction:column;gap:0;margin:18px 0;}
.step-item{display:flex;gap:0;opacity:.45;transition:opacity .3s;}
.step-item.active{opacity:1;}
.step-left{display:flex;flex-direction:column;align-items:center;width:36px;flex-shrink:0;}
.step-circle{width:32px;height:32px;border-radius:50%;background:rgba(99,102,241,.25);border:2px solid rgba(99,102,241,.5);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#a5b4fc;flex-shrink:0;transition:background .3s,border-color .3s;}
.step-item.active .step-circle{background:rgba(99,102,241,.6);border-color:#818cf8;color:#fff;}
.step-line{width:2px;flex:1;min-height:20px;background:rgba(255,255,255,.08);}
.step-item:last-child .step-line{display:none;}
.step-body{padding:4px 0 20px 14px;flex:1;}
.step-title{font-weight:600;font-size:1rem;margin-bottom:4px;color:#e2e8f0;}
.step-content{font-size:.9rem;color:#94a3b8;line-height:1.6;}
.stepgroup-controls{display:flex;gap:8px;margin-top:4px;padding-left:50px;}
.stepgroup-controls button{background:rgba(99,102,241,.2);border:1px solid rgba(99,102,241,.4);color:#a5b4fc;border-radius:7px;padding:4px 14px;cursor:pointer;font-size:13px;}
.stepgroup-controls button:hover{background:rgba(99,102,241,.35);}

/* ── byteflow ── */
.flowgraph-wrap{position:relative;overflow:auto;margin:18px 0;}
.flowgraph-svg{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;}
.flowgraph-nodes{display:flex;flex-wrap:wrap;gap:14px;padding:16px;position:relative;z-index:1;}
.flow-node{border-radius:10px;padding:10px 18px;font-size:.9rem;font-weight:500;border:1px solid rgba(99,102,241,.4);background:rgba(99,102,241,.13);color:#c7d2fe;white-space:nowrap;cursor:default;}

/* ── byteroadmap ── */
.roadmap{display:flex;flex-direction:column;gap:0;margin:18px 0;position:relative;padding-left:28px;}
.roadmap::before{content:'';position:absolute;left:10px;top:8px;bottom:8px;width:2px;background:linear-gradient(to bottom,rgba(139,92,246,.6),rgba(99,102,241,.3));}
.roadmap-item{position:relative;padding:0 0 28px 24px;}
.roadmap-item::before{content:'';position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:50%;background:#7c3aed;border:2px solid #a78bfa;box-shadow:0 0 8px rgba(139,92,246,.5);}
.roadmap-period{font-size:.78rem;font-weight:600;color:#a78bfa;letter-spacing:.04em;margin-bottom:3px;}
.roadmap-title{font-size:1rem;font-weight:700;color:#e2e8f0;margin-bottom:6px;}
.roadmap-body{font-size:.88rem;color:#94a3b8;line-height:1.6;}
.roadmap-badge{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;}
.badge-green{background:rgba(16,185,129,.2);color:#34d399;border:1px solid rgba(16,185,129,.35);}
.badge-blue{background:rgba(59,130,246,.2);color:#60a5fa;border:1px solid rgba(59,130,246,.35);}
.badge-red{background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(239,68,68,.35);}
.badge-yellow{background:rgba(245,158,11,.2);color:#fbbf24;border:1px solid rgba(245,158,11,.35);}
.badge-purple{background:rgba(139,92,246,.2);color:#a78bfa;border:1px solid rgba(139,92,246,.35);}
.badge-gray{background:rgba(148,163,184,.15);color:#94a3b8;border:1px solid rgba(148,163,184,.25);}

/* ── 반응형 ── */
/* 태블릿 + 모바일: 1024px 이하에서 햄버거 메뉴 */
@media(max-width:1024px){
  #header{padding:0 14px;height:50px;}
  .header-right{display:none;}
  .hamburger{display:block;}
  input,textarea,select{font-size:16px!important;}
}
@media(max-width:600px){
  /* 피드 */
  .page{padding:20px 12px 60px;}
  .page-wide{padding:20px 12px 60px;}
  .feed-card{padding:14px 12px;}
  .feed-card-cover{width:64px;height:50px;}
  .feed-card-title{font-size:1rem;}
  /* 게시글 */
  .post-title{font-size:1.4rem;}
  .post-actions{flex-wrap:wrap;}
  /* 에디터 */
  #codeInput,#pptSlideInput{font-size:12px;min-height:160px;}
  .ppt-editor-inner{flex-direction:column;}
  #pptSlideList{width:100%;height:auto;max-height:180px;border-right:none;border-bottom:1px solid var(--border);}
  .editor-toolbar{gap:4px;}
  .editor-toolbar button{padding:3px 7px;font-size:11px;}
  /* 모드 선택 헤더 */
  #writeModalGrid{grid-template-columns:1fr !important;}
  /* 관리자 */
  .admin-sidebar{display:none;}
  .admin-mobile-tabs{display:flex!important;}
  .admin-layout{flex-direction:column;}
  .admin-content{padding:14px;overflow-x:auto;}
  .admin-table{font-size:12px;}
  .admin-table th,.admin-table td{padding:7px 8px;}
  /* 인증 */
  .auth-box{padding:24px 18px;}
  /* freecanvas 모바일: 절대위치 레이아웃 숨기고 스택 표시 */
  .freecanvas-wrap{display:none!important;}
  .freecanvas-mobile{display:flex!important;}
  /* ppt-grid 모바일: 단일 컬럼 */
  .ppt-grid-inner{grid-template-columns:1fr!important;}
}

.err{color:var(--danger);font-size:13px;margin-top:6px;}
.ok{color:var(--success);font-size:13px;margin-top:6px;}
.spinner{
  display:inline-block;width:18px;height:18px;border-radius:50%;
  border:2px solid rgba(255,255,255,.2);border-top-color:var(--white);
  animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;
}

/* ── 코드 설명서 모달 ── */
.help-content{font-size:13px;line-height:1.8;color:var(--text);}
.help-content h3{color:var(--white);font-size:14px;margin:16px 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px;}
.help-content code{
  background:var(--bg3);border:1px solid var(--border);

}
.help-content .desc{font-size:12px;color:var(--muted);padding-top:2px;}

.back-btn:hover{color:var(--white);}

<script>
/* ════════════════════════════════════════
   STATE
════════════════════════════════════════ */
let token  = localStorage.getItem('bn_token') || sessionStorage.getItem('bn_token') || null;
let me     = JSON.parse(localStorage.getItem('bn_me') || sessionStorage.getItem('bn_me') || 'null');
let currentPage = 'home';
let bannerDismissed = false;

/* ════════════════════════════════════════
   API
════════════════════════════════════════ */
async function api(method, path, body, isFile) {
  const opts = { method, headers: {} };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body && !isFile) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  if (isFile) opts.body = body;
  const r = await fetch('/api' + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || '오류가 발생했습니다.');
  return data;
}

/* ════════════════════════════════════════
   AUTH
════════════════════════════════════════ */
function saveAuth(t, u, remember=true) {
  token = t; me = u;
  if (remember) { localStorage.setItem('bn_token', t); localStorage.setItem('bn_me', JSON.stringify(u)); sessionStorage.removeItem('bn_token'); sessionStorage.removeItem('bn_me'); }
  else { sessionStorage.setItem('bn_token', t); sessionStorage.setItem('bn_me', JSON.stringify(u)); localStorage.removeItem('bn_token'); localStorage.removeItem('bn_me'); }
}
function logout() { token=null; me=null; localStorage.removeItem('bn_token'); localStorage.removeItem('bn_me'); sessionStorage.removeItem('bn_token'); sessionStorage.removeItem('bn_me'); renderHeader(); showPage('home'); }

/* ════════════════════════════════════════
   HEADER
════════════════════════════════════════ */
function showWriteModal() {
  const MODES = [
    { id:'bytenode',         emoji:'📝', name:'bytenode 2',                 desc:'기본 블로그 글쓰기' },
    { id:'byteexam',         emoji:'📋', name:'byteexam 2.1s',             desc:'AI 프롬포트로 기출문제 생성', accent:true },
    { id:'flashinfo',        emoji:'📊', name:'bytegraphic 2e',            desc:'인포그래픽·데이터 시각화' },
    { id:'flashppt',         emoji:'🎞️', name:'bytenode-ppt 2e',           desc:'프레젠테이션 슬라이드' },
  ];

  const overlay = document.createElement('div');
  overlay.id = 'writeModal';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px';
  overlay.innerHTML = `
    <div style="background:var(--bg2);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:520px;padding:28px 24px;box-shadow:0 16px 48px rgba(0,0,0,.5)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
        <h2 style="font-size:1.1rem;font-weight:700;color:var(--text);margin:0">어떤 형식으로 작성할까요?</h2>
        <button onclick="document.getElementById('writeModal').remove()" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1">✕</button>
      </div>
      <div id="writeModeGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        ${MODES.map(m => `
        <button onclick="selectWriteMode('${m.id}')" style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:${m.accent?'rgba(139,92,246,.13)':'var(--bg3)'};border:1px solid ${m.accent?'rgba(139,92,246,.45)':'var(--border2)'};border-radius:10px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s" onmouseover="this.style.borderColor='${m.accent?'rgba(139,92,246,.9)':'var(--accent)'}'" onmouseout="this.style.borderColor='${m.accent?'rgba(139,92,246,.45)':'var(--border2)'}'">
          <span style="font-size:22px;line-height:1;margin-top:1px">${m.emoji}</span>
          <div>
            <div style="font-size:12.5px;font-weight:700;color:${m.accent?'#a78bfa':'var(--text)'};margin-bottom:2px">${m.name}</div>
            <div style="font-size:11px;color:var(--muted)">${m.desc}</div>
          </div>
        </button>`).join('')}
      </div>
    </div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function selectWriteMode(mode) {
  document.getElementById('writeModal')?.remove();
  if (mode === 'byteexam') { window.location.href = 'https://byteexam109.vercel.app'; return; }
  window._writeStartMode = mode;
  showPage('write');
}

function renderHeader() {
  const el = document.getElementById('headerRight');
  const mn = document.getElementById('mobileNav');
  if (!me) {
    el.innerHTML = `<button class="hbtn" onclick="showPage('prompts')">버전 정보</button><a class="hbtn" href="https://byteexam109.vercel.app" style="text-decoration:none">byteexam</a><button class="hbtn" onclick="showPage('guide')">사용방법</button><button class="hbtn" onclick="showPage('notices')">공지</button><button class="hbtn" onclick="showPage('login')">로그인</button><button class="hbtn primary" onclick="showPage('register')">회원가입</button>`;
    mn.innerHTML = `
      <button class="hbtn" onclick="cmm();showPage('prompts')">🔖 버전 정보</button>
      <a class="hbtn" href="https://byteexam109.vercel.app" style="text-decoration:none">📋 byteexam</a>
      <button class="hbtn" onclick="cmm();showPage('guide')">📖 사용방법</button>
      <button class="hbtn" onclick="cmm();showPage('notices')">📢 공지</button>
      <button class="hbtn" onclick="cmm();showPage('login')">로그인</button>
      <button class="hbtn primary" onclick="cmm();showPage('register')">회원가입</button>`;
  } else {
    const av = me.avatar ? `<img src="${me.avatar}" alt="">` : `<span>${me.displayName[0]}</span>`;
    el.innerHTML = `
      <button class="hbtn" onclick="showPage('prompts')">버전 정보</button>
      <a class="hbtn" href="https://byteexam109.vercel.app" style="text-decoration:none">byteexam</a>
      <button class="hbtn" onclick="showPage('guide')">사용방법</button>
      <button class="hbtn" onclick="showPage('notices')">공지</button>
      <button class="hbtn" onclick="showPage('mybox')">📁 내 저장소</button>
      <button class="hbtn" onclick="showWriteModal()" style="display:${me.isAdmin||me.username?'':'none'}">+ 글쓰기</button>
      ${me.isAdmin?`<button class="hbtn" onclick="showPage('admin')">관리자</button>`:''}
      <div class="avatar-btn" onclick="showPage('settings')" title="계정 설정">${av}</div>
    `;
    mn.innerHTML = `
      <div onclick="cmm();showPage('settings')" style="cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);margin-bottom:4px">
        ${me.avatar?`<img src="${me.avatar}" alt="" style="width:32px;height:32px;border-radius:50%;object-fit:cover">`:`<span style="width:32px;height:32px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">${me.displayName[0]}</span>`}
        <div><div style="font-size:13px;font-weight:600">${esc(me.displayName)}</div><div style="font-size:11px;color:var(--muted)">@${esc(me.username)}</div></div>
      </div>
      <button class="hbtn" onclick="cmm();showPage('prompts')">🔖 버전 정보</button>
      <a class="hbtn" href="https://byteexam109.vercel.app" style="text-decoration:none">📋 byteexam</a>
      <button class="hbtn" onclick="cmm();showPage('guide')">📖 사용방법</button>
      <button class="hbtn" onclick="cmm();showPage('notices')">📢 공지</button>
      <button class="hbtn" onclick="cmm();showPage('mybox')">📁 내 저장소</button>
      ${me.isAdmin||me.username?`<button class="hbtn" onclick="cmm();showWriteModal()">✏️ 글쓰기</button>`:''}
      ${me.isAdmin?`<button class="hbtn" onclick="cmm();showPage('admin')">⚙️ 관리자</button>`:''}
      <button class="hbtn" onclick="cmm();showPage('settings')">🔧 계정 설정</button>
      <button class="hbtn" style="color:var(--danger);border-color:rgba(224,82,82,.3)" onclick="cmm();logout()">로그아웃</button>`;
  }
}
function cmm(){ closeMobileMenu(); }
function toggleMobileMenu(){
  const mn=document.getElementById('mobileNav'), ov=document.getElementById('mobileNavOverlay');
  mn.classList.toggle('open'); ov.classList.toggle('open');
}
function closeMobileMenu(){
  document.getElementById('mobileNav')?.classList.remove('open');
  document.getElementById('mobileNavOverlay')?.classList.remove('open');
}

/* ════════════════════════════════════════
   BANNER
════════════════════════════════════════ */
async function loadBanner() {
  try {
    const n = await api('GET','/notices/banner');
    if (n && n.message && !bannerDismissed) {
      document.getElementById('bannerText').textContent = n.message;
      document.getElementById('banner').classList.add('show');
      setTimeout(() => document.getElementById('banner').classList.remove('show'), 6000);
    }
  } catch {}
}
function closeBanner() { document.getElementById('banner').classList.remove('show'); bannerDismissed=true; }

/* ════════════════════════════════════════
   ROUTER
════════════════════════════════════════ */
function showPage(page, param) {
  currentPage = page;
  const app = document.getElementById('app');
  if (page==='home')     renderHome(app);
  else if (page==='login')    renderLogin(app);
  else if (page==='register') renderRegister(app);
  else if (page==='post')     renderPost(app, param);
  else if (page==='write')    renderWrite(app, param);
  else if (page==='settings') renderSettings(app);
  else if (page==='notices')    renderNotices(app);
  else if (page==='prompts')    renderPrompts(app);
  else if (page==='mybox')      renderMyBox(app);
  else if (page==='flashguide') renderFlashGuide(app);
  else if (page==='guide')      renderGuide(app);
  else if (page==='admin')      renderAdmin(app, param||'posts');
  window.scrollTo(0,0);
}

/* ════════════════════════════════════════

async function renderMyBox(app) {
  if (!me) { showPage('login'); return; }
  app.innerHTML = `<div class="page"><p style="color:var(--muted);text-align:center;padding:40px"><span class="spinner"></span>불러오는 중...</p></div>`;
  try {
    const { posts, total } = await api('GET','/posts/mine');
    const used = total;
    const pct  = Math.min(100, (used/50)*100);
    const overWarn = used >= 45 ? `<span style="color:${used>=50?'#f87171':'#fbbf24'};font-size:12px;margin-left:8px">${used>=50?'⚠ 한도 도달! 삭제 후 저장 가능':'⚠ 한도 임박'}</span>` : '';
    const listHtml = posts.length === 0
      ? `<p style="color:var(--muted);text-align:center;padding:30px 0">저장된 글이 없습니다.</p>`
      : posts.map(p=>`
        <div class="mybox-item" onclick="showPage('post','${p.id}')">
          <span class="mybox-vis ${p.isPrivate?'priv':'pub'}">${p.isPrivate?'🔒 비공개':'🌐 공개'}</span>
          <span class="mybox-title">${esc(p.title)}</span>
          <span class="mybox-date">${new Date(p.createdAt).toLocaleDateString('ko-KR')}</span>
          <button class="btn danger mybox-del" onclick="event.stopPropagation();myboxDelete('${p.id}')">삭제</button>
        </div>`).join('');
    app.innerHTML = `
    <div class="page">
      <div class="back-btn" onclick="showPage('home')">← 목록으로</div>
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px">
        <h2 style="font-size:1.3rem;font-weight:700;margin:0">📁 내 저장소</h2>
        <span style="font-size:13px;color:var(--muted)">${used} / 50${overWarn}</span>
      </div>
      <div class="mybox-quota" style="margin-bottom:18px">
        <div class="mybox-quota-fill" style="width:${pct}%;background:${used>=50?'#f87171':used>=45?'#fbbf24':''}"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">${listHtml}</div>
    </div>`;
  } catch(e) { app.innerHTML=`<div class="page"><p class="err">${e.message}</p></div>`; }
}
async function myboxDelete(id) {
  if (!confirm('삭제하면 공개 피드에서도 사라집니다. 계속할까요?')) return;
  try { await api('DELETE',`/posts/${id}`); renderMyBox(document.getElementById('app')); } catch(e) { alert(e.message); }
}

  '대전권기출': { transitions:'2~3회 + 조건 해석 분기', concepts:'2~3개 인접 단원 융합, 교과서 핵심 개념 중심', strategy:'기본기 위주 출제 스타일 — 전체의 70~75%는 기본~중간 난이도, 서술형 비중 20~30%, 수업 강조 개념이 직결되는 방식', distractor:'유사 공식 혼용 결과 + 단위 환산 오류값 + 서술형 채점 경계값', query:'지역 중고등학교 내신 기출 기본기 위주 서술형 비중 높은 수학 과학 핵심 개념 중심 출제', variety:`【대전권기출 난이도 — 유형 특성】\n▸ 주력 유형: A(계산·수치형) 40~50% + F(서술·단답형) 20~30% + B(개념판단형) 15~20%\n▸ 서술형(F)은 이 난이도의 핵심 — 반드시 전체의 20~30%를 서술·단답(type=short 또는 essay)으로 출제\n▸ 서술형 특성: 풀이 과정을 단계별로 서술, 2~3중 조건이 붙은 복합 발문 포함\n▸ ㄱㄴㄷ 보기형(C): 선택적 — 있으면 교과서 핵심 개념의 참·거짓 판별 위주\n▸ 자료해석형(E): 교과서 그래프·실험 결과 활용 1~2문항\n▸ 응용·맥락형(G): 수업 교과서 예제의 수치·조건을 변형한 실생활 문제 1~2문항\n▸ 변형 다양성: 교과서 핵심 개념 직결형 우선 — 서술형에서 '조건 추가·삭제' 변형 1문항\n▸ 연속 배치 제한: 동일 유형 3문항 연속 금지, 서술형 2문항 연속 배치 금지`, detail:`\n🟡🟡🟡 [대전권기출 난이도 — AI 필독 강제 지시] 🟡🟡🟡\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n⚠️ AI 난이도 편향 경고(대전권기출): AI는 지역 내신 문제를 쉽게 만들려는 경향이 있습니다.\n   반드시 아래 자가진단을 수행하십시오:\n   ✅ 자가진단: "지역 중상위권 고등학교 내신 기출 스타일인가? 기본기 + 서술형 비중이 맞는가?" → NO이면 재작성.\n   ✅ 자가진단2: "교과서 핵심 개념이 직결되어 있으며, 수업 강조 내용이 반영되었는가?" → NO이면 즉시 폐기.\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n【대전권 기출 난이도 — 출제 제약 조건】\n▸ 시험 성격: 지역 중상위권 고등학교 내신 스타일 — "기본기 확인형" 비중이 높음.\n▸ 난이도 분포:\n   - 전체의 약 70~75%를 기본~중간 수준으로 배치.\n   - 중상위 문항 20~25%: 단원 간 개념 통합, 서술형 논리 전개 요구.\n   - 등급 분기 킬러 문항: 전체의 약 5% (1~2문항 한정) — 수능·모의고사 논리 구조를 변형한 스타일. 이 1~2문항이 최상위 등급을 가름.\n▸ 【시간 관리 설계】 킬러 1~2문항은 계산 과정이 길고 단계가 많아 시간 압박이 핵심.\n   단, 계산량만 많은 단순 노동형은 금지 — 개념 이해 + 다단계 적용 구조여야 합니다.\n▸ 수학 핵심 패턴: 다항식 나머지 정리 응용, 이차함수 최대·최소, 인수분해 변형 등 교과서 핵심 개념의 서술형 패턴 우선 출제.\n▸ 서술형 비중: 전체 문항의 20~30%를 essay/short 유형으로 출제. 서술형이 등급 분기점 역할.\n▸ 출제 스타일: 수업 시간에 강조된 교과서 핵심 개념이 시험에 직결됨.\n▸ 선지 품질 기준: 길이 균형, "언제나/반드시/모든" 금지, 단일 개념 원칙, 이중 부정 금지, 수치형 선지 크기순 배열.\n▸ 오답 선지 소재: 유사 공식 혼용 결과 + 단위 환산 오류값 + 서술형 채점 기준 경계값.\n🚫 특정 학교명·출판사명·문제집명을 문항 본문에 언급 금지.\n🚫 즉시 폐기 기준(추가):\n   - 서술형 문항이 전혀 없는 경우 (20~30% 필수)\n   - 기본 수준과 구분되지 않는 단순 개념 확인 문항\n   - 수업 강조 개념이 전혀 반영되지 않은 문항` },
  '강남8학군+전국단위자사고': { transitions:'3~5회 (전반 3회, 후반 킬러 5회 이상)', concepts:'3~4개 다단원 유기적 융합 — 단원 간 경계를 넘는 발상 전환 필수', strategy:'계산형 금지 → 조건해석형 우선 | 준킬러 시간압박 설계 | Heuristic Leap 필수 | 숨은 정의역 함정 | 복합조건 케이스 분기', distractor:'① 계산 실수 유도값(부호·지수 실수) ② 정의역·범위 누락값(조건 하나 무시) ③ 조건 충돌 간과값(복수조건 중 하나 빠뜨림) ④ 조기종료 중간결과값 — 각 선지가 구체적 실수 유형에 1:1 대응', query:'상위권 내신 심화 응용 고난도 킬러 문항 교과 융합 창의적 사고 시간 압박 설계 준킬러 조건해석 케이스분기', variety:`【강남8학군+전국단위자사고 — 유형 특성】\n▸ ⚠️ 계산형 5지선다(A)가 전체의 40%를 초과하면 즉시 재설계 — 핵심은 조건해석·유형다양성\n▸ 주력 유형 구성:\n   - C(ㄱㄴㄷ보기형): 20~25% — 직관적으로 참처럼 보이는 거짓(ㄱ)과 거짓처럼 보이는 참(ㄴ) 혼합 필수\n   - D(조건·명제추론형): 15~20% — 복수 조건 분기, Heuristic Leap 필요 구조\n   - E(자료·그래프해석형): 10~15% — 교과 간 융합 데이터 제시\n   - F(서술·증명형): 10~15% — 논리 전개·창의적 풀이 과정 서술\n   - A(계산·수치형): 30~40% (상한 40% 준수)\n▸ 변형 다양성 (2가지 이상 반드시 포함):\n   - 역추론형, 반례탐색형, 복합조건형, 일반화형 중 2가지 이상\n▸ 연속 배치 제한: 동일 유형 2문항 이상 연속 금지\n▸ 전반부: 유형 다양하게 워밍업(실력 수준) → 후반부: 고난도 유형(C·D·F) 집중 배치`, detail:`\n🔴🔴🔴 [강남8학군+전국단위자사고 — AI 필독 최우선 강제 지시] 🔴🔴🔴\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n⚠️⚠️ AI 난이도 편향 경고(강남8학군): AI는 이 난이도를 "실력" 수준으로 낮춰 생성하는 강한 경향이 있습니다.\n   절대로 쉽게 만들지 마십시오. 반드시 아래 자가진단을 수행하십시오:\n   🔴 자가진단1: "강남구 소재 상위권 고등학교 전교 상위 10% 학생이 5분 안에 이 문항을 풀 수 있는가?"\n      → YES이면 즉시 폐기.\n   🔴 자가진단2: "3개 이상의 단원 개념이 유기적으로 융합되어 있는가?" → NO이면 즉시 폐기.\n   🔴 자가진단3: "창의적/비표준 접근 없이 정형 풀이로 풀리는가?" → YES이면 즉시 폐기.\n   🔴 자가진단4: "Heuristic Leap이 없으면 제한 시간 내 불가능한 구조인가?" → NO이면 즉시 폐기.\n   🔴 자가진단5: "단순 계산형(숫자 대입→답) 구조인가?" → YES이면 즉시 폐기. 조건해석형 위주여야 합니다.\n   🔴 자가진단6: "킬러급 후반 문항은 10분 이상 소요되는 구조인가?" → NO이면 즉시 폐기.\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n【강남 8학군 / 전국단위 자사고 — 출제 제약 조건】\n▸ 시험 성격: 전국 최상위권 내신 — 교과 심화 응용 + 융합형 사고력 + 창의적 접근 요구.\n   ⚠️ 이 난이도는 실력의 "조금 어려운 버전"이 아닙니다. 완전히 다른 차원의 문항을 설계해야 합니다.\n   ▸ 목표 스타일: 시중 상위권 심화교재 최고난도 파트(STEP 3급) — 단순 유형 암기로는 접근이 어렵고,\n     조건 해석·발상 전환·케이스 분기 능력을 요구. 변별력 있는 최상위권(상위 1~5%) 선별형 구성.\n   ▸ 후반부 준킬러·킬러 문항: 교과 개념 응용 수준이 아닌 실전 심화교재 최고난도 파트 수준으로 설계.\n▸ 【핵심 전략: 계산형 → 조건해석형 전환 (최우선 원칙)】\n   ▸ 조건의 의미를 파악해야 식이 세워지는 구조\n   ▸ 절댓값·함수식·이차방정식·행렬 등에서 "조건의 의미"를 읽어야만 풀리는 구조 필수\n▸ 【준킬러 설계 필수 (시간압박 4원칙)】\n   ① 시간 소모형: 중후반 문항은 올바른 방향도 최소 7~10분 소요\n   ② 케이스 분기형: 조건에 따라 2~3개 경우를 나눠 처리해야 하는 구조\n   ③ 조건 충돌 함정: 여러 조건 중 하나 빠뜨리면 오답에 도달\n   ④ 연산 피로도형: 후반 실수를 유도하는 구조 (계산만 많은 노동형은 금지)\n▸ 논리 전환: 전반 3~4회, 킬러 후반 5회 이상.\n▸ Heuristic Leap: 비표준 접근 없이는 제한 시간 내 풀기 어려운 구조 — 필수.\n▸ "읽는 순간 안 풀리는 느낌" 설계: 킬러급은 어디서 시작할지 즉시 보이지 않는 구조.\n▸ 풀이 전략 다양성: 한 문항에 여러 풀이 경로가 경쟁하는 구조 권장.\n▸ 문항 유형 다양성 (강남8학군 특별 강제):\n   ⚠️ 계산형 5지선다만 나열하면 즉시 폐기:\n   - ㄱㄴㄷ 보기형: 참처럼 보이는 거짓(ㄱ) + 거짓처럼 보이는 참(ㄴ) 조합 필수\n   - 조건 추론형: 복수 조건을 분기·결합하는 구조\n   - 단답/서술형: 최소 1문항 이상\n   연속 3문항 이상 동일 유형·단원 배치 절대 금지.\n▸ 【선지 설계 고도화 — 강남 스타일 오답 유도 4유형】\n   ① 계산 실수 유도: 부호 실수, 지수 실수, 분수 역수 혼동 결과\n   ② 정의역·범위 누락: 정수·자연수·양수 조건 무시 시의 값\n   ③ 조건 하나 빠뜨림: 복수 조건 중 마지막 조건 간과 결과\n   ④ 조기 종료: 풀이 중간 단계를 최종 답으로 착각하는 값\n   ⚠️ 각 선지는 구체적 실수 유형에 1:1 대응. 랜덤 수치 금지.\n▸ 필수 복잡성 요소 체크리스트 (각 문항 하나 이상 적용):\n   □ 조건 다층화: 상호 연결된 복합 조건 3개 이상\n   □ 숨은 정의역: 정수·자연수 조건이 결론을 바꾸는 구조\n   □ 함수적 해석: 대수 조건을 그래프·함수 관점으로 봐야 풀리는 구조\n   □ 경우의 수 + 대수 결합\n   □ 매개변수 탐색: 케이스 탐색 필수\n   □ 구조 파악 우선: "본질이 무엇인가" 파악이 계산보다 선행\n   □ 반례 경계: boundary case에서 무너지는 함정\n🚫 즉시 폐기 기준:\n   - 단순 수치 대입→답 구조인 계산형 (조건해석 과정 없음)\n   - 창의적 관점 없이 계산량만 많은 노동집약형\n   - 교육과정 범위를 초과한 선행 개념 포함\n   - 강남 상위 10% 학생이 별 고민 없이 풀 수 있는 문항\n   - 오답 선지가 구체적 실수 유형이 아닌 랜덤 수치인 문항`, complexity:`🔴 강남8학군+전국단위자사고 — 문항별 필수 복잡성 체크리스트 (하나 이상 반드시 적용):\n  - 조건 다층화: 단순 조건 1개 → 복합 조건 3개 이상 (서로 연결된 제약)\n  - 숨은 정의역: 명시되지 않은 범위 제약 (정수 조건, 자연수 조건, 실수 범위)\n  - 함수적 해석: 대수 조건을 함수 그래프로 해석해야 풀리는 구조\n  - 경우의 수 + 대수 결합: 경우의 수 문제에 방정식 조건 꼬아 넣기\n  - 매개변수 결합: 매개변수 m이 조건을 만족하는 범위 탐색\n  - 구조 파악 우선: 계산보다 "이 문제의 본질이 무엇인가" 파악이 선행되어야 함\n  - 반례 유도: 직관적으로 맞아 보이지만 특정 경계값에서 무너지는 함정` },

function buildByteexam1sPrompt(scope, diff, total, extra, curriculum, grade, category, subMode, region, examMode) {
  scope = scope || '(시험 범위 미입력)';
  diff = diff || '기본';
  total = Math.max(5, Math.min(100, parseInt(total)||20));
  curriculum = curriculum || '2022개정';
  grade = grade || '고1';
  const half = Math.ceil(total/2);
  const spec = BE1S_DIFF_SPEC[diff] || BE1S_DIFF_SPEC['기본'];
  let twoPt=0,threePt=0,fourPt=0,fivePt=0,pointDesc;
  if(total<20||total>50){
    pointDesc=`총 100점, ${total}문항 (문항당 배점 2~5점 범위에서 합산 100점이 되도록 자유 설정)`;
  } else {
    const avg=100/total;
    if(avg<=3){threePt=100-2*total;twoPt=total-threePt;}
    else if(avg<=4){fourPt=100-3*total;threePt=total-fourPt;}
    else{fivePt=100-4*total;fourPt=total-fivePt;}
    const parts=[];
    if(twoPt>0)parts.push(`2점 ${twoPt}개`);
    if(threePt>0)parts.push(`3점 ${threePt}개`);
    if(fourPt>0)parts.push(`4점 ${fourPt}개`);
    if(fivePt>0)parts.push(`5점 ${fivePt}개`);
    pointDesc=parts.join(' + ')+' = 100점';
  }
  /* 카테고리 레이블 */
  let _catLabel = '';
  if (category === '내신') {
    _catLabel = '중학·고등 내신';
    if (subMode === '지역별' && region) _catLabel += ` > 지역별(${region})`;
    else if (subMode === '난이도유형별') _catLabel += ' > 난이도·유형별';
    else if (subMode === '모의고사대비') _catLabel += ' > 모의고사 대비';
  } else if (category === '수능') { _catLabel = '수능';
  } else if (category === '자격증') { _catLabel = '자격증 및 기타 시험'; }

  /* 과목 읽기 */
  const subject = _be1sSubject || '';
  const subjName = subject === '기타' ? (_be1sSubjectCustomName || '기타 과목') : subject;
  const subjDesc = subject === '기타' ? _be1sSubjectCustomDesc : '';

  } else if (subject === '기타' && subjName) {
    _subjBlock = `\n<subject_directive>\n【과목: ${subjName}】\n${subjDesc ? `▸ 과목 특성: ${subjDesc}\n` : ''}▸ 이 과목의 실제 시험지 형식에 맞게 적절한 자료(표·그래프·지문 등)를 활용하여 출제하십시오.\n</subject_directive>`;
  }

  let _catBlock = '';

    return `<div style="padding:4px 0 8px">` +
      text.split('\n').map(line => {
        line = line.trim();
        if (!line) return '';
        if (line.startsWith('【') && line.endsWith('】')) {
          return `<div style="font-size:12px;font-weight:700;color:#a78bfa;margin:10px 0 6px">${esc(line)}</div>`;
        } else if (line.startsWith('•')) {
          const sub = line.startsWith('•  -') || line.startsWith('•   -');
          const text = line.replace(/^•\s*-?\s*/, '').replace(/^-\s*/, '');
          return sub
            ? `<div style="padding-left:20px;font-size:11px;color:rgba(255,255,255,.45);line-height:1.7;display:flex;gap:5px"><span style="opacity:.4;flex-shrink:0">↳</span><span>${esc(text)}</span></div>`

        } else if (line.startsWith('  -')) {
          return `<div style="padding-left:24px;font-size:11px;color:rgba(255,255,255,.45);line-height:1.7;display:flex;gap:5px"><span style="opacity:.4;flex-shrink:0">↳</span><span>${esc(line.replace(/^\s*-\s*/,''))}</span></div>`;

          return `<div style="font-size:11px;color:rgba(255,255,255,.35);margin-bottom:6px">${esc(line)}</div>`;
        } else if (line.startsWith('━')) {
          return `<div style="height:1px;background:rgba(255,255,255,.07);margin:8px 0"></div>`;
        } else {
          return `<div style="font-size:11px;color:rgba(255,255,255,.4);line-height:1.7">${esc(line)}</div>`;
        }
      }).join('') + `</div>`;
  }
  const changelogHtml = isByteexamVer ? buildChangelog(content) : '';

  return `<div style="margin-bottom:4px">
    <div class="prompt-row" onclick="togglePromptDetail('${pid}')">
      <span class="prompt-badge" style="${isNew?'background:rgba(52,211,153,.15);color:#34d399;border-color:rgba(52,211,153,.3)':''}">

function copyBe1sPrompt() {
  const isDoktoogle = _be1sSubject === '독토글';
  if (isDoktoogle && (!_be1sDoktoogleBooks || _be1sDoktoogleBooks.length === 0)) { alert('책을 1권 이상 선택하세요'); return; }
  const scope = isDoktoogle
    ? ('독토글: ' + _be1sDoktoogleBooks.join(', '))
    : (document.getElementById('be1s-scope')?.value.trim() || '');
  if (!isDoktoogle && !scope) { alert('시험 범위를 입력하세요'); return; }
  const diff = document.getElementById('be1s-diff')?.value || '기본';
  const curriculum = document.getElementById('be1s-curriculum')?.value || '2022개정';
  const grade = document.getElementById('be1s-grade')?.value || '고1';
  const p = buildByteexam1sPrompt(
    scope,
    diff,
    document.getElementById('be1s-total')?.value,
    document.getElementById('be1s-extra')?.value.trim(),
    curriculum,
    grade,
    _be1sCat,
    '',
    '',
    false
  );
  navigator.clipboard.writeText(p).then(()=>{
    const s = document.getElementById('be1s-status');
    if(s){s.style.display='inline';setTimeout(()=>{s.style.display='none';},2000);}
  }).catch(()=>{
    const ta=document.createElement('textarea');ta.value=p;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    const s=document.getElementById('be1s-status');if(s){s.style.display='inline';setTimeout(()=>{s.style.display='none';},2000);}
  });
}

function togglePromptDetail(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const isOpen = el.classList.toggle('open');
  const arrow = document.getElementById(id+'-arrow');
  if (arrow) arrow.textContent = isOpen ? '▴' : '▾';
}
function copyPromptContent(id) {
  const pre = document.getElementById(id+'-pre');
  if (!pre) return;
  navigator.clipboard.writeText(pre.textContent).then(()=>{
    const btn = document.querySelector(`#${id} .prompt-copy-btn`);
    if (btn) { btn.textContent='✅ 복사됨!'; setTimeout(()=>{ btn.textContent='📋 복사'; },1800); }
  });
}

    ${GUIDE_CARD(`${STEP(3,'프롬프트 라이브러리')} <ul style="padding-left:16px;list-style:disc;display:flex;flex-direction:column;gap:4px"><li>상단 <strong>「프롬프트」</strong>를 눌러 모든 AI 프롬프트를 확인합니다.</li><li><strong>byteexam 2s</strong> 카드에서 시험 범위·난이도를 입력하면 맞춤 프롬프트가 자동 생성됩니다.</li></ul>`, '')}

    <!-- byteexam 사용법 -->
    <h3 style="font-size:15px;font-weight:700;margin:24px 0 14px;padding-bottom:6px;border-bottom:1px solid var(--border)">📋 byteexam 사용법</h3>
    ${GUIDE_CARD(`${STEP(1,'프롬프트 생성')} <ul style="padding-left:16px;list-style:disc;display:flex;flex-direction:column;gap:4px"><li>byteexam 사이드바 하단 <strong>「AI 시험지 프롬프트 생성기」</strong> 탭을 엽니다.</li><li>시험 범위 · 교육과정 · 학년 · 난이도 · 문항 수를 설정하고 <strong>「프롬프트 복사」</strong>를 누릅니다.</li><li>또는 bytenode 프롬프트 라이브러리의 <strong>byteexam 1s</strong> 카드에서도 동일하게 생성할 수 있습니다.</li></ul>`, '')}
    ${GUIDE_CARD(`${STEP(2,'AI 코드 생성')} <ul style="padding-left:16px;list-style:disc;display:flex;flex-direction:column;gap:4px"><li>복사한 프롬프트를 <strong>Claude / GPT / Gemini</strong> 등 AI 채팅에 붙여넣습니다.</li><li>AI가 <code style="background:rgba(255,255,255,.07);padding:1px 5px;border-radius:3px;font-size:11px">---BYTEEXAM-START--- ... ---BYTEEXAM-END---</code> 형식의 코드를 출력합니다.</li></ul>`, '')}
    ${GUIDE_CARD(`${STEP(3,'시험지 등록 및 미리보기')} <ul style="padding-left:16px;list-style:disc;display:flex;flex-direction:column;gap:4px"><li>byteexam 사이드바 <strong>「+ 새 시험지」</strong>를 누르고 AI 코드를 붙여넣어 저장합니다.</li><li>사이드바 목록에서 시험지를 클릭하면 2단 A4 레이아웃으로 미리보기됩니다.</li></ul>`, '')}
    ${GUIDE_CARD(`${STEP(4,'PDF 저장 / 인쇄')} <ul style="padding-left:16px;list-style:disc;display:flex;flex-direction:column;gap:4px"><li><strong>「PDF 다운로드」</strong> — A4 2단 레이아웃 PDF로 자동 저장됩니다.</li><li><strong>「인쇄」</strong> — 브라우저 인쇄 창에서 「PDF로 저장」을 선택하면 고화질 출력이 가능합니다.</li><li>문제가 페이지 경계선에서 잘리지 않도록 자동으로 배치됩니다.</li></ul>`, '')}

    <!-- 코드 필드 참고 -->
    <h3 style="font-size:15px;font-weight:700;margin:24px 0 14px;padding-bottom:6px;border-bottom:1px solid var(--border)">📌 byteexam 코드 필드 참고</h3>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px;overflow-x:auto">
      <table style="width:100%;min-width:480px;border-collapse:collapse;font-size:12.5px">
        <thead><tr style="background:rgba(255,255,255,.04);color:var(--muted)">
          <th style="padding:9px 14px;text-align:left;font-weight:700;border-bottom:1px solid var(--border)">필드</th>
          <th style="padding:9px 14px;text-align:left;font-weight:700;border-bottom:1px solid var(--border)">설명</th>

          <tr style="border-bottom:1px solid var(--border)"><td style="padding:8px 14px;color:var(--accent);font-family:monospace">type=</td><td style="padding:8px 14px">문제 유형</td><td style="padding:8px 14px">5choice / 5choice_with_bogi / short / essay</td></tr>
          <tr style="border-bottom:1px solid var(--border)"><td style="padding:8px 14px;color:var(--accent);font-family:monospace">text=</td><td style="padding:8px 14px">문제 본문</td><td style="padding:8px 14px">수식은 $…$ 또는 $$…$$</td></tr>

          <tr style="border-bottom:1px solid var(--border)"><td style="padding:8px 14px;color:var(--accent);font-family:monospace">choice1~5=</td><td style="padding:8px 14px">선택지 (원문자 필수)</td><td style="padding:8px 14px">① 내용</td></tr>
          <tr style="border-bottom:1px solid var(--border)"><td style="padding:8px 14px;color:var(--accent);font-family:monospace">answer=</td><td style="padding:8px 14px">정답 번호</td><td style="padding:8px 14px">3 → choice3이 정답</td></tr>
          <tr style="border-bottom:1px solid var(--border)"><td style="padding:8px 14px;color:var(--accent);font-family:monospace">answer_text=</td><td style="padding:8px 14px">정답 텍스트 (단답·서술)</td><td style="padding:8px 14px">x=2</td></tr>
          <tr style="border-bottom:1px solid var(--border)"><td style="padding:8px 14px;color:var(--accent);font-family:monospace">point=</td><td style="padding:8px 14px">배점</td><td style="padding:8px 14px">2 / 3 / 4 / 5</td></tr>
          <tr><td style="padding:8px 14px;color:var(--accent);font-family:monospace">explain=</td><td style="padding:8px 14px">해설</td><td style="padding:8px 14px">단계별 풀이 + 오답 원인</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 팁 -->
    <h3 style="font-size:15px;font-weight:700;margin:24px 0 14px;padding-bottom:6px;border-bottom:1px solid var(--border)">💡 팁</h3>
    <div style="display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--text2)">
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;line-height:1.7"><strong style="color:var(--accent)">수식</strong> — 인라인: <code style="background:rgba(255,255,255,.07);padding:1px 5px;border-radius:3px;font-size:11px">$x^2+1$</code>, 블록: <code style="background:rgba(255,255,255,.07);padding:1px 5px;border-radius:3px;font-size:11px">$$\\frac{a}{b}$$</code></div>
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;line-height:1.7"><strong style="color:var(--accent)">보기형</strong> — <code style="background:rgba(255,255,255,.07);padding:1px 5px;border-radius:3px;font-size:11px">type=5choice_with_bogi</code> + bogi_1, bogi_2, bogi_3 필드 추가</div>
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;line-height:1.7"><strong style="color:var(--accent)">화학 구조식</strong> — <code style="background:rgba(255,255,255,.07);padding:1px 5px;border-radius:3px;font-size:11px">[SMILES:c1ccccc1]</code> → 자동 렌더링</div>
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;line-height:1.7"><strong style="color:var(--accent)">AI 재생성</strong> — "3번 문제를 더 어렵게 바꿔줘" 처럼 요청 후 코드를 다시 붙여넣고 저장</div>
    </div>
  </div>`;
}

  try {
    const notices = await api('GET','/notices');

    const mkItem = n => `
      <div class="notice-item" style="cursor:default">
        <h4 style="margin:0 0 6px;font-size:15px">${esc(n.title)}</h4>

      </div>`;

    const empty = `<p style="color:var(--muted);padding:16px 0;font-size:14px">등록된 공지가 없습니다.</p>`;

    app.innerHTML = `
      <div class="page" style="max-width:700px">
        <h2 style="font-size:1.4rem;font-weight:800;margin-bottom:28px">공지사항</h2>

async function renderPost(app, id) {
  app.innerHTML = `<div class="page"><p style="color:var(--muted);padding:40px"><span class="spinner"></span>불러오는 중...</p></div>`;
  try {
    const p = await api('GET',`/posts/${id}`);
    const canEdit = me && (me.id===p.authorId || me.isAdmin);
    app.innerHTML = `
    <div class="page">
      <div class="back-btn" onclick="showPage('home')">← 목록으로</div>
      <div class="post-header">
        <h1 class="post-title">${esc(p.title)}</h1>
        <div class="post-meta">
          <span>${esc(p.displayName)}</span>
          <span>${timeAgo(p.createdAt)}</span>
          ${p.isPrivate?`<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(148,163,184,.12);color:#94a3b8;border:1px solid rgba(148,163,184,.25)">🔒 비공개</span>`:''}
          <span>${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</span>
        </div>
        <div class="post-actions">
          <button class="btn" id="dlTxtBtn" title="TXT 다운로드" style="font-size:12px">⬇ TXT</button>
          <button class="btn" id="dlPdfBtn" title="PDF 다운로드" style="font-size:12px">⬇ PDF</button>
          <button class="btn" id="dlPptxBtn" style="font-size:12px;background:rgba(100,180,255,.12);border-color:rgba(100,180,255,.3)">⬇ PPTX</button>
          ${p.ratio==='16:9'?`<button class="btn" id="presentBtn" style="font-size:12px;background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.3)">▶ 발표</button>`:''}
          ${canEdit?`<button class="btn" onclick="showPage('write','${p.id}')">수정</button>
          <button class="btn danger" onclick="deletePost('${p.id}')">삭제</button>`:''}
          ${me&&!canEdit?`<button class="btn" style="font-size:12px;background:rgba(239,68,68,.1);color:#f87171;border-color:rgba(239,68,68,.3)" onclick="reportPost('${p.id}','${p.authorId}')">🚩 신고</button>`:''}
        </div>
      </div>
      <div class="post-body rendered-body" id="postBody"></div>
    </div>`;
    const postBody = document.getElementById('postBody');
    postBody.innerHTML = renderByteCode(p.body);
    renderMath(postBody);
    renderGraphs(postBody);
    renderCharts(postBody);
    renderInteractive(postBody);

    const safeName = p.title.replace(/[\\/:*?"<>|]/g, '_');
    document.getElementById('dlTxtBtn').onclick = () => {
      const blob = new Blob([p.body], { type: 'text/plain;charset=utf-8' });
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: safeName + '.txt' });
      a.click(); URL.revokeObjectURL(a.href);
    };
    // ── PPTX 다운로드 (포스트 뷰) ──
    document.getElementById('dlPptxBtn').onclick = () => downloadPostPptx(p);
    // ── 발표 모드 ──
    if (document.getElementById('presentBtn')) {
      document.getElementById('presentBtn').onclick = () => startPresentation(p.body);
    }

    document.getElementById('dlPdfBtn').onclick = () => {
      const btn = document.getElementById('dlPdfBtn');
      btn.textContent = '생성 중...'; btn.disabled = true;
      const el = document.getElementById('postBody');
      // 비율 설정 (글 메타에 저장된 ratio 또는 기본 A4)
      const ratioMap = {
        'free':    { format: 'a4',       orientation: 'portrait'  },
        'a4':      { format: 'a4',       orientation: 'portrait'  },
        'a4land':  { format: 'a4',       orientation: 'landscape' },
        '16:9':    { format: [297, 167], orientation: 'landscape' },
        '4:3':     { format: [267, 200], orientation: 'landscape' },
        'square':  { format: [210, 210], orientation: 'portrait'  },
        'story':   { format: [120, 213], orientation: 'portrait'  },
      };
      const ratio = (p.ratio && ratioMap[p.ratio]) ? p.ratio : 'a4';
      const { format, orientation } = ratioMap[ratio];

      // 16:9 PPT PDF: 슬라이드별 html2canvas 캡처 → jsPDF 페이지 추가
      if (ratio === '16:9') {
        const slides = parsePostSlides(p.body);
        if (!slides.length) { btn.textContent = '⬇ PDF'; btn.disabled = false; return; }

        const PW = 1280, PH = 720; // 16:9 캔버스 픽셀 크기

        const container = document.createElement('div');
        container.style.cssText = 'position:fixed;left:-9999px;top:0;pointer-events:none';
        document.body.appendChild(container);

        // 슬라이드마다 독립 div 생성
        const slideEls = slides.map(code => {
          const div = document.createElement('div');
          const bgSpec = extractSlideBg(code);
          const bgCss = bgSpec ? bgSpec.cssProps : 'background:#0a0a0a;';
          div.style.cssText = `width:${PW}px;height:${PH}px;overflow:hidden;${bgCss}position:relative;flex-shrink:0`;
          const inner = document.createElement('div');
          inner.className = 'rendered-body';
          inner.style.cssText = `padding:36px 52px;color:#e8e8e8;width:100%;height:100%;box-sizing:border-box;overflow:hidden`;
          inner.innerHTML = renderByteCode(code);
          div.appendChild(inner);
          container.appendChild(div);
          renderMath(inner); renderGraphs(inner); renderCharts(inner); renderInteractive(inner);
          return div;
        });

        // 차트 렌더링 대기 후 캡처
        setTimeout(async () => {
          try {
            const jsPDFCls = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
            const h2c = window.html2canvas;
            if (!jsPDFCls || !h2c) { alert('PDF 라이브러리 로딩 중입니다. 잠시 후 다시 시도해주세요.'); return; }

            const pdf = new jsPDFCls({ orientation: 'landscape', unit: 'mm', format: [297, 167] });

            for (let i = 0; i < slideEls.length; i++) {
              if (i > 0) pdf.addPage([297, 167], 'landscape');
              const bgSpec = extractSlideBg(slides[i]);
              const bgColor = bgSpec ? (bgSpec.cssProps.match(/background(?:-color)?:\s*([^;]+)/)?.[1]?.trim() || '#0a0a0a') : '#0a0a0a';
              const canvas = await h2c(slideEls[i], {
                scale: 1.5, useCORS: true,
                backgroundColor: bgColor.startsWith('linear-gradient') || bgColor.startsWith('radial-gradient') ? null : bgColor,
                width: PW, height: PH,
                windowWidth: PW, windowHeight: PH,
              });
              pdf.addImage(canvas.toDataURL('image/jpeg', 0.93), 'JPEG', 0, 0, 297, 167);
            }
            pdf.save(safeName + '.pdf');
          } catch(e) { alert('PDF 생성 오류: ' + e.message); }
          finally {
            document.body.removeChild(container);
            btn.textContent = '⬇ PDF'; btn.disabled = false;
          }
        }, 900);
        return;
      }

      // A4 / 기타 비율 기존 PDF 로직
      const prevStyle = el.getAttribute('style') || '';
      el.style.cssText += ';background:#ffffff!important;color:#111111!important';

      const noBreakSel = '.bn-chart, .bn-graph, canvas, img, video, table, blockquote, hr, model-viewer, [style*="border"], [style*="border-radius"]';
      function parseCssColor(str) {
        if (!str) return null;
        const m = str.match(/[\d.]+/g);
        if (!m || m.length < 3) return null;
        return { r: +m[0], g: +m[1], b: +m[2], a: m[4] !== undefined ? +m[3] : (m[3] !== undefined ? +m[3] : 1) };
      }
      function brightness(c) { return (c.r * 299 + c.g * 587 + c.b * 114) / 1000; }

      el.querySelectorAll('*').forEach(node => {
        node._pdfStyle = node.getAttribute('style') || '';
        const cs = getComputedStyle(node);

        /* 글자색: 밝기 > 160이면 흰 배경에서 안 보임 → 어둡게 */
        const fg = parseCssColor(cs.color);
        if (fg && fg.a > 0.1 && brightness(fg) > 160) node.style.color = '#111111';

        /* 배경색: 매우 어두우면 → 밝게, 완전 투명은 skip */
        const bg = parseCssColor(cs.backgroundColor);
        if (bg && bg.a > 0.05) {
          if (brightness(bg) < 60) node.style.backgroundColor = '#f0f0f0';
          /* 어두운 배경 위의 밝은 글자였다면 글자색 재조정 */
          else if (brightness(bg) > 200 && fg && brightness(fg) > 160) node.style.color = '#111111';
        }

        if (node.matches && node.matches(noBreakSel)) {
          node.style.pageBreakInside = 'avoid';
          node.style.breakInside = 'avoid';
        }
      });

      html2pdf().set({
        margin: [12, 12],
        filename: safeName + '.pdf',
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format, orientation },
        pagebreak: { mode: ['avoid-all', 'css'], avoid: ['.bn-chart', '.bn-graph', 'canvas', 'img', 'table', 'blockquote'] }
      }).from(el).save().then(() => {
        el.setAttribute('style', prevStyle);
        el.querySelectorAll('*').forEach(node => {
          if (node._pdfStyle !== undefined) {
            node.setAttribute('style', node._pdfStyle);
            if (!node._pdfStyle) node.removeAttribute('style');
            delete node._pdfStyle;
          }
        });
        btn.textContent = '⬇ PDF'; btn.disabled = false;
      });
    };
  } catch(e) { app.innerHTML = `<div class="page"><p class="err">${e.message}</p></div>`; }
}

window._postIsPrivate = false;
function setVisibility(isPrivate) {
  window._postIsPrivate = isPrivate;
  const pub  = document.getElementById('visPublic');
  const priv = document.getElementById('visPrivate');
  const desc = document.getElementById('visDesc');
  if (!pub || !priv) return;
  if (isPrivate) {
    priv.style.background = 'var(--accent)'; priv.style.color = '#fff';
    pub.style.background  = 'var(--bg3)';    pub.style.color  = 'var(--muted)';
    if (desc) desc.textContent = '내 저장소에만 저장됩니다.';
  } else {
    pub.style.background  = 'var(--accent)'; pub.style.color  = '#fff';
    priv.style.background = 'var(--bg3)';    priv.style.color = 'var(--muted)';
    if (desc) desc.textContent = '피드와 내 저장소 모두에 공개됩니다.';
  }
}

async function deletePost(id) {
  if (!confirm('정말 삭제하시겠습니까?')) return;
  try { await api('DELETE',`/posts/${id}`); showPage('home'); } catch(e) { alert(e.message); }
}
async function reportPost(postId, authorId) {
  const reason = prompt('신고 사유를 입력해주세요:');
  if (!reason || !reason.trim()) return;
  try {
    await api('POST','/reports',{ postId, authorId, reason: reason.trim() });
    alert('신고가 접수되었습니다. 관리자가 검토합니다.');
  } catch(e) { alert(e.message); }
}

let currentTab = 'code';

// 이미지/영상 경로 별칭 맵  { '[img1]': '/uploads/uuid.png', ... }
let mediaMap = {};
let mediaCounter = 0;

// 실제 경로 → 별칭 (없으면 새로 생성)
function toAlias(url, prefix) {
  const existing = Object.entries(mediaMap).find(([,v]) => v === url);
  if (existing) return existing[0];
  mediaCounter++;
  const alias = `[${prefix}${mediaCounter}]`;
  mediaMap[alias] = url;
  return alias;
}

// 에디터 코드(별칭 포함) → 저장용 코드(실제 경로)
function editorToBody(code) {
  return code.replace(/\[(img|vid)\d+\]/g, alias => mediaMap[alias] || alias);
}

// 저장된 코드(실제 경로) → 에디터 코드(별칭)
function existingBodyToEditor(code) {
  if (!code) return '';
  mediaMap = {};
  mediaCounter = 0;
  // img: URL 패턴 치환
  return code.replace(/(<img:\s*)(\S+)/g, (_, prefix, url) => {
    if (url === 'size') return prefix + url; // size 키워드는 건드리지 않음
    return prefix + toAlias(url, 'img');
  }).replace(/(<video:\s*)(\S+)/g, (_, prefix, url) => {
    if (url === 'size') return prefix + url;
    return prefix + toAlias(url, 'vid');
  });
}
function switchTab(tab) {

// textarea 키 감지: <img: > 또는 <video: > 입력 시 파일 창 자동 오픈
function setupEditorKeys() {
  const ta = document.getElementById('codeInput');
  if (!ta) return;
  ta.addEventListener('input', function() {
    const val = ta.value;
    const pos = ta.selectionStart;
    const imgMatch = val.slice(0, pos).match(/<img:\s*>$/);
    const vidMatch = val.slice(0, pos).match(/<video:\s*>$/);
    if (imgMatch) {
      const insertPos = pos - 1;
      ta.setSelectionRange(insertPos, insertPos);
      uploadVideo_or_img('img', insertPos);
    } else if (vidMatch) {
      const insertPos = pos - 1;
      ta.setSelectionRange(insertPos, insertPos);
      uploadVideo_or_img('video', insertPos);
    }
    updateRulers();
  });
  ta.addEventListener('scroll', updateRulers);
}

function updateRulers() {
  const ta = document.getElementById('codeInput');
  const xRuler = document.getElementById('editorRuler');
  const yRuler = document.getElementById('editorYRuler');
  if (!ta || !xRuler || !yRuler) return;

  // X 눈금: 칸 수
  const cols = Math.round(ta.clientWidth / 20); // 약 20px per col
  let xHtml = '';
  for (let i = 1; i <= cols; i++) {
    xHtml += `<span style="flex:0 0 20px;text-align:center;font-size:9px;color:var(--muted2);font-family:'Courier New',monospace;overflow:hidden">${i%5===0?i:i%2===0?'·':''}</span>`;
  }
  xRuler.innerHTML = xHtml;

  // Y 눈금: 줄 수
  const lineCount = ta.value.split('\n').length;
  const rulerLines = Math.max(lineCount + 5, 20);
  let yHtml = '';
  for (let i = 1; i <= rulerLines; i++) {
    yHtml += `<div style="height:1.6em;line-height:1.6em;font-size:10px">${i%5===0?i:''}</div>`;
  }
  yRuler.innerHTML = yHtml;
  // 스크롤 동기화
  yRuler.scrollTop = ta.scrollTop;
}

function uploadVideo_or_img(type, cursorPos) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = type === 'img' ? 'image/*' : 'video/*';
  input.onchange = async () => {
    const fd = new FormData();
    fd.append('image', input.files[0]);
    try {
      const r = await api('POST','/upload/image', fd, true);
      const alias = toAlias(r.url, type === 'img' ? 'img' : 'vid');
      const ta = document.getElementById('codeInput');
      const before = ta.value.slice(0, cursorPos);
      const after  = ta.value.slice(cursorPos);
      ta.value = before + alias + after;
    } catch(e) { alert(e.message); }
  };
  input.click();
}

async function submitPost(editId) {
  if (editorMode === 'flashppt') {
    savePptCurrentSlide();
    const ci = document.getElementById('codeInput');
    if (ci) ci.value = assemblePptCode();
  }
  const title = document.getElementById('postTitle').value.trim();
  const body  = editorToBody(document.getElementById('codeInput').value.trim());
  const tags  = document.getElementById('postTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const coverImage = document.getElementById('postCover').value.trim();
  const ratioEl = document.getElementById('postRatio');
  const ratio = ratioEl ? ratioEl.value : 'free';
  const isPrivate = document.getElementById('visPrivate')?.style.background === 'var(--accent)' ||
                    document.getElementById('visPrivate')?.classList.contains('active') ||
                    window._postIsPrivate === true;
  const msg = document.getElementById('writeMsg');
  if (!title || !body) { msg.innerHTML='<p class="err">제목과 본문을 입력하세요.</p>'; return; }
  try {
    if (editId) {
      await api('PATCH',`/posts/${editId}`,{title,body,tags,coverImage,ratio,isPrivate});
      showPage('post', editId);
    } else {
      const r = await api('POST','/posts',{title,body,tags,coverImage,ratio,isPrivate});
      showPage('post', r.id);
    }
  } catch(e) { msg.innerHTML=`<p class="err">${e.message} — 저장에 실패했습니다. 잠시 후 다시 눌러보세요.</p>`; }

async function changeAvatar() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.style.cssText = 'position:fixed;left:-9999px;opacity:0;pointer-events:none';
  document.body.appendChild(input);

  const cleanup = () => { if (input.parentNode) document.body.removeChild(input); };

  input.addEventListener('cancel', cleanup);
  input.onchange = async () => {
    const file = input.files && input.files[0];
    cleanup();
    if (!file) return;

    const btn = document.querySelector('[onclick="changeAvatar()"]');
    const origText = btn ? btn.textContent : '';
    if (btn) { btn.textContent = '업로드 중...'; btn.disabled = true; }

    const fd = new FormData();
    fd.append('avatar', file);
    try {
      const r = await api('POST', '/auth/avatar', fd, true);
      const img = document.getElementById('avatarImg');
      if (img) img.src = r.url + '?v=' + Date.now();
      me.avatar = r.url;
      localStorage.setItem('bn_me', JSON.stringify(me));
      renderHeader();
    } catch(e) { alert(e.message); }
    finally { if (btn) { btn.textContent = origText; btn.disabled = false; } }
  };
  input.click();
}

async function renderAdmin(app, section) {
  if (!me?.isAdmin) { showPage('home'); return; }
  const adminLinks = [
    {key:'posts', label:'게시글 관리'},
    {key:'users', label:'유저 관리'},
    {key:'notices', label:'공지 관리'},
    {key:'reports', label:'신고 관리', danger:true},
    {key:'prompts', label:'프롬프트 관리'},
    {key:'chatbot', label:'챗봇 FAQ'},
    {key:'stats', label:'통계'},
  ];
  const sidebarItems = adminLinks.map(l=>`<a class="${section===l.key?'active':''}" onclick="showPage('admin','${l.key}')" ${l.danger&&section!==l.key?'style="color:#f87171"':''}>${l.label}</a>`).join('');
  const mobileTabItems = adminLinks.map(l=>`<a class="${section===l.key?'active':''}" onclick="showPage('admin','${l.key}')" ${l.danger&&section!==l.key?'style="color:#f87171"':''}>${l.label}</a>`).join('');
  app.innerHTML = `
  <div class="admin-layout" style="flex-direction:column">
    <nav class="admin-mobile-tabs">${mobileTabItems}</nav>
    <div style="display:flex;flex:1">
      <nav class="admin-sidebar">${sidebarItems}</nav>
      <div class="admin-content" id="adminContent">
        <div><span class="spinner"></span> 로딩 중...</div>
      </div>
    </div>
  </div>`;

  const el = document.getElementById('adminContent');
  if (section==='posts') await adminPosts(el);
  else if (section==='users') await adminUsers(el);
  else if (section==='notices') await adminNotices(el);
  else if (section==='reports') await adminReports(el);
  else if (section==='prompts') await adminPrompts(el);
  else if (section==='chatbot') await adminChatbot(el);
  else if (section==='stats') await adminStats(el);
}

async function adminPosts(el) {
  try {
    const posts = await api('GET','/admin/posts');

    // 헤더 영역
    const header = document.createElement('div');
    header.style.cssText = 'display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap';

    const title = document.createElement('div');
    title.className = 'admin-title';
    title.style.margin = '0';
    title.innerHTML = `게시글 관리 <span style="font-size:13px;color:var(--muted)">(${posts.length}개)</span>`;

    const selAllBtn = document.createElement('button');
    selAllBtn.className = 'btn';
    selAllBtn.style.cssText = 'font-size:11px;padding:3px 10px';
    selAllBtn.textContent = '전체 선택';

    const bulkDelBtn = document.createElement('button');
    bulkDelBtn.className = 'btn danger';
    bulkDelBtn.id = 'adminBulkDelBtn';
    bulkDelBtn.style.cssText = 'font-size:11px;padding:3px 10px;display:none';
    bulkDelBtn.textContent = '선택 삭제';

    header.append(title, selAllBtn, bulkDelBtn);

    // 테이블
    const table = document.createElement('table');
    table.className = 'admin-table';
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr><th style="width:30px"><input type="checkbox" id="adminChkAll"></th><th>제목</th><th>작성자</th><th>날짜</th><th>상태</th><th></th></tr>';
    const tbody = document.createElement('tbody');
    posts.forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="checkbox" class="admin-post-chk" data-id="${esc(p.id)}"></td>
        <td style="cursor:pointer;color:var(--accent)">${esc(p.title)}</td>
        <td>${esc(p.displayName)}</td>
        <td>${new Date(p.createdAt).toLocaleDateString('ko')}</td>
        <td>${p.published?'<span style="color:var(--success)">공개</span>':'<span style="color:var(--muted)">비공개</span>'}</td>
        <td><button class="btn danger" data-del="${esc(p.id)}" style="font-size:11px;padding:3px 8px">삭제</button></td>`;
      // 제목 클릭
      tr.querySelector('td:nth-child(2)').addEventListener('click', () => showPage('post', p.id));
      tbody.appendChild(tr);
    });
    table.append(thead, tbody);

    el.innerHTML = '';
    el.append(header, table);

    // 체크박스 상태 업데이트
    const updateBulkBtn = () => {
      const checks = [...el.querySelectorAll('.admin-post-chk')];
      const any = checks.some(c => c.checked);
      bulkDelBtn.style.display = any ? 'inline-block' : 'none';
      const chkAll = el.querySelector('#adminChkAll');
      if (chkAll && checks.length) chkAll.checked = checks.every(c => c.checked);
    };

    // 전체선택 체크박스
    thead.querySelector('#adminChkAll').addEventListener('change', function() {
      el.querySelectorAll('.admin-post-chk').forEach(c => c.checked = this.checked);
      updateBulkBtn();
    });

    // 개별 체크박스
    tbody.addEventListener('change', e => {
      if (e.target.classList.contains('admin-post-chk')) updateBulkBtn();
    });

    // 전체 선택 버튼
    selAllBtn.addEventListener('click', () => {
      el.querySelectorAll('.admin-post-chk').forEach(c => c.checked = true);
      const chkAll = el.querySelector('#adminChkAll');
      if (chkAll) chkAll.checked = true;
      updateBulkBtn();
    });

    // 개별 삭제 버튼
    tbody.addEventListener('click', async e => {
      const btn = e.target.closest('[data-del]');
      if (!btn) return;
      if (!confirm('이 게시글을 삭제하시겠습니까?')) return;
      btn.textContent = '...'; btn.disabled = true;
      try {
        await api('DELETE', `/posts/${btn.dataset.del}`);
        await adminPosts(el);
      } catch(err) {
        alert('삭제 실패: ' + err.message);
        btn.textContent = '삭제'; btn.disabled = false;
      }
    });

    // 선택 삭제 버튼
    bulkDelBtn.addEventListener('click', async () => {
      const ids = [...el.querySelectorAll('.admin-post-chk:checked')].map(c => c.dataset.id);
      if (!ids.length) return;
      if (!confirm(`선택한 ${ids.length}개 게시글을 삭제하시겠습니까?`)) return;
      bulkDelBtn.disabled = true;
      let failed = 0;
      for (let i = 0; i < ids.length; i++) {
        bulkDelBtn.textContent = `삭제 중... (${i+1}/${ids.length})`;
        try { await api('DELETE', `/posts/${ids[i]}`); } catch { failed++; }
      }
      if (failed) alert(`${failed}개 삭제에 실패했습니다.`);
      await adminPosts(el);
    });

  } catch(e) { el.innerHTML = `<p class="err">${e.message}</p>`; }
}

async function adminCredSave(id) {
  const newUsername = document.getElementById('credNewUsername').value.trim();
  const newPassword = document.getElementById('credNewPassword').value.trim();
  const errEl = document.getElementById('credErr');
  if (!newUsername && !newPassword) { errEl.textContent = '변경할 내용을 입력하세요.'; return; }
  const btn = document.getElementById('credSaveBtn');
  btn.disabled = true; btn.textContent = '저장 중...';
  try {
    await api('PATCH', `/admin/users/${id}/credentials`, {
      username: newUsername || undefined,
      password: newPassword || undefined
    });
    document.getElementById('adminCredModal').remove();
    renderAdmin(document.getElementById('app'), 'users');
  } catch(e) {
    errEl.textContent = e.message;
    btn.disabled = false; btn.textContent = '저장';
  }
}

async function adminBanUser(id, username, isBanned) {
  if (isBanned) {
    if (!confirm(`${username} 정지를 해제하시겠습니까?`)) return;
    try { await api('POST','/admin/unban',{id}); renderAdmin(document.getElementById('app'),'users'); } catch(e) { alert(e.message); }
  } else {
    const reason = prompt(`${username} 정지 사유를 입력하세요 (빈칸 = 기본 사유):`);

  }
}
