        <div class="admin-title" style="margin:0">챗봇 FAQ 관리 <span style="font-size:13px;color:var(--muted)">(${faqs.length}개)</span></div>
        <button class="btn" id="cbAddBtn" style="font-size:12px;padding:4px 12px">+ FAQ 추가</button>
      </div>
      <div id="cbList"></div>`;
    const list = el.querySelector('#cbList');
    faqs.forEach((faq, idx) => {
      const item = document.createElement('div');
      item.style.cssText = 'background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px';
      item.innerHTML = `
        <div style="display:flex;align-items:flex-start;gap:10px">
          <div style="flex:1">
            <div style="font-weight:600;margin-bottom:4px;color:var(--white)">${escHtml(faq.question)}</div>
            <div style="font-size:13px;color:var(--muted);line-height:1.55">${escHtml(faq.answer)}</div>
            ${faq.followUps?.length ? `<div style="margin-top:8px;font-size:12px;color:var(--muted2)">↳ 후속질문 ${faq.followUps.length}개</div>` : ''}
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
            <button class="btn" style="font-size:11px;padding:2px 8px" onclick="cbMove('${faq.id}','up')" ${idx===0?'disabled':''}>↑</button>
            <button class="btn" style="font-size:11px;padding:2px 8px" onclick="cbMove('${faq.id}','down')" ${idx===faqs.length-1?'disabled':''}>↓</button>
            <button class="btn" style="font-size:11px;padding:2px 8px" onclick="cbEdit('${faq.id}')">편집</button>
            <button class="btn danger" style="font-size:11px;padding:2px 8px" onclick="cbDel('${faq.id}')">삭제</button>
          </div>
        </div>`;
      list.appendChild(item);
    });
    el.querySelector('#cbAddBtn').onclick = () => cbShowForm(null, null, load);
  };
  window.cbMove = async (id, dir) => {
    await api('PATCH', `/chatbot/faqs/${id}/move`, { dir });
    load();
  };
  window.cbDel = async (id) => {
    if (!confirm('삭제하시겠습니까?')) return;
    await api('DELETE', `/chatbot/faqs/${id}`);
    load();
  };
  window.cbEdit = async (id) => {
    const { faqs } = await api('GET', '/chatbot/faqs');
    const faq = faqs.find(f => f.id === id);
    if (faq) cbShowForm(faq.id, faq, load);
  };
  await load();
}

function cbShowForm(id, faq, onSave) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  const followUps = faq?.followUps ? JSON.parse(JSON.stringify(faq.followUps)) : [];
  const renderFollowUps = () => followUps.map((f, i) => `
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:4px">후속질문 ${i+1}</div>
      <input class="fu-q" data-i="${i}" value="${escHtml(f.question)}" placeholder="후속 질문" style="width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:6px 10px;color:var(--white);font-size:13px;box-sizing:border-box;margin-bottom:6px">
      <textarea class="fu-a" data-i="${i}" placeholder="후속 답변" style="width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:6px 10px;color:var(--white);font-size:13px;resize:vertical;min-height:60px;box-sizing:border-box">${escHtml(f.answer)}</textarea>
      <button onclick="this.closest('[data-fuidx]').remove();followUps.splice(${i},1)" style="font-size:11px;padding:2px 8px;background:none;border:1px solid #f87171;color:#f87171;border-radius:5px;cursor:pointer;margin-top:4px">제거</button>
    </div>`).join('');
  overlay.innerHTML = `
    <div style="background:var(--bg2);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:28px 24px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
        <div style="font-size:1.1rem;font-weight:700">${id?'FAQ 편집':'FAQ 추가'}</div>
        <button id="cbFormClose" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">✕</button>
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">질문</label>
        <input id="cbQ" value="${escHtml(faq?.question||'')}" placeholder="자주 묻는 질문을 입력하세요" style="width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;color:var(--white);font-size:14px;box-sizing:border-box">
      </div>
      <div style="margin-bottom:16px">
        <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">답변</label>
        <textarea id="cbA" placeholder="답변을 입력하세요" style="width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;color:var(--white);font-size:14px;resize:vertical;min-height:90px;box-sizing:border-box">${escHtml(faq?.answer||'')}</textarea>
      </div>
      <div style="margin-bottom:8px">
        <div style="font-size:12px;color:var(--muted);margin-bottom:8px">후속 질문 (선택)</div>
        <div id="cbFuList">${renderFollowUps()}</div>
        <button id="cbAddFu" style="font-size:12px;padding:5px 12px;background:var(--bg3);border:1px solid var(--border2);color:var(--muted);border-radius:6px;cursor:pointer;width:100%;margin-top:4px">+ 후속질문 추가</button>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px">
        <button id="cbFormClose2" class="btn" style="font-size:13px">취소</button>
        <button id="cbFormSave" class="btn" style="font-size:13px;background:var(--accent)">저장</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#cbFormClose').onclick = overlay.querySelector('#cbFormClose2').onclick = () => overlay.remove();
  overlay.querySelector('#cbAddFu').onclick = () => {
    followUps.push({ question: '', answer: '' });
    overlay.querySelector('#cbFuList').innerHTML = renderFollowUps();
    overlay.querySelectorAll('.fu-q').forEach(inp => inp.oninput = e => { followUps[+e.target.dataset.i].question = e.target.value; });
    overlay.querySelectorAll('.fu-a').forEach(ta => ta.oninput = e => { followUps[+e.target.dataset.i].answer = e.target.value; });
  };
  const syncFu = () => {
    overlay.querySelectorAll('.fu-q').forEach(inp => followUps[+inp.dataset.i] && (followUps[+inp.dataset.i].question = inp.value));
    overlay.querySelectorAll('.fu-a').forEach(ta => followUps[+ta.dataset.i] && (followUps[+ta.dataset.i].answer = ta.value));
  };
  overlay.querySelector('#cbFormSave').onclick = async () => {
    syncFu();
    const question = overlay.querySelector('#cbQ').value.trim();
    const answer = overlay.querySelector('#cbA').value.trim();
    if (!question || !answer) return alert('질문과 답변을 입력하세요.');
    if (id) await api('PUT', `/chatbot/faqs/${id}`, { question, answer, followUps });
    else await api('POST', '/chatbot/faqs', { question, answer, followUps });
    overlay.remove();
    await onSave();
  };
}

  document.getElementById('modalBox').innerHTML = html;

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('open');
}

const AI_PROMPT = `너는 bytenode 블로그의 글 작성자야. 아래의 태그 문법만 사용해서 글을 써줘.

🚫【출력 형식 절대 제한 — 이 규칙은 어떤 상황에서도 예외 없음】🚫
너는 절대로 아래 형식으로 출력하면 안 된다:
× HTML 태그나 코드 (<div>, <p>, <h1> 등)
× Markdown 형식 (##, **, --, | 표, --- 구분선 등)
× 코드 블록 (\`\`\`…\`\`\`)
× "제목:", "내용:", "섹션:" 같은 레이블 텍스트로 문서 서술
× 일반 산문 형식으로 문서 내용 직접 작성

유일하게 허용되는 출력:
✓ 이 프롬프트에 정의된 <태그: 내용> 형식의 커스텀 태그만 나열
✓ 태그 사이의 빈 줄 (세로 공백용으로만)

【필수 규칙 (bytenode 1 공통)】
1. 모든 태그는 <명령: 내용> 형식이야. 태그 안에 절대 > 문자를 쓰지 마.
2. 태그 안에 태그를 절대 중첩하지 마. <indent: <mark: 내용>> 이런 형식은 완전히 금지.
3. 링크는 {https://url} 링크문구 형식으로만 써. Markdown [텍스트](URL) 절대 금지.
4. 빈 줄은 실제 세로 공백이 돼. 섹션 사이엔 1줄만 써.
5. 없는 이미지 경로는 절대 쓰지 마.
6. 수식 안에 > 는 \\gt, < 는 \\lt 로 대체해. 절대 그냥 쓰지 마.

【텍스트 태그】
<xt: 제목>            → 큰 제목
<1t: 내용> ~ <9t: 내용> → 크기별 텍스트 (1이 가장 작고 9가 가장 큼, 5가 기본)
<bt: 내용>            → 굵게
<it: 내용>            → 기울임
<mark: 내용>          → 형광펜 강조
<code: 코드>          → 인라인 코드
<badge: 텍스트>       → 작은 배지 (태그 레이블)
<color:색이름_5t: 내용> → 색상 텍스트. 색 이름(red, blue 등) 또는 #hex 사용 가능

【정렬 · 블록 (태그 중첩 절대 금지, 일반 텍스트만 내용으로 넣을 것)】
<center: 내용>   → 가운데 정렬
<right: 내용>    → 오른쪽 정렬
<indent: 내용>   → 들여쓰기
<quote: 내용>    → 인용문
<box: 내용>      → 테두리 박스
<callout: 내용>  → 강조 박스

【간격 · 선】
<->              → 가로 한 칸 공백 (인라인)
<N->             → 가로 N칸 공백 (예: <5->)
<spacer: 20Q>    → 세로 여백. Q = 픽셀. 20Q = 20px. 너무 크게 쓰지 마.
<grid x>                   → 가로 구분선
<color:색_grid x>          → 색상 가로선 (예: <color:silver_grid x>)
<grid y_l=2Q>              → 세로선 (높이 지정)
<color:색_grid y_l=2Q>     → 색상 세로선

【이미지 · 영상 · 갤러리】
<img: /uploads/파일명>                           → 이미지 (실제 업로드된 파일만)
<img: /uploads/파일명 size x:20Q y:12Q middle>   → 크기+정렬 (up/middle/down)
<img: /uploads/파일명 link:https://url>           → 클릭 이미지
<video: /uploads/파일명>                          → 영상
<video: /uploads/파일명 size x:30Q y:17Q>        → 크기 지정 영상
<gallery: /uploads/a.jpg /uploads/b.jpg>          → 이미지 갤러리

【링크】
태그 내부에서 {https://url} 링크문구 형식으로 사용.
올바른 예: <5t: 자세히 보기 {https://example.com} 바로가기>
잘못된 예: <5t: [바로가기](https://example.com)>  ← 절대 금지

【수학 기호 (LaTeX)】
$수식$    → 인라인 수식. 예: $x^2 + 1$
$$수식$$  → 블록 수식 (별도 줄에 크게 표시). 예: $$x = \\frac{-b \\pm \\sqrt{b^2-4ac}}{2a}$$
주의: 수식 안에 > 는 반드시 \\gt, < 는 \\lt 로 쓸 것. 그냥 쓰면 파서가 깨짐.

【화학식 (KaTeX mhchem)】
$\\ce{화학식}$   → 인라인 화학식
$$\\ce{화학식}$$ → 블록 화학식

화학식 예시:
$\\ce{H2O}$                     → 물
$\\ce{CO2}$                     → 이산화탄소
$\\ce{H2SO4}$                   → 황산
$\\ce{Na+ + Cl- -> NaCl}$       → 반응식
$\\ce{A + B <=> C + D}$         → 가역 반응 (이 경우 <=> 는 괜찮음, \\ce 안이라서)
$$\\ce{6CO2 + 6H2O -> C6H12O6 + 6O2}$$ → 광합성 (블록)

주의: \\ce{} 안의 화살표(->)는 그대로 써도 됨. 단, 태그 밖 > < 는 여전히 \\gt \\lt 사용.

【표】
<table: 헤더1|헤더2|헤더3 // 값1|값2|값3 // 값4|값5|값6>   → 기본 표 (첫 행 헤더)
<table: 값1|값2 // 값3|값4 header:no>                       → 헤더 없는 표

표 규칙:
- | 로 열 구분, // 로 행 구분
- 첫 행이 자동으로 헤더(굵은 배경)
- 헤더 없애려면 끝에 header:no 추가
- 셀 안에 | 나 // 는 사용 불가

【수학 그래프】
<graph: y=수식>                          → 기본 그래프 (x범위 -10~10, 크기 medium)
<graph: y=수식 range:-5,5>              → x축 범위 직접 지정
<graph: y=수식1 | y=수식2 range:-5,5>  → 여러 함수 동시 표시 (|로 구분)
<graph: y=수식 size:large>             → 크기 지정: small / medium / large

수식 규칙:
- 곱셈은 반드시 * 사용 (2x → 2*x, ax^2 → a*x^2)
- 거듭제곱: x^2, x^3
- 내장 함수: sin(x), cos(x), tan(x), sqrt(x), abs(x), log(x), exp(x)
- y= 는 생략 가능
- 수식 안에 > < 절대 쓰지 말 것 (\\gt \\lt 사용)

그래프 예시:
<graph: y=x^2 range:-5,5>
<graph: y=x^2 - 2*x - 3 | y=x^2 - 2*x + 1 | y=x^2 - 2*x + 3 range:-2,5 size:large>
<graph: y=sin(x) | y=cos(x) range:-6.28,6.28 size:medium>

【3D 모델】
<model3d: /uploads/파일.glb>               → GLB 3D 모델 삽입
<model3d: /uploads/파일.glb autorotate>    → 자동 회전
<model3d: /uploads/파일.glb autorotate size:large>  → 크기 지정 (small|medium|large)
- 지원 형식: GLB, GLTF
- camera-controls 기본 제공 (마우스/터치로 회전·확대 가능)
- autorotate 키워드 추가 시 자동 회전

【시작 방법 — 반드시 따를 것】
이 프롬프트를 받으면 절대로 바로 글을 작성하지 마.
반드시 먼저 사용자에게 이렇게 물어봐:

【데이터 수집 및 검증 프로토콜 — 인포그래픽 작성 전 반드시 실행】

인포그래픽에 포함할 데이터·통계·사실은 아래 3단계 검증 절차를 거쳐야 한다.

▶ 1단계 — 불량 출처 사전 배제 (Exclusion)
다음 유형의 출처는 절대 사용하지 말 것:
- 개인 블로그, 네이버 블로그/카페, 티스토리, 브런치 등 비전문 발행물
- 나무위키, 위키백과, 오픈사전 등 누구나 편집 가능한 사용자 기여형 자료
- SNS 게시물(트위터·인스타그램·유튜브 자막 등)
- 도메인이 불명확하거나 신규 개설된 사이트, 유명 매체 도메인을 변형한 스펠링
- 정치·종교 편향이 강한 매체, 확증편향적 표현·선정적 헤드라인을 쓰는 사이트
- 출처·저자 불명의 상업성 광고 보고서

▶ 2단계 — 신뢰 출처 우선 수집 (Priority Sources)
아래 범주의 출처를 우선적으로 사용할 것:
① 정부·공공기관: 통계청(kostat.go.kr), 교육부, 보건복지부, Data.gov, OECD Data
② 학술·연구기관: RISS, DBpia, KCI, PubMed, Google Scholar, 대학 공식 보고서
③ 공신력 있는 언론: 연합뉴스, KBS, 조선일보, 한겨레 등 주요 매체의 팩트 기사
④ 기업 공식 채널: IR 자료, 공식 뉴스룸, 연간보고서
⑤ 국제기관: WHO, World Bank, UN, IMF 공식 데이터

▶ 3단계 — 3중 교차검증 (Cross-Verification)
수집한 데이터·통계는 반드시 아래 3개의 서로 다른 유형의 출처에서 일치 여부를 확인한다:
A. 공식 기관(정부·학술기관) 원문 확인
B. 주요 언론 보도 인용 확인
C. 독립 팩트체크 또는 제2의 연구기관 통계 비교
→ 3개 중 2개 이상에서 불일치할 경우 해당 수치는 "추정치" 또는 "○○ 기준"으로 명시하거나 제외한다.

▶ 출처 명시 의무
검증 완료된 데이터는 인포그래픽 내에서 <footnote: 출처: ...> 태그로 반드시 표기한다.
날짜·수치·통계가 포함된 모든 항목에 출처를 달 것.

【시작 방법 — 반드시 따를 것】
이 프롬프트를 받으면 절대로 바로 글을 작성하지 마.
반드시 먼저 사용자에게 이렇게 물어봐:

"어떤 주제로 인포그래픽을 만들어 드릴까요? 주제, 담고 싶은 데이터나 핵심 내용, 대상 독자를 알려주세요."

사용자가 주제를 알려주면:

🚫【출력 형식 절대 제한 — 이 규칙은 어떤 상황에서도 예외 없음】🚫
너는 절대로 아래 형식으로 출력하면 안 된다:
× PowerPoint(.pptx) 파일 생성 또는 슬라이드 내용 직접 서술
× HTML, CSS, JavaScript 코드 작성
× Markdown 형식 (##, **, ---, | 표 등)
× 코드 블록 (\`\`\`…\`\`\`)
× "슬라이드 1:", "제목:", "내용:" 같은 레이블로 슬라이드 직접 작성
× 번호·불릿으로 슬라이드 내용을 일반 텍스트로 나열
× :contentReference[oaicite:...]{index=...} 같은 외부 인용 마커 포함 금지 (태그 내용에서 완전히 제거)
× 수학 문제·시험 문제·학습 내용 등을 설명하거나 풀어주는 행동 (PPT 슬라이드 태그 출력만 허용)

유일하게 허용되는 출력:
✓ 이 프롬프트에 정의된 <slide:>, <slidecover:>, <7t:> 등 커스텀 태그만 나열
✓ 태그 사이의 빈 줄 (세로 공백용으로만)

【★ 페이지(슬라이드) 구분 — 가장 중요한 규칙 ★】
이 시스템에서 슬라이드는 반드시 아래 태그로만 구분된다.
<slide: 제목>        ← 이 태그가 나올 때마다 새로운 슬라이드 페이지가 시작됨
<slidecover: ...>    ← 표지 슬라이드 (첫 페이지에만 사용)

절대로 --- 줄, 빈 줄, 숫자, 마크다운 제목(#) 등으로 슬라이드를 나누지 마.
오직 <slide:> 또는 <slidecover:> 태그만이 슬라이드를 구분한다.

슬라이드 구분 구조 (이 형식을 반드시 지킬 것):
<slidecover: 전체 발표 제목 | 부제목 | #배경색>
<slide: 1번 슬라이드 제목>
(1번 슬라이드 내용 태그들)
<slide: 2번 슬라이드 제목>
(2번 슬라이드 내용 태그들)
<slide: 3번 슬라이드 제목>
(3번 슬라이드 내용 태그들)

【필수 규칙】
1. 모든 태그는 <명령: 내용> 형식. 태그 안에 > 절대 금지.
2. 태그 중첩 절대 금지.
3. 첫 줄은 반드시 <slidecover:> 로 시작. 이후 각 슬라이드는 <slide:> 로 시작.
4. 슬라이드 하나에 내용을 너무 많이 넣지 마. 태그 5~7개 이내가 적당.
5. 슬라이드 내부 빈 줄은 세로 공백. 1줄 이내로.
6. 없는 이미지 경로 절대 쓰지 마.

【자율 편집 모드】
사용자가 "더 예쁘게", "수정해줘", "전문적으로", "자유롭게 편집"처럼 요청하면 다음 원칙으로 스스로 개선한다:
1. 기존 주제와 핵심 내용을 보존하되, 레이아웃·색상·강조 방식은 자율적으로 재설계한다.
2. 단순 텍스트 나열은 partition, freebox, gradbox, gradshape, gradtext, stat, chart로 시각화한다.
3. 수정 요청이면 전체를 무조건 갈아엎지 말고 문제 슬라이드/요소를 우선 고친다.
4. 내용이 많으면 슬라이드를 분리하고, 한 슬라이드에는 핵심 메시지 하나만 남긴다.
5. 디자인이 밋밋하면 slidebg + meshbg + gradtext/gradbox/gradshape를 적극 활용한다.
【슬라이드 전용 태그】
<slide: 제목>                    → ★ 새 슬라이드 시작 (이 줄부터 새 페이지)
<slide: 제목 | 부제목>           → 부제목 포함 슬라이드
<slide: 제목 | bg:#1e3a5f>       → 배경색 지정 슬라이드 (부제목 없이)
<slide: 제목 | 부제목 | bg:gradient|#1e3a5f|#7c3aed> → 그라데이션 배경
<slidecover: 제목 | 부제목 | 색> → ★ 표지 슬라이드 시작 (첫 번째 페이지)
<slidenote: 메모>                 → 발표자 노트 (해당 슬라이드 하단에 작게 표시)
<slidebg: 배경스펙>               → 슬라이드 배경 지정 (slide 태그 바로 다음에 사용)

slidebg 사용 예:
<slide: AI와 미래>

<bt: 슬라이드 내용>

<slidecover: 제목 | 부제목 | gradient|#0f172a|#7c3aed> → slidecover 색상란에도 그라데이션 직접 지정 가능

【🎨 캔버스 레이아웃 태그 — 고급 공간 설계 / Canva형 2D 캔버스】
※ 이 태그들은 bytenode-ppt 1e에서만 사용 가능한 고급 레이아웃 기능이야.
※ 슬라이드는 100×100 정규화 좌표계로 생각한다. x, y, w, h는 모두 0~100 비율이다.

【공간 계획 프로토콜 — 새 슬라이드마다 필수】
각 <slide:> 바로 다음에는 시각 요소 배치 전에 반드시 <slidenote: 공간 계획 - ...>를 1개 작성한다.
공간 계획에는 다음을 짧게 포함한다:
- 사용할 레이아웃 방식: partition / grid / freebox 중 선택
- freebox를 쓰는 경우 각 박스의 x, y, w, h를 적고 x+w<=95, y+h<=95인지 확인
- 나란히 놓는 박스는 왼쪽 박스의 x+w가 오른쪽 박스 x보다 최소 5 작게 배치
- 겹침이 의도된 장식이 아니라면 충돌이 없다고 명시

【동적 파티션 / 그리드】
<partition: 구성 | 간격>
<gridcell>
(셀 내용 — 모든 태그 사용 가능)
<endcell>
<gridcell>
(다음 셀 내용)
<endcell>
<endgrid>
→ 슬라이드를 구조적으로 분할한다. <grid:>와 동일하게 동작하지만, 디자인 계획용으로는 <partition:>을 우선 사용한다.
구성 예:
<partition: 50-50 | 20px>       → 2등분
<partition: 30-70 | 18px>       → 좌 30 / 우 70
<partition: 33-33-33 | 14px>    → 3등분
<partition: 1fr 2fr | 20px>     → CSS Grid 비율
<partition: 2x2 | 12px>         → 2열×2행 매트릭스

【자유 배치 캔버스】
<freebox: x, y, w, h, z>
(내용 태그들)
<endbox>
→ 100×100 좌표계에서 절대 위치 배치. 숫자만 써도 %로 처리한다.
→ 파서는 x+w>100 또는 y+h>100이면 자동으로 폭/높이를 클램핑한다.
→ z는 레이어 순서이며 자유 상자는 내부적으로 10 이상으로 보정된다.

【메시 그라데이션 배경】
<meshbg: 색1 | 색2 | 색3 | 색4>
→ 슬라이드 안에 쓰면 배경 레이어로 적용된다. 마지막 색은 베이스 컬러다.
→ slidebg와 함께 쓰면 고급 배경감을 만든다.
예: <meshbg: #0f172a | #1e3a8a | #581c87 | #020617>

【SVG 벡터 에셋】
<svg-asset: 너비, 높이>
<svg-rect: x, y, 너비, 높이, fill, borderRadius>
<svg-circle: cx, cy, r, fill>
<svg-line: x1, y1, x2, y2, 색상, 굵기>
<svg-text: x | y | 텍스트 | 색상 | 폰트크기>
<endsvg>
→ path는 사용하지 말고 rect/circle/line/text 같은 단순 도형만 사용한다.

【디자인 시맨틱 팔레트】
- AI / 기술 / 미래: #0f172a, #1e3a8a, #581c87, #38bdf8
- 의료 / 환경 / 생명: #064e3b, #10b981, #ccfbf1, #f8fafc
- 금융 / 신뢰 / 비즈니스: #0f172a, #1e40af, #f59e0b, #94a3b8
- 교육 / 수학 / 과학: #111827, #2563eb, #7c3aed, #f8fafc
- 문화 / 예술 / 포트폴리오: #18181b, #be123c, #f97316, #f5f5f5

【그라데이션 글씨 / 도형】
<gradtext: 색1 | 색2 | 텍스트 | 크기>
→ 큰 제목이나 키워드에 그라데이션 글씨 적용. 크기는 1~9, 기본 7.
예: <gradtext: #38bdf8 | #a78bfa | 핵심 개념 한눈에 보기 | 8>

<gradbox: 색1 | 색2 | 텍스트 | dark/light>
→ 그라데이션 배경의 강조 도형 박스. dark는 흰 글씨, light는 어두운 글씨.
예: <gradbox: #2563eb | #7c3aed | 오늘의 핵심 질문 | dark>

<gradshape: 모양 | 색1 | 색2 | 너비 | 높이 | 텍스트 | dark/light>
→ 그라데이션 도형 요소. 모양은 rect, pill, circle, diamond 중 선택.
예: <gradshape: pill | #06b6d4 | #8b5cf6 | 260px | 72px | 핵심 도형 | dark>
SVG 도형 fill에도 grad(색1,색2)를 사용할 수 있다.
예: <svg-rect: 20, 20, 260, 120, grad(#2563eb,#7c3aed), 14>
예: <svg-circle: 420, 120, 70, grad(#38bdf8,#a78bfa)>
【캔버스 설계 원칙】
1. freebox 좌표는 100×100 기준. 모든 x+w, y+h는 가능하면 95 이하.
2. 구조가 명확한 슬라이드는 partition을 우선 사용하고, 강조·겹침·비대칭 구성은 freebox를 사용.
3. 제목/본문/차트가 서로 겹치지 않도록 각 박스 간격을 최소 5% 둔다.
4. 배경은 slidebg + meshbg 조합을 적극 사용하되, 텍스트 대비를 최우선으로 한다.
5. 한 슬라이드에는 핵심 메시지 하나만 둔다. 복잡하면 슬라이드를 나눈다.

【🎨 인라인 글자 색상 · 그라데이션】
※ 어떤 텍스트 태그 안에서도 단어·문장 단위로 색을 지정할 수 있다.

<c: #색 | 텍스트>                     → 특정 색깔 인라인 스팬
<gc: #색1,#색2 | 텍스트>             → 단어/구절에 그라데이션 적용
<colortext: #f00:단어 | 일반 | #0af:다른단어>  → 여러 색 단어를 한 줄에 나열

예시:
<bt: <c: #38bdf8 | AI>는 <gc: #f59e0b,#ef4444 | 세상을 바꾼다>>
→ "AI"는 하늘색, "세상을 바꾼다"는 주황→빨강 그라데이션으로 표시됨

<colortext: #38bdf8:HBM | 시장 점유율 | #4ade80:80% | 달성>
→ 각 단어가 지정 색으로 표시됨

셀 단위 색상 (<xtable:> 전용): 셀값 뒤에 ::#색 추가
예: GPU 서버::##4ade80 (셀 글자가 초록색)

【📊 고급 표 (xtable)】
<xtable: H1|H2|H3 // R1C1|R1C2|R1C3 // R2C1|R2C2|R2C3 | head:#색 | stripe:#색 | border:#색>
→ // 로 행 구분, | 로 열 구분. head/stripe/border 색 지정 가능.
→ 셀 글자 색은 값 뒤에 ::#색으로 지정 (예: +200%::#4ade80)

예시:
<xtable: 구분|수치|상태 // GPU 서버|+320%|급성장::#4ade80 // DRAM|+185%|호조::#60a5fa // NAND|-12%|조정::#f87171 | head:#1e40af | stripe:#0f172a>

【🖼 배경 패널 · 분할 배경】
※ freebox 안에서 첫 번째 태그로 사용하면 그 freebox의 배경색이 됨.
※ 단독 사용 시에는 장식용 색 블록으로 표시됨.

<bgblock: #색>                          → 단색 배경 패널
<bgblock: #색1,#색2>                   → 그라데이션 배경 패널

【🏆 AI 디자인 팁 — 자율 편집 시 반드시 참고】
1. 색 대비 법칙: 어두운 배경(#0f172a 계열)에는 밝은 텍스트(#e2e8f0, #60a5fa), 밝은 배경에는 어두운 텍스트.
2. 3색 원칙: 슬라이드당 메인 색 1개 + 강조 색 1개 + 중립 색(회색·흰색) 1개로 제한.
3. 여백의 힘: 콘텐츠가 적을수록 전달력이 강하다. 슬라이드 채우기에 집착 금지.
4. 비대칭 레이아웃: 60-40 또는 40-60 파티션이 50-50보다 역동적으로 보임.
5. 포인트 컬러: gradtext + gradbox는 슬라이드당 1~2개로 아껴쓸 때 임팩트가 강함.
6. 배경 레이어: slidebg(기본 배경) + freebox bgblock(장식 패널) + meshbg(빛번짐) 세 레이어를 조합.
7. 타이포 위계: 제목(7t~9t 또는 gradtext) → 부제목(5t~6t) → 본문(4t~5t, bt) → 캡션(3t) 순서 유지.
8. 차트는 이야기를 한다: 차트 타이틀에 "~가 ~% 증가" 같은 핵심 인사이트 문장을 넣어라.
9. 왼쪽 정렬 우선: 가운데 정렬은 표지와 한 줄 강조에만. 본문은 왼쪽 정렬이 읽기 편하다.
10. 슬라이드 번호 확인: 내용이 6~7개 이상이면 슬라이드를 분리. 한 페이지에 핵심 1개.

let editorMode = 'bytenode';

function detectPostMode(body) {
  if (!body) return 'bytenode';
  if (/^<(slide|slidecover):/m.test(body)) return 'flashppt';
  if (/^<(stat|piechart|barchart|donut|funnel|pyramid|gauge|bubbles|versus|steps|timeline|kpi|iconrow|cardrow|heatmap):/m.test(body)) return 'flashinfo';
  return 'bytenode';
}

const MODE_DEFAULT_RATIO = {
  bytenode: 'free', flashinfo: 'free', flashppt: '16:9',
};
const MODE_PROMPTS = {
  bytenode: () => AI_PROMPT,
  flashinfo: () => FLASHINFO_PROMPT,
  flashppt: () => FLASHPPT_PROMPT,
};

function setEditorMode(mode) {
  const prev = editorMode;
  editorMode = mode;
  const ratioSel = document.getElementById('ratioSelect');
  const ratioRow = document.getElementById('ratioRow');
  const isBase = mode === 'bytenode';
  if (ratioSel) { ratioSel.style.display = isBase ? 'none' : ''; ratioSel.value = MODE_DEFAULT_RATIO[mode] || 'free'; }
  if (ratioRow) { ratioRow.style.display = isBase ? 'none' : ''; const pr = document.getElementById('postRatio'); if(pr) pr.value = MODE_DEFAULT_RATIO[mode]||'free'; }

  const editorWrap = document.querySelector('.editor-wrap');
  const pptWrap = document.getElementById('pptEditorWrap');
  if (!editorWrap || !pptWrap) return;

  if (mode === 'flashppt') {
    // sync from textarea → ppt slides
    const ci = document.getElementById('codeInput');
    initPptSlides(ci ? ci.value : '');
    editorWrap.style.display = 'none';
    pptWrap.style.display = 'block';
  } else {
    if (prev === 'flashppt') {
      // sync ppt slides → textarea
      savePptCurrentSlide();
      const ci = document.getElementById('codeInput');
      if (ci) ci.value = assemblePptCode();
    }
    editorWrap.style.display = 'block';
    pptWrap.style.display = 'none';
  }
}

function copyEditorPrompt() {
  const promptFn = MODE_PROMPTS[editorMode] || MODE_PROMPTS.bytenode;
  let base = promptFn();
  const title = (document.getElementById('postTitle')?.value||'').trim();
  const request = (document.getElementById('postRequest')?.value||'').trim();
  const extra = [
    title ? `제목: ${title}` : '',
    request ? `요청사항: ${request}` : '',
  ].filter(Boolean).join('\n');
  const proTip = '\n\n💡 붙여넣기 전, AI의 사고 모드(잘 생각하기) 또는 Pro 모드로 전환하는 것을 권장합니다.';
  const prompt = base + (extra ? '\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n' + extra : '') + proTip;
  navigator.clipboard.writeText(prompt).then(() => {
    const btn = document.getElementById('editorCopyBtn');
    const orig = btn.textContent;
    btn.textContent = '복사됨!';
    btn.style.background = 'rgba(134,239,172,.15)';
    btn.style.color = '#86efac';
    setTimeout(() => {
      btn.textContent = orig;
      btn.style.background = '';
      btn.style.color = '';
    }, 2000);
  }).catch(() => alert('복사 실패'));
}

/* ═══════════════════════════════════════════
   PPT SLIDE EDITOR
═══════════════════════════════════════════ */
let pptSlides = []; // [{title, code}]
let pptCurrentIdx = 0;

function parsePptSlides(fullCode) {
  const trimmed = (fullCode || '').trim();
  if (!trimmed) {
    return [{ title: '새 슬라이드', code: '' }]; // 빈 슬라이드 — placeholder만 보임
  }
  const lines = trimmed.split('\n');
  const slides = [];
  let cur = null;
  for (const line of lines) {
    const m = line.match(/^<(slide|slidecover):\s*(.+?)>/i);
    if (m) {
      if (cur) slides.push(cur);
      const rawTitle = m[2].split('|')[0].trim();
      cur = { title: rawTitle, code: line + '\n' };
    } else {
      if (!cur) cur = { title: '표지 전 내용', code: '' };
      cur.code += line + '\n';
    }
  }
  if (cur) slides.push(cur);
  if (!slides.length) slides.push({ title: '새 슬라이드', code: '' });
  return slides;
}

function assemblePptCode() {
  return pptSlides.map(s => s.code.replace(/\n+$/, '')).join('\n');
}

function savePptCurrentSlide() {
  if (!pptSlides.length) return;
  const ta = document.getElementById('pptSlideInput');
  if (!ta) return;
  const code = ta.value;
  // re-derive title from first slide line
  const firstLine = code.split('\n')[0] || '';
  const m = firstLine.match(/^<(slide|slidecover):\s*(.+?)>/i);
  pptSlides[pptCurrentIdx].code = code;
  if (m) pptSlides[pptCurrentIdx].title = m[2].split('|')[0].trim();
}

function initPptSlides(code) {
  pptSlides = parsePptSlides(code);
  pptCurrentIdx = 0;
  renderPptSlideList();
  loadPptSlide(0);
}

function renderPptSlideList() {
  const container = document.getElementById('pptSlideItems');
  const countEl = document.getElementById('pptSlideCount');
  if (!container) return;
  if (countEl) countEl.textContent = pptSlides.length;
  container.innerHTML = pptSlides.map((s, i) => `
    <div class="ppt-slide-item ${i===pptCurrentIdx?'active':''}" onclick="selectPptSlide(${i})">
      <div class="ppt-slide-num">${i+1}</div>
      <div class="ppt-slide-title">${esc(s.title)}</div>
      ${pptSlides.length>1?`<button class="ppt-slide-del" onclick="event.stopPropagation();deletePptSlide(${i})" title="삭제">×</button>`:''}
    </div>`).join('');
}

function loadPptSlide(idx) {
  pptCurrentIdx = idx;
  const ta = document.getElementById('pptSlideInput');
  const label = document.getElementById('pptSlideLabel');
  if (!ta || !pptSlides[idx]) return;
  ta.value = pptSlides[idx].code;
  if (label) label.textContent = `슬라이드 ${idx+1} — ${pptSlides[idx].title}`;
}

function selectPptSlide(idx) {
  savePptCurrentSlide();
  renderPptSlideList();
  loadPptSlide(idx);
  renderPptSlideList(); // re-render to update active
}

function addPptSlide() {
  savePptCurrentSlide();
  const n = pptSlides.length + 1;
  pptSlides.splice(pptCurrentIdx + 1, 0, { title: `슬라이드 ${n}`, code: '' });
  pptCurrentIdx = pptCurrentIdx + 1;
  renderPptSlideList();
  loadPptSlide(pptCurrentIdx);
}

function duplicatePptSlide() {
  savePptCurrentSlide();
  const src = pptSlides[pptCurrentIdx];
  pptSlides.splice(pptCurrentIdx + 1, 0, { title: src.title + ' (복사)', code: src.code });
  pptCurrentIdx = pptCurrentIdx + 1;
  renderPptSlideList();
  loadPptSlide(pptCurrentIdx);
}

function deletePptSlide(idx) {
  if (pptSlides.length <= 1) { alert('슬라이드가 1개 남아 삭제할 수 없습니다.'); return; }
  pptSlides.splice(idx, 1);
  if (pptCurrentIdx >= pptSlides.length) pptCurrentIdx = pptSlides.length - 1;
  renderPptSlideList();
  loadPptSlide(pptCurrentIdx);
}

function onPptSlideInput() {
  const ta = document.getElementById('pptSlideInput');
  if (!ta) return;
  const val = ta.value;

  // 여러 슬라이드 태그가 감지되면 자동 분리
  const slideTagCount = (val.match(/^<(slide|slidecover):/gmi) || []).length;
  if (slideTagCount > 1) {
    const newSlides = parsePptSlides(val);
    // 현재 슬라이드 위치에 분리된 슬라이드들로 교체
    pptSlides.splice(pptCurrentIdx, 1, ...newSlides);
    renderPptSlideList();
    loadPptSlide(pptCurrentIdx);
    return;
  }

  // 단일 슬라이드: 제목만 live-update
  const firstLine = val.split('\n')[0] || '';
  const m = firstLine.match(/^<(slide|slidecover):\s*(.+?)>/i);
  if (m) {
    pptSlides[pptCurrentIdx].title = m[2].split('|')[0].trim();
    const items = document.querySelectorAll('.ppt-slide-item');
    if (items[pptCurrentIdx]) {
      const titleEl = items[pptCurrentIdx].querySelector('.ppt-slide-title');
      if (titleEl) titleEl.textContent = pptSlides[pptCurrentIdx].title;
    }
  }
}

function pptInsert(text) {
  const ta = document.getElementById('pptSlideInput');
  if (!ta) return;
  const pos = ta.selectionStart;
  const before = ta.value.slice(0, pos);
  const after = ta.value.slice(pos);
  const ins = (before.endsWith('\n') || before === '' ? '' : '\n') + text + '\n';
  ta.value = before + ins + after;
  ta.selectionStart = ta.selectionEnd = pos + ins.length;
  ta.focus();
}

function pptPreviewAll() {
  savePptCurrentSlide();
  const code = assemblePptCode();
  const pw = document.getElementById('pptPreviewWrap');
  const pc = document.getElementById('pptPreviewContent');
  if (!pw || !pc) return;
  pw.style.display = '';
  pc.innerHTML = renderByteCode(editorToBody(code));
  renderMath(pc);
  renderGraphs(pc);
  renderCharts(pc);
  renderInteractive(pc);
  pw.scrollIntoView({ behavior: 'smooth' });
}

/* ── PPTX 공통 상수 & 유틸 ── */
const PPTX_ACCENT  = '60a5fa';
const PPTX_LIGHT   = 'e8e8e8';
const PPTX_MUTED   = '888888';
const PPTX_COLORS  = ['60a5fa','4ade80','f472b6','fb923c','a78bfa','34d399','fbbf24','38bdf8','e879f9','facc15'];

function pptHex(c) {
  if (!c) return PPTX_ACCENT;
  return c.replace('#','').replace(/^(\w)(\w)(\w)$/,'$1$1$2$2$3$3');
}

// ── 슬라이드 배경 스펙 파서 ──
// spec 예시: "#1e3a5f" / "gradient|#1e3a5f|#7c3aed|135deg" / "dots|#fff|#0a0a0a" / etc.
function parseBgSpec(spec) {
  if (!spec) return null;
  const raw = spec.trim();
  const p = raw.split('|').map(s => s.trim());
  const type = p[0].toLowerCase();

  const toHex = c => (c||'').replace('#','').replace(/^(\w)(\w)(\w)$/,'$1$1$2$2$3$3') || '0a0a0a';

  if (type === 'gradient') {
    const c1 = p[1] || '#1e3a5f', c2 = p[2] || '#7c3aed';
    const angle = (p[3] || '135deg').replace('deg','');
    return {
      cssProps: `background:linear-gradient(${angle}deg,${c1},${c2});`,
      pptxBg: { type:'grad', color:toHex(c1), color2:toHex(c2), angle:parseInt(angle)||135 }
    };
  }
  if (type === 'dots') {
    const fg = p[1] || 'rgba(255,255,255,.15)', bg = p[2] || '#0d1117';
    return {
      cssProps: `background-color:${bg};background-image:radial-gradient(circle,${fg} 1.5px,transparent 1.5px);background-size:24px 24px;`,
      pptxBg: { type:'solid', color:toHex(bg) }
    };
  }
  if (type === 'grid') {
    const fg = p[1] || 'rgba(255,255,255,.08)', bg = p[2] || '#0d1117';
    return {
      cssProps: `background-color:${bg};background-image:linear-gradient(${fg} 1px,transparent 1px),linear-gradient(90deg,${fg} 1px,transparent 1px);background-size:32px 32px;`,
      pptxBg: { type:'solid', color:toHex(bg) }
    };
  }
  if (type === 'stripe' || type === 'stripes') {
    const fg = p[1] || 'rgba(255,255,255,.06)', bg = p[2] || '#0d1117';
    return {
      cssProps: `background-color:${bg};background-image:repeating-linear-gradient(45deg,${fg},${fg} 1px,transparent 1px,transparent 18px);`,
      pptxBg: { type:'solid', color:toHex(bg) }
    };
  }
  if (type === 'circuit') {
    const fg = p[1] || 'rgba(96,165,250,.18)', bg = p[2] || '#0a0f1e';
    const svgEncoded = encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><path d='M10 10h10v10H10zM40 10h10v10H40zM10 40h10v10H10zM40 40h10v10H40z' fill='none' stroke='${fg}' stroke-width='1'/><line x1='20' y1='15' x2='40' y2='15' stroke='${fg}' stroke-width='1'/><line x1='15' y1='20' x2='15' y2='40' stroke='${fg}' stroke-width='1'/><line x1='45' y1='20' x2='45' y2='40' stroke='${fg}' stroke-width='1'/><line x1='20' y1='45' x2='40' y2='45' stroke='${fg}' stroke-width='1'/><circle cx='30' cy='15' r='2' fill='${fg}'/><circle cx='15' cy='30' r='2' fill='${fg}'/><circle cx='45' cy='30' r='2' fill='${fg}'/><circle cx='30' cy='45' r='2' fill='${fg}'/></svg>`);
    return {
      cssProps: `background-color:${bg};background-image:url("data:image/svg+xml,${svgEncoded}");background-size:60px 60px;`,
      pptxBg: { type:'solid', color:toHex(bg) }
    };
  }
  if (type === 'topography') {
    const fg = p[1] || 'rgba(255,255,255,.07)', bg = p[2] || '#0a0a0a';
    const svgEncoded = encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><path d='M0 40 Q20 20 40 40 Q60 60 80 40' fill='none' stroke='${fg}' stroke-width='1'/><path d='M0 60 Q20 40 40 60 Q60 80 80 60' fill='none' stroke='${fg}' stroke-width='1'/><path d='M0 20 Q20 0 40 20 Q60 40 80 20' fill='none' stroke='${fg}' stroke-width='1'/></svg>`);
    return {
      cssProps: `background-color:${bg};background-image:url("data:image/svg+xml,${svgEncoded}");background-size:80px 80px;`,
      pptxBg: { type:'solid', color:toHex(bg) }
    };
  }
  if (type === 'waves') {
    const fg = p[1] || 'rgba(96,165,250,.12)', bg = p[2] || '#0a0f1e';
    const svgEncoded = encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='100' height='40'><path d='M0 20 C25 0 75 40 100 20 C125 0 175 40 200 20' fill='none' stroke='${fg}' stroke-width='1.5'/></svg>`);
    return {
      cssProps: `background-color:${bg};background-image:url("data:image/svg+xml,${svgEncoded}");background-size:100px 40px;`,
      pptxBg: { type:'solid', color:toHex(bg) }
    };
  }
  if (type === 'noise') {
    const bg = p[1] || '#1a1a2e';
    // SVG feTurbulence 노이즈 패턴
    const svgEncoded = encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feBlend in='SourceGraphic' mode='overlay'/></filter><rect width='200' height='200' filter='url(#n)' opacity='0.08'/></svg>`);
    return {
      cssProps: `background-color:${bg};background-image:url("data:image/svg+xml,${svgEncoded}");background-size:200px 200px;`,
      pptxBg: { type:'solid', color:toHex(bg) }
    };
  }
  if (type === 'mesh') {
    const c1 = p[1] || '#1e3a5f', c2 = p[2] || '#7c3aed', bg = p[3] || '#0a0a0a';
    return {
      cssProps: `background-color:${bg};background-image:radial-gradient(ellipse at 20% 20%,${c1}55 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,${c2}55 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,${c2}33 0%,transparent 40%);`,
      pptxBg: { type:'grad', color:toHex(c1), color2:toHex(c2), angle:135 }
    };
  }
  // 기본: 단색 (hex 또는 색이름)
  return {
    cssProps: `background:${raw};`,
    pptxBg: { type:'solid', color:toHex(raw) }
  };
}

// 슬라이드 코드에서 배경 스펙 추출
function extractSlideBg(slideCode) {
  const lines = slideCode.trim().split('\n');
  // slidecover의 3번째 파이프 (색상)
  const coverM = lines[0]?.match(/^<slidecover:\s*(.+?)>$/i);
  if (coverM) {
    const pts = coverM[1].split('|').map(s=>s.trim());
    if (pts[2]) return parseBgSpec(pts[2]);
  }
  // slide의 bg: 인라인
  const slideM = lines[0]?.match(/^<slide:\s*(.+?)>$/i);
  if (slideM) {
    const pts = slideM[1].split('|').map(s=>s.trim());
    const last = pts[pts.length-1];
    if (last?.startsWith('bg:')) return parseBgSpec(last.slice(3).trim());
  }
  // <slidebg: spec> 태그
  for (const line of lines) {
    const bgM = line.trim().match(/^<slidebg:\s*(.+?)>$/i);
    if (bgM) return parseBgSpec(bgM[1]);
  }
  return null;
}

// 차트 태그 파싱 → {labels, values, title, size}
function parsePptChart(inner) {
  const titleM = inner.match(/\btitle:([^|>]+)/);
  const sizeM  = inner.match(/\bsize:(small|medium|large)/);
  const title  = titleM ? titleM[1].trim() : '';
  const size   = sizeM  ? sizeM[1]  : 'medium';
  const clean  = inner.replace(/\btitle:[^|>]+/g,'').replace(/\bsize:\w+/g,'').trim();
  const pairs  = clean.split('|').map(s=>s.trim()).filter(Boolean);
  const labels = [], values = [];
  for (const p of pairs) {
    const m = p.match(/^(.+?):(\-?[\d.]+)$/);
    if (m) { labels.push(m[1].trim()); values.push(parseFloat(m[2])); }
  }
  return { labels, values, title, size };
}

// pptxBg 객체 → slide.background 적용
function applyPptxBg(slide, pptxBg) {
  if (!pptxBg) return;
  if (pptxBg.type === 'grad') {
    // PptxGenJS 그라데이션은 shape로 구현 (배경색은 첫번째 색으로)
    slide.background = { color: pptxBg.color };
  } else {
    slide.background = { color: pptxBg.color || '0a0a0a' };
  }
}

// 슬라이드 코드 → PptxGenJS slide 객체 채우기 (공통)
function buildPptxSlideContent(pres, slide, slideCode, slideIdx) {
  // 배경 먼저 추출 후 적용
  const initBg = extractSlideBg(slideCode);
  if (initBg) applyPptxBg(slide, initBg.pptxBg);
  else slide.background = { color: '0a0a0a' };

  const lines = slideCode.trim().split('\n');
  let y = 0.3;
  let ti = 0;

  while (ti < lines.length) {
    const t = lines[ti++].trim();
    if (!t) { y += 0.18; continue; }
    if (y > 5.2) continue; // 슬라이드 하단 초과 방지

    // ── slidebg 태그 (런타임 재적용) ──
    const bgM = t.match(/^<slidebg:\s*(.+?)>$/i);
    if (bgM) {
      const bg = parseBgSpec(bgM[1]);
      if (bg) applyPptxBg(slide, bg.pptxBg);
      continue;
    }

    // ── 슬라이드 헤더 ──
    const slideM = t.match(/^<slide(?:cover)?:\s*(.+?)>$/i);
    if (slideM) {
      const pts = slideM[1].split('|').map(s=>s.trim());
      if (/^<slidecover/i.test(t)) {
        const coverBg = parseBgSpec(pts[2] || '1e3a5f');
        if (coverBg) applyPptxBg(slide, coverBg.pptxBg);
        else slide.background = { color: pptHex(pts[2]||'1e3a5f') };
        slide.addText(pts[0], { x:1,y:1.8,w:8,h:1.2,fontSize:36,bold:true,color:'FFFFFF',align:'center' });
        if (pts[1]) slide.addText(pts[1], { x:1,y:3.2,w:8,h:0.6,fontSize:20,color:'CCCCCC',align:'center' });
      } else {
        slide.addShape(pres.ShapeType.roundRect,{x:0.3,y:0.15,w:0.4,h:0.28,fill:{color:PPTX_ACCENT},rectRadius:0.06});
        slide.addText(String(slideIdx+1),{x:0.3,y:0.15,w:0.4,h:0.28,fontSize:10,bold:true,color:'FFFFFF',align:'center',valign:'middle'});
        slide.addText(pts[0],{x:0.85,y:0.12,w:9,h:0.4,fontSize:22,bold:true,color:PPTX_LIGHT});
        if (pts[1]) slide.addText(pts[1],{x:0.85,y:0.55,w:9,h:0.3,fontSize:14,color:PPTX_MUTED});
        slide.addShape(pres.ShapeType.line,{x:0.3,y:0.58,w:9.4,h:0,line:{color:'333333',width:1}});
        y = 0.9;
      }
      continue;
    }

    // ── 발표자 노트 ──
    if (/^<slidenote:/i.test(t)) {
      slide.addText('📝 '+t.replace(/^<slidenote:\s*/i,'').replace(/>$/,''),{x:0.3,y:5.1,w:9.4,h:0.35,fontSize:9,color:PPTX_MUTED,italic:true});
      continue;
    }

    // ── 차트: 막대그래프 ──
    const barM = t.match(/^<(?:barchart|hbar):\s*(.+?)>$/i);
    if (barM) {
      const { labels, values, title, size } = parsePptChart(barM[1]);
      const isHbar = /^<hbar/i.test(t);
      const h = size==='large'?3.2:size==='small'?1.8:2.5;
      if (labels.length) {
        const chartData = [{ name:'데이터', labels, values }];
        const chartOpts = {
          x:0.3, y, w:9.4, h,
          chartColors: PPTX_COLORS.slice(0, labels.length),
          showTitle: !!title, title, titleFontSize:11, titleColor:PPTX_MUTED,
          showLegend:false, showValue:true, valAxisHidden:true, catAxisLabelColor:PPTX_LIGHT,
          valGridLine:{style:'none'}, plotArea:{fill:{color:'0a0a0a'}},
          chartArea:{fill:{color:'111111'},border:{color:'222222',pt:1}},
        };
        slide.addChart(isHbar ? pres.ChartType.barH : pres.ChartType.bar, chartData, chartOpts);
        y += h + 0.2;
      }
      continue;
    }

    // ── 차트: 원형/도넛 ──
    const pieM = t.match(/^<(piechart|donut):\s*(.+?)>$/i);
    if (pieM) {
      const { labels, values, title, size } = parsePptChart(pieM[2]);
      const h = size==='large'?3.2:size==='small'?1.8:2.5;
      const w = h * (16/9) * 0.55;
      if (labels.length) {
        const chartData = [{ name:'데이터', labels, values }];
        const isDoughnut = /donut/i.test(pieM[1]);
        const chartOpts = {
          x: (9.4-w)/2 + 0.3, y, w, h,
          chartColors: PPTX_COLORS.slice(0, labels.length),
          showTitle: !!title, title, titleFontSize:11, titleColor:PPTX_MUTED,
          showLegend:true, legendPos:'r', legendColor:PPTX_LIGHT, legendFontSize:9,
          holeSize: isDoughnut ? 55 : 0,
          chartArea:{fill:{color:'111111'},border:{color:'222222',pt:1}},
          plotArea:{fill:{color:'111111'}},
        };
        slide.addChart(isDoughnut ? pres.ChartType.doughnut : pres.ChartType.pie, chartData, chartOpts);
        y += h + 0.2;
      }
      continue;
    }

    // ── 차트: 선/면적 ──
    const lineM = t.match(/^<(linechart|areachart):\s*(.+?)>$/i);
    if (lineM) {
      const { labels, values, title, size } = parsePptChart(lineM[2]);
      const h = size==='large'?3.2:size==='small'?1.8:2.5;
      if (labels.length) {
        const chartData = [{ name:'데이터', labels, values }];
        const chartOpts = {
          x:0.3, y, w:9.4, h,
          chartColors:[PPTX_ACCENT],
          showTitle:!!title, title, titleFontSize:11, titleColor:PPTX_MUTED,
          showLegend:false, showValue:false,
          lineDataSymbol:'circle', lineDataSymbolSize:4,
          catAxisLabelColor:PPTX_LIGHT, valAxisLabelColor:PPTX_MUTED,
          valGridLine:{color:'333333',style:'dash',pt:0.5},
          plotArea:{fill:{color:'0a0a0a'}},
          chartArea:{fill:{color:'111111'},border:{color:'222222',pt:1}},
        };
        slide.addChart(pres.ChartType.line, chartData, chartOpts);
        y += h + 0.2;
      }
      continue;
    }

    // ── 차트: 레이더 ──
    const radarM = t.match(/^<radar:\s*(.+?)>$/i);
    if (radarM) {
      const { labels, values, title, size } = parsePptChart(radarM[1]);
      const h = size==='large'?3.2:size==='small'?2:2.6;
      if (labels.length) {
        const chartData = [{ name:'데이터', labels, values }];
        slide.addChart(pres.ChartType.radar, chartData, {
          x:2,y,w:6,h, chartColors:[PPTX_ACCENT],
          showTitle:!!title,title, titleFontSize:11,titleColor:PPTX_MUTED,
          catAxisLabelColor:PPTX_LIGHT,
          chartArea:{fill:{color:'111111'},border:{color:'222222',pt:1}},
          plotArea:{fill:{color:'0a0a0a'}},
        });
        y += h + 0.2;
      }
      continue;
    }

    // ── stat ──
    const statM = t.match(/^<stat:\s*([\s\S]*)>$/i);
    if (statM) {
      const p = statM[1].split('|').map(s=>s.trim());
      const col = pptHex(p[2]||PPTX_ACCENT);
      slide.addText(p[0],{x:0.3,y,w:4,h:0.7,fontSize:32,bold:true,color:col});
      if(p[1]) slide.addText(p[1],{x:0.3,y:y+0.7,w:4,h:0.28,fontSize:11,color:PPTX_MUTED});
      y += 1.1; continue;
    }

    // ── kpi ──
    const kpiM = t.match(/^<kpi:\s*(.+?)>/i);
    if (kpiM) {
      const items = kpiM[1].split('|').map(s=>s.trim());
      const cw = 9.4 / items.length;
      items.forEach((item, i) => {
        const [lbl,val] = item.split(':').map(s=>s.trim());
        const col = PPTX_COLORS[i % PPTX_COLORS.length];
        const x = 0.3 + i*cw;
        slide.addShape(pres.ShapeType.roundRect,{x,y:y-0.05,w:cw-0.15,h:0.9,fill:{color:'161616'},rectRadius:0.1});
        slide.addText(val||lbl,{x:x+0.1,y:y+0.05,w:cw-0.3,h:0.45,fontSize:20,bold:true,color:col,align:'center'});
        if(val) slide.addText(lbl,{x:x+0.1,y:y+0.55,w:cw-0.3,h:0.25,fontSize:9,color:PPTX_MUTED,align:'center'});
      });
      y += 1.05; continue;
    }

    // ── progress ──
    const progM = t.match(/^<progress:\s*([\s\S]*)>$/i);
    if (progM) {
      const p = progM[1].split('|').map(s=>s.trim());
      const pct = parseFloat(p[1]||'50')/100, col = pptHex(p[2]||PPTX_ACCENT);
      slide.addText(p[0],{x:0.3,y,w:8,h:0.25,fontSize:11,color:PPTX_MUTED});
      slide.addShape(pres.ShapeType.roundRect,{x:0.3,y:y+0.28,w:8,h:0.2,fill:{color:'333333'},rectRadius:0.05});
      slide.addShape(pres.ShapeType.roundRect,{x:0.3,y:y+0.28,w:Math.max(0.1,8*pct),h:0.2,fill:{color:col},rectRadius:0.05});
      slide.addText(Math.round(pct*100)+'%',{x:8.5,y:y+0.22,w:0.7,h:0.28,fontSize:10,color:col,bold:true});
      y += 0.65; continue;
    }

    // ── versus ──
    const vsM = t.match(/^<versus:\s*(.+?)>/i);
    if (vsM) {
      const p = vsM[1].split('|').map(s=>s.trim());
      const [la,va,lb,vb,ca,cb] = p;
      const pct = parseFloat(va||'50');
      const colA = pptHex(ca||PPTX_ACCENT), colB = pptHex(cb||'f472b6');
      const bw = 9.4;
      slide.addShape(pres.ShapeType.roundRect,{x:0.3,y:y+0.28,w:bw,h:0.3,fill:{color:'222222'},rectRadius:0.06});
      slide.addShape(pres.ShapeType.roundRect,{x:0.3,y:y+0.28,w:Math.max(0.1,bw*pct/100),h:0.3,fill:{color:colA},rectRadius:0.06});
      slide.addText((la||'A')+' '+Math.round(pct)+'%',{x:0.3,y,w:4.5,h:0.25,fontSize:11,color:colA});
      slide.addText((lb||'B')+' '+Math.round(100-pct)+'%',{x:5.2,y,w:4.5,h:0.25,fontSize:11,color:colB,align:'right'});
      y += 0.75; continue;
    }

    // ── steps / 단계 흐름 ──
    const stepsM = t.match(/^<steps:\s*(.+?)>/i);
    if (stepsM) {
      const items = stepsM[1].split('|').map(s=>s.trim());
      const cw = 9.4 / items.length;
      items.forEach((item, i) => {
        const col = PPTX_COLORS[i % PPTX_COLORS.length];
        const x = 0.3 + i*cw;
        slide.addShape(pres.ShapeType.ellipse,{x:x+(cw-0.4)/2,y:y+0.05,w:0.4,h:0.4,fill:{color:col}});
        slide.addText(String(i+1),{x:x+(cw-0.4)/2,y:y+0.05,w:0.4,h:0.4,fontSize:10,bold:true,color:'000000',align:'center',valign:'middle'});
        slide.addText(item,{x:x+0.05,y:y+0.52,w:cw-0.1,h:0.35,fontSize:10,color:PPTX_LIGHT,align:'center',wrap:true});
        if (i < items.length-1) slide.addShape(pres.ShapeType.line,{x:x+cw-0.05,y:y+0.24,w:0.1,h:0,line:{color:col,width:2}});
      });
      y += 1.05; continue;
    }

    // ── timeline ──
    const timeM = t.match(/^<timeline:\s*(.+?)>/i);
    if (timeM) {
      const items = timeM[1].split('|').map(s=>s.trim());
      slide.addShape(pres.ShapeType.line,{x:0.3,y:y+0.25,w:9.4,h:0,line:{color:'333333',width:2}});
      const cw = 9.4 / items.length;
      items.forEach((item, i) => {
        const m = item.match(/^(.+?):(.+)$/);
        const [epoch, desc] = m ? [m[1].trim(),m[2].trim()] : [item,''];
        const col = PPTX_COLORS[i % PPTX_COLORS.length];
        const x = 0.3 + i*cw + (cw-0.28)/2;
        slide.addShape(pres.ShapeType.ellipse,{x,y:y+0.11,w:0.28,h:0.28,fill:{color:col},line:{color:col,width:0}});
        slide.addText(epoch,{x:0.3+i*cw,y:y+0.5,w:cw,h:0.25,fontSize:9,color:col,align:'center',bold:true});
        if(desc) slide.addText(desc,{x:0.3+i*cw,y:y+0.78,w:cw,h:0.28,fontSize:9,color:PPTX_LIGHT,align:'center',wrap:true});
      });
      y += 1.2; continue;
    }

    // ── checklist ──
    const chkM = t.match(/^<checklist:\s*(.+?)>/i);
    if (chkM) {
      const items = chkM[1].split('|').map(s=>s.trim());
      items.forEach(item => {
        slide.addShape(pres.ShapeType.roundRect,{x:0.3,y:y+0.04,w:0.22,h:0.22,fill:{color:'4ade80'},rectRadius:0.04});
        slide.addText('✓',{x:0.3,y:y+0.04,w:0.22,h:0.22,fontSize:8,bold:true,color:'000000',align:'center',valign:'middle'});
        slide.addText(item,{x:0.62,y,w:9,h:0.3,fontSize:12,color:PPTX_LIGHT});
        y += 0.36;
      });
      continue;
    }

    // ── numberedlist ──
    const numM = t.match(/^<numberedlist:\s*(.+?)>/i);
    if (numM) {
      const items = numM[1].split('|').map(s=>s.trim());
      items.forEach((item, i) => {
        const col = PPTX_COLORS[i % PPTX_COLORS.length];
        slide.addShape(pres.ShapeType.ellipse,{x:0.3,y:y+0.03,w:0.26,h:0.26,fill:{color:col}});
        slide.addText(String(i+1),{x:0.3,y:y+0.03,w:0.26,h:0.26,fontSize:9,bold:true,color:'000000',align:'center',valign:'middle'});
        slide.addText(item,{x:0.65,y,w:9,h:0.3,fontSize:12,color:PPTX_LIGHT});
        y += 0.36;
      });
      continue;
    }

    // ── iconrow ──
    const iconM = t.match(/^<iconrow:\s*(.+?)>/i);
    if (iconM) {
      const items = iconM[1].split('|').map(s=>s.trim());
      const cw = 9.4 / items.length;
      items.forEach((item, i) => {
        const m = item.match(/^(.+?):(.+)$/);
        const [icon, desc] = m ? [m[1].trim(),m[2].trim()] : [item,''];
        const x = 0.3 + i*cw;
        slide.addText(icon,{x,y:y+0.05,w:cw,h:0.4,fontSize:22,align:'center'});
        if(desc) slide.addText(desc,{x,y:y+0.5,w:cw,h:0.25,fontSize:10,color:PPTX_LIGHT,align:'center',wrap:true});
      });
      y += 0.9; continue;
    }

    // ── cardrow ──
    const cardM = t.match(/^<cardrow:\s*(.+?)>/i);
    if (cardM) {
      const items = cardM[1].split('|').map(s=>s.trim());
      const cw = 9.4 / items.length;
      items.forEach((item, i) => {
        const m = item.match(/^(.+?):(.+)$/);
        const [title, desc] = m ? [m[1].trim(),m[2].trim()] : [item,''];
        const col = PPTX_COLORS[i % PPTX_COLORS.length];
        const x = 0.3 + i*cw;
        slide.addShape(pres.ShapeType.roundRect,{x:x+0.05,y:y-0.05,w:cw-0.15,h:0.85,fill:{color:'161616'},rectRadius:0.1,line:{color:col,pt:1}});
        slide.addText(title,{x:x+0.1,y:y+0.02,w:cw-0.25,h:0.28,fontSize:11,bold:true,color:col});
        if(desc) slide.addText(desc,{x:x+0.1,y:y+0.32,w:cw-0.25,h:0.4,fontSize:9,color:PPTX_LIGHT,wrap:true});
      });
      y += 1.0; continue;
    }

    // ── banner ──
    const bannerM = t.match(/^<banner:\s*(.+?)>/i);
    if (bannerM) {
      const [col, ...rest] = bannerM[1].split('|').map(s=>s.trim());
      const txt = rest.join(' ') || col;
      const bg = rest.length ? pptHex(col) : '1e3a5f';
      slide.addShape(pres.ShapeType.roundRect,{x:0.3,y:y-0.05,w:9.4,h:0.6,fill:{color:bg},rectRadius:0.1});
      slide.addText(rest.length?txt:col,{x:0.5,y:y+0.05,w:9,h:0.5,fontSize:14,bold:true,color:'FFFFFF',align:'center'});
      y += 0.75; continue;
    }

    // ── highlight / pullquote ──
    const hlM = t.match(/^<highlight:\s*(.+?)>/i);
    if (hlM) {
      const [col, ...rest] = hlM[1].split('|').map(s=>s.trim());
      const txt = rest.join(' ') || col;
      const bg = rest.length ? pptHex(col) : pptHex(col);
      slide.addShape(pres.ShapeType.roundRect,{x:0.3,y:y-0.05,w:9.4,h:0.55,fill:{color:bg+'22'},rectRadius:0.08,line:{color:bg,pt:1}});
      slide.addText(rest.length?txt:col,{x:0.5,y:y+0.05,w:9,h:0.45,fontSize:13,color:'FFFFFF',wrap:true});
      y += 0.7; continue;
    }
    const pqM = t.match(/^<pullquote:\s*(.+?)>/i);
    if (pqM) {
      slide.addShape(pres.ShapeType.roundRect,{x:1,y:y-0.05,w:8,h:0.75,fill:{color:'161616'},rectRadius:0.12,line:{color:PPTX_ACCENT,pt:1}});
      slide.addText('" '+pqM[1]+' "',{x:1.15,y:y+0.1,w:7.7,h:0.55,fontSize:14,italic:true,color:PPTX_LIGHT,align:'center'});
      y += 0.9; continue;
    }

    // ── agenda ──
    const agM = t.match(/^<agenda:\s*(.+?)>/i);
    if (agM) {
      const items = agM[1].split('|').map(s=>s.trim());
      items.forEach((item, i) => {
        const col = PPTX_COLORS[i % PPTX_COLORS.length];
        slide.addShape(pres.ShapeType.ellipse,{x:0.3,y:y+0.04,w:0.26,h:0.26,fill:{color:col}});
        slide.addText(String(i+1),{x:0.3,y:y+0.04,w:0.26,h:0.26,fontSize:9,bold:true,color:'000000',align:'center',valign:'middle'});
        slide.addText(item,{x:0.65,y,w:9,h:0.32,fontSize:13,color:PPTX_LIGHT});
        y += 0.4;
      });
      continue;
    }

    // ── columns2 ──
    const col2M = t.match(/^<columns2:\s*/i);
    if (col2M) {
      // depth-aware extraction to handle nested tags with internal pipes
      let col2Inner = '', di = col2M[0].length, dd = 1;
      for (; di < t.length; di++) { if (t[di]==='<') dd++; else if (t[di]==='>') { dd--; if (dd===0) break; } col2Inner += t[di]; }
      const [left, right] = splitPipeDepth(col2Inner);
      slide.addShape(pres.ShapeType.roundRect,{x:0.3,y:y-0.05,w:4.5,h:0.55,fill:{color:'161616'},rectRadius:0.1});
      slide.addText(left||'',{x:0.4,y,w:4.3,h:0.45,fontSize:12,color:PPTX_LIGHT,wrap:true});
      slide.addShape(pres.ShapeType.roundRect,{x:5.2,y:y-0.05,w:4.5,h:0.55,fill:{color:'161616'},rectRadius:0.1});
      slide.addText(right||'',{x:5.3,y,w:4.3,h:0.45,fontSize:12,color:PPTX_LIGHT,wrap:true});
      y += 0.7; continue;
    }

    // ── PPTX gradtext / gradbox / gradshape (approximated with solid colors) ──
    const gradTextM = t.match(/^<gradtext:\s*([\s\S]*)>$/i);
    if (gradTextM) {
      const p = gradTextM[1].split('|').map(s=>s.trim());
      const fs = Math.min(30, Math.max(14, (parseInt(p[3])||7) * 3));
      slide.addText(p[2]||'',{x:0.3,y,w:9.4,h:0.5,fontSize:fs,bold:true,color:pptHex(p[0]||PPTX_ACCENT),wrap:true});
      y += fs*0.028+0.22; continue;
    }
    const gradBoxM = t.match(/^<gradbox:\s*([\s\S]*)>$/i);
    if (gradBoxM) {
      const p = gradBoxM[1].split('|').map(s=>s.trim());
      slide.addShape(pres.ShapeType.roundRect,{x:0.3,y:y-0.05,w:9.4,h:0.7,fill:{color:pptHex(p[0]||PPTX_ACCENT)},rectRadius:0.1,line:{color:pptHex(p[1]||'a78bfa'),pt:1.2}});
      slide.addText(p[2]||'',{x:0.5,y:y+0.08,w:9,h:0.5,fontSize:15,bold:true,color:'FFFFFF',wrap:true});
      y += 0.85; continue;
    }
    const gradShapeM = t.match(/^<gradshape:\s*([\s\S]*)>$/i);
    if (gradShapeM) {
      const p = gradShapeM[1].split('|').map(s=>s.trim());
      const shapeName = (p[0]||'rect').toLowerCase();
      const wIn = Math.min(9.2, Math.max(1, (parseFloat(p[3])||220) / 96));
      const hIn = Math.min(2.2, Math.max(0.45, (parseFloat(p[4])||90) / 96));
      const pptShape = shapeName === 'circle' ? pres.ShapeType.ellipse : pres.ShapeType.roundRect;
      slide.addShape(pptShape,{x:0.35,y,w:wIn,h:hIn,fill:{color:pptHex(p[1]||PPTX_ACCENT)},rectRadius:0.12,line:{color:pptHex(p[2]||'a78bfa'),pt:1.1}});
      if (p[5]) slide.addText(p[5],{x:0.45,y:y+0.08,w:Math.max(0.8,wIn-0.2),h:Math.max(0.3,hIn-0.16),fontSize:13,bold:true,color:'FFFFFF',align:'center',valign:'mid',wrap:true});
      y += hIn + 0.2; continue;
    }

    // ── 텍스트 태그 ──
    const txtM = t.match(/^<(xt|[1-9]t|bt|it|center|right|box|callout|quote|mark|badge|highlight|pullquote):\s*([\s\S]*)>$/i);
    if (txtM) {
      const cmd = txtM[1].toLowerCase(), content = txtM[2];
      const sizes = {xt:28,'9t':26,'8t':23,'7t':20,'6t':17,'5t':14,'4t':13,'3t':12,'2t':11,'1t':10};
      const fs = sizes[cmd] || 13;
      const bold = ['xt','9t','8t','7t','bt'].includes(cmd);
      if (cmd==='quote') {
        slide.addShape(pres.ShapeType.roundRect,{x:0.3,y:y-0.05,w:0.06,h:fs*0.028+0.25,fill:{color:PPTX_ACCENT}});
        slide.addText(content,{x:0.5,y,w:9,h:fs*0.028+0.15,fontSize:fs,color:PPTX_MUTED,italic:true,wrap:true});
      } else if (cmd==='box'||cmd==='callout') {
        slide.addShape(pres.ShapeType.roundRect,{x:0.3,y:y-0.05,w:9.4,h:fs*0.028+0.25,fill:{color:'161616'},rectRadius:0.1});
        slide.addText(content,{x:0.5,y,w:9,h:fs*0.028+0.15,fontSize:fs,color:PPTX_LIGHT,wrap:true});
      } else {
        slide.addText(content,{x:0.3,y,w:9.4,h:fs*0.028+0.12,fontSize:fs,bold,italic:cmd==='it',color:PPTX_LIGHT,align:cmd==='center'?'center':cmd==='right'?'right':'left',wrap:true});
      }
      y += fs*0.028+0.18; continue;
    }

    // ── 구분선 ──
    if (/^<-+>$/.test(t)||/^<\d+-?>$/.test(t)) {
      slide.addShape(pres.ShapeType.line,{x:0.3,y,w:9.4,h:0,line:{color:'333333',width:1}});
      y += 0.25; continue;
    }

    // ── meshbg ──
    const meshM = t.match(/^<meshbg:\s*([\s\S]*)>$/i);
    if (meshM) {
      const colors = meshM[1].split('|').map(s=>s.trim()).filter(Boolean);
      while (colors.length < 4) colors.push(colors[colors.length-1] || '0a0a0a');
      const base = pptHex(colors[3] || colors[colors.length-1] || '0a0a0a');
      slide.background = { color: base };
      const accents = [
        {x:-0.5,y:-0.3,w:4.2,h:2.2,c:colors[0]},
        {x:6.7,y:-0.2,w:4.0,h:2.0,c:colors[1]},
        {x:3.1,y:3.6,w:4.6,h:2.3,c:colors[2]}
      ];
      accents.forEach(a => slide.addShape(pres.ShapeType.ellipse,{x:a.x,y:a.y,w:a.w,h:a.h,fill:{color:pptHex(a.c)+'55'},line:{color:pptHex(a.c)+'00',pt:0},transparency:35}));
      continue;
    }

    // ── grid ──
    const gridM = t.match(/^<(?:grid|partition):\s*([\s\S]*)>$/i);
    if (gridM) {
      const p = gridM[1].split('|').map(s=>s.trim());
      const layout = parseGridLayoutSpec(p[0] || '2');
      const cols = layout.cols || 2;
      const colW = 9.4 / cols;
      const cellLines = [];
      let colIdx = 0;
      let ti2 = ti;
      while (ti2 < lines.length && !/^<endgrid>$/i.test(lines[ti2].trim())) {
        const gl = lines[ti2].trim();
        if (/^<gridcell>$/i.test(gl)) { colIdx = cellLines.length; cellLines.push([]); }
        else if (/^<(?:\/?gridcell|endcell)>$/i.test(gl)) {}
        else if (cellLines.length) cellLines[cellLines.length-1].push(gl);
        ti2++;
      }
      ti = ti2 < lines.length ? ti2 + 1 : ti2;
      const cleanPptText = ln => ln
        .replace(/^<[^:>]+:\s*/,'')
        .replace(/>\s*$/,'')
        .replace(/\\gt/g, '>')
        .replace(/\\lt/g, '<')
        .trim();
      cellLines.forEach((cellContent, ci) => {
        const cx = 0.3 + ci * colW;
        slide.addShape(pres.ShapeType.roundRect,{x:cx+0.05,y:y-0.05,w:colW-0.1,h:Math.max(0.5,cellContent.length*0.3+0.2),fill:{color:'161616'},rectRadius:0.1,line:{color:'333333',pt:1}});
        cellContent.forEach((ln, li) => {
          const txt = cleanPptText(ln);
          if (txt) slide.addText(txt,{x:cx+0.12,y:y+li*0.28,w:colW-0.25,h:0.26,fontSize:/^<[6-9]t:/i.test(ln)?13:10,bold:/^<([6-9]t|bt):/i.test(ln),color:PPTX_LIGHT,wrap:true});
        });
      });
      y += Math.max(0.6, Math.max(...cellLines.map(c=>c.length), 1)*0.3+0.3); continue;
    }

    // ── freebox ──
    const freeM = t.match(/^<freebox:\s*(.+?)>/i);
    if (freeM) {
      const p = freeM[1].split(',').map(s=>parseFloat(s.trim().replace('%',''))||0);
      let [fx, fy, fw, fh, fz] = p;
      if (fx+fw>100) fw=100-fx;
      const SLIDE_W=10, SLIDE_H=5.63;
      const bx = 0.3 + fx/100*(SLIDE_W-0.6);
      const by = fy/100*SLIDE_H;
      const bw = fw/100*(SLIDE_W-0.6);
      const bh = Math.max(0.4, fh/100*SLIDE_H);
      const innerLines = [];
      let ti3 = ti;
      while (ti3 < lines.length && !/^<endbox>$/i.test(lines[ti3].trim())) {
        innerLines.push(lines[ti3++].trim());
      }
      ti = ti3 < lines.length ? ti3 + 1 : ti3;
      slide.addShape(pres.ShapeType.roundRect,{x:bx,y:by,w:bw,h:bh,fill:{color:'1a1a1a'},rectRadius:0.08,line:{color:'444444',pt:1}});
      innerLines.forEach((ln, li) => {
        const txt = ln.replace(/^<[^:>]+:\s*/,'').replace(/>\s*$/,'').replace(/\\gt/g, '>').replace(/\\lt/g, '<').trim(); if (txt) slide.addText(txt,{x:bx+0.08,y:by+0.06+li*0.26,w:bw-0.16,h:0.24,fontSize:10,color:PPTX_LIGHT,wrap:true});
      });
      continue;
    }

    // ── svg-asset (simplified: bounding box) ──
    const svgM = t.match(/^<svg-asset:\s*(.+?)>/i);
    if (svgM) {
      const p = svgM[1].split(',').map(s=>parseInt(s.trim())||0);
      const sw = Math.min(9.4, (p[0]||400)/100), sh = Math.min(4, (p[1]||300)/100);
      slide.addShape(pres.ShapeType.roundRect,{x:0.3,y:y-0.05,w:sw,h:sh,fill:{color:'0d1117'},rectRadius:0.1,line:{color:'333333',pt:1}});
      slide.addText('SVG Asset',{x:0.4,y:y+sh/2-0.12,w:sw-0.2,h:0.24,fontSize:9,color:PPTX_MUTED,align:'center',italic:true});
      // skip until endsvg
      let ti4 = ti;
      while (ti4 < lines.length && !/^<endsvg>$/i.test(lines[ti4])) ti4++;
      ti = ti4;
      y += sh+0.2; continue;
    }

    // ── 일반 텍스트 (태그 아닌 경우) ──
    if (!t.startsWith('<')) {
      slide.addText(t,{x:0.3,y,w:9.4,h:0.3,fontSize:12,color:PPTX_MUTED,wrap:true});
      y += 0.35;
    }
  }
}

/* ── PPTX 다운로드 (에디터) ── */
async function downloadPptx() {
  savePptCurrentSlide();
  if (typeof PptxGenJS === 'undefined') { alert('PptxGenJS 라이브러리 로딩 중입니다. 잠시 후 다시 시도해주세요.'); return; }
  const pres = new PptxGenJS();
  pres.layout = 'LAYOUT_16x9';
  // 에디터의 전체 코드를 슬라이드별로 분리 (한 textarea에 전체 붙여넣은 경우도 처리)
  const fullCode = assemblePptCode();
  const slides = parsePostSlides(fullCode);
  if (!slides.length) { alert('슬라이드가 없습니다. <slide:> 또는 <slidecover:> 태그를 확인하세요.'); return; }
  slides.forEach((code, i) => buildPptxSlideContent(pres, pres.addSlide(), code, i));
  const titleEl = document.getElementById('postTitle');
  const fname = (titleEl && titleEl.value.trim()) || 'presentation';
  await pres.writeFile({ fileName: fname + '.pptx' });
}

/* ── 슬라이드 파싱 (발표 모드 / 포스트 PPTX 공용) ── */
function parsePostSlides(body) {
  const lines = body.split('\n');
  const slides = [];
  let cur = null;
  for (const line of lines) {
    if (/^<(slide|slidecover):/i.test(line.trim())) {
      if (cur !== null) slides.push(cur);
      cur = line + '\n';
    } else {
      if (cur === null) cur = '';
      cur += line + '\n';
    }
  }
  if (cur !== null) slides.push(cur);
  return slides.filter(s => s.trim());
}

/* ── 발표 모드 ── */
let _presentSlides = [], _presentIdx = 0;

function startPresentation(body) {
  _presentSlides = parsePostSlides(body);
  if (!_presentSlides.length) { alert('슬라이드가 없습니다. <slide:> 태그를 확인하세요.'); return; }
  _presentIdx = 0;
  document.getElementById('presentOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
  renderPresentSlide();
  document.addEventListener('keydown', _presentKeyHandler);
}

function endPresentation() {
  document.getElementById('presentOverlay').classList.remove('active');
  document.body.style.overflow = '';
  document.removeEventListener('keydown', _presentKeyHandler);
}

function _presentKeyHandler(e) {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); presentMove(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); presentMove(-1); }
  else if (e.key === 'Escape') endPresentation();
}

function presentMove(dir) {
  _presentIdx = Math.max(0, Math.min(_presentSlides.length - 1, _presentIdx + dir));
  renderPresentSlide();
}

function renderPresentSlide() {
  const body = document.getElementById('presentBody');
  const slideEl = document.getElementById('presentSlide');
  const code = _presentSlides[_presentIdx] || '';
  body.innerHTML = renderByteCode(code);
  renderMath(body);
  renderGraphs(body);
  renderCharts(body);
  renderInteractive(body);
  // 슬라이드 배경 적용
  const bgSpec = extractSlideBg(code);
  if (slideEl) {
    if (bgSpec) {
      slideEl.style.cssText = slideEl.style.cssText.replace(/background[^;]*;?/g,'');
      bgSpec.cssProps.split(';').filter(Boolean).forEach(prop => {
        const [k,v] = prop.split(':').map(s=>s.trim());
        if (k && v) slideEl.style.setProperty(k, v);
      });
    } else {
      slideEl.style.background = '#0a0a0a';
    }
  }

  const total = _presentSlides.length;
  const cur = _presentIdx + 1;
  document.getElementById('presentCounter').textContent = `${cur} / ${total}`;
  document.getElementById('presentProgressBar').style.width = `${(cur/total)*100}%`;
  document.getElementById('presentPrev').disabled = _presentIdx === 0;
  document.getElementById('presentNext').disabled = _presentIdx === total - 1;
}

/* ── PPTX 다운로드 (포스트 뷰) ── */
async function downloadPostPptx(p) {
  const btn = document.getElementById('dlPptxBtn');
  if (btn) { btn.textContent = '생성 중...'; btn.disabled = true; }
  try {
    if (typeof PptxGenJS === 'undefined') { alert('PptxGenJS 로딩 중입니다. 잠시 후 다시 시도해주세요.'); return; }
    const slides = parsePostSlides(p.body);
    if (!slides.length) { alert('슬라이드가 없습니다. <slide:> 태그를 확인하세요.'); return; }
    const pres = new PptxGenJS();
    pres.layout = 'LAYOUT_16x9';
    slides.forEach((code, i) => buildPptxSlideContent(pres, pres.addSlide(), code, i));
    const fname = (p.title||'presentation').replace(/[:*?"<>|]/g,'_');
    await pres.writeFile({ fileName: fname + '.pptx' });
  } finally {
    if (btn) { btn.textContent = '⬇ PPTX'; btn.disabled = false; }
  }
}

/* ═══════════════════════════════════════════
   BYTECODE RENDERER
   1단계: 코드 → 블록 목록 (중간 표현)
   2단계: 블록 목록 → HTML
   img/video size 태그는 바로 앞 이미지/영상 블록에 합산
═══════════════════════════════════════════ */
const FONT_SIZES = [null,'0.72rem','0.82rem','0.92rem','1rem','1.1rem','1.28rem','1.52rem','1.82rem','2.2rem'];

function getGridCols() {
  const w = window.innerWidth;
  if (w < 400) return 10;
  if (w < 700) return 16;
  if (w < 1000) return 22;
  return 30;
}

/* ─ 1단계: 코드를 블록 배열로 ─ */

// 멀티라인 <code:> 블록을 단일 마커로 변환 (parseByteCode 진입 전 전처리)
const _CB_SEP = '\x01';
function extractMultilineCodeBlocks(src) {
  // <code: [lang]> 또는 <code: [lang]\n ... \n> 패턴 처리
  // 닫는 > 가 독립된 줄에 있는 경우
  return src.replace(/<code:\s*(\w*)\s*\n([\s\S]*?)\n[ \t]*>/gm, (_, lang, body) => {
    const encoded = body.replace(/\x01/g, '').replace(/\n/g, _CB_SEP);
    return `<codeblock:${lang.trim()}|${encoded}>`;
  });
}

function normalizeByteCodeInput(code) {
  return String(code || '')
    .replace(/:contentReference\[oaicite:\d+\]\{index=\d+\}/g, '')
    .replace(/\{\[([^\]]+)\]\((https?:\/\/[^)]+)\)\}/g, '{$2}')
    .split('\n')
    .map(line => {
      if (/^\s*>\s*$/.test(line)) return '';

      let fixed = line;
      const startsBrokenCmd = /^\s*<(?:xt|[1-9]t|color:[^_\s>]+_[1-9]t|bt|it|mark|code|center|right|indent|quote|box|callout|badge|img|video|gallery|spacer|divider|line)\s*:/.test(fixed);
      const hasClosing = />/.test(fixed);

      if (startsBrokenCmd && !hasClosing) fixed += '>';
      if (!fixed.includes('<') && />\s*$/.test(fixed)) fixed = fixed.replace(/>\s*$/, '');

      return fixed;
    })
    .join('\n');
}

// 중첩 꺾쇠를 올바르게 처리하는 토크나이저
function splitCommaDepth(str) {
  const parts = []; let depth = 0, cur = '';
  for (const ch of String(str || '')) {
    if (ch === '(') depth++;
    else if (ch === ')') depth = Math.max(0, depth - 1);
    if (ch === ',' && depth === 0) { parts.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  parts.push(cur.trim());
  return parts;
}

function splitPipeDepth(str) {
  const parts = []; let depth = 0, cur = '';
  for (const ch of str) {
    if (ch === '<') depth++;
    else if (ch === '>') depth = Math.max(0, depth - 1);
    if (ch === '|' && depth === 0) { parts.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  parts.push(cur.trim());
  return parts;
}

function isLikelyTagStart(line, pos) {
  if (line[pos] !== '<') return false;
  const rest = line.slice(pos + 1);
  return /^\/?(?:[a-z][\w-]*|[1-9]t)\b/i.test(rest) || /^(?:-|\d+-)>/.test(rest);
}

function findNextTagStart(line, from) {
  for (let p = line.indexOf('<', from); p !== -1; p = line.indexOf('<', p + 1)) {
    if (isLikelyTagStart(line, p)) return p;
  }
  return -1;
}

function tokenizeLine(line) {
  const tokens = [];
  let i = 0, len = line.length;
  let textStart = 0;

  while (i < len) {
    if (!isLikelyTagStart(line, i)) { i++; continue; }

    // bytenode tags are line-oriented. Use the last > before the next real tag
    // opener so comparison text such as a>1 or 0<a<1 survives inside content.
    const nextTag = findNextTagStart(line, i + 1);
    const searchEnd = nextTag === -1 ? len : nextTag;
    const j = line.lastIndexOf('>', searchEnd - 1);
    if (j <= i) { i++; continue; }

    if (i > textStart) tokens.push({ k: 'text', v: line.slice(textStart, i) });
    tokens.push({ k: 'cmd', v: line.slice(i + 1, j).trim() });
    i = j + 1;
    textStart = i;
  }
  if (textStart < len) tokens.push({ k: 'text', v: line.slice(textStart) });
  return tokens;
}

function parseByteCode(code) {
  const lines = normalizeByteCodeInput(extractMultilineCodeBlocks(String(code || ''))).split('\n');
  const blocks = [];

  for (const rawLine of lines) {
    if (!rawLine.trim()) {
      // 빈 줄(Enter) → 세로 간격
      blocks.push({ type: 'vgap' });
      continue;
    }

    // 줄에서 <...> 토큰 추출 (중첩 꺾쇠 지원)
    const tokens = tokenizeLine(rawLine);

    for (const tok of tokens) {
      if (tok.k === 'text') {
        const cleaned = cleanLooseByteCodeText(tok.v);
        if (cleaned) blocks.push({ type: 'text', content: cleaned, size: 4, color: null });
        continue;
      }
      const b = parseCmd(tok.v);
      if (!b) continue;

      // img/video size → 직전 블록에 적용
      if (b.type === 'img_size') {
        const prev = findLast(blocks, x => x.type === 'img');
        if (prev) { prev.sizeX = b.sizeX; prev.sizeY = b.sizeY; prev.align = b.align; }
        continue;
      }
      if (b.type === 'video_size') {
        const prev = findLast(blocks, x => x.type === 'video');
        if (prev) { prev.sizeX = b.sizeX; prev.sizeY = b.sizeY; prev.align = b.align; }
        continue;
      }

      blocks.push(b);
    }
    blocks.push({ type: 'linebreak' });
  }
  return blocks;
}

function cleanLooseByteCodeText(text) {
  return String(text || '')
    .replace(/^\s*<\/?(?:xt|[1-9]t|color:[^_\s>]+_[1-9]t|bt|it|mark|code|center|right|indent|quote|box|callout|badge|img|video|gallery|spacer|divider|line)\s*:?\s*/i, '')
    .replace(/>\s*$/, '')
    .trim();
}
function normalizeInlineLinks(text) {
  return String(text || '')
    .replace(/\{\[([^\]]+)\]\((https?:\/\/[^)]+)\)\}/g, '{$2}')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '{$2} $1');

function renderInlineContent(content) {
  const text = normalizeInlineLinks(String(content || ''));
  const parts = [];
  const toks = tokenizeLine(text);

  for (const tok of toks) {
    if (tok.k === 'text') { parts.push(renderPlainInlineText(cleanLooseByteCodeText(tok.v))); continue; }
    const b = parseCmd(tok.v);
    if (b) {
      if (b.type === 'bold') parts.push(`<strong style="font-weight:700">${renderInlineContent(b.content)}</strong>`);
      else if (b.type === 'italic') parts.push(`<em style="font-style:italic">${renderInlineContent(b.content)}</em>`);
      else if (b.type === 'mark') parts.push(`<mark style="background:#ffe066;color:#222;padding:0 4px;border-radius:3px">${renderInlineContent(b.content)}</mark>`);
      else if (b.type === 'codeinline') parts.push(`<code style="font-family:Consolas,monospace;background:rgba(255,255,255,.1);color:#aef;padding:2px 8px;border-radius:4px;font-size:.9em">${renderInlineContent(b.content)}</code>`);
      else if (b.type === 'badge') parts.push(`<span style="display:inline-block;background:rgba(255,255,255,.12);color:var(--accent);font-size:.78rem;padding:2px 10px;border-radius:20px;border:1px solid var(--border2);margin:2px 2px">${renderInlineContent(b.content)}</span>`);
      else if (b.type === 'colorspan') {
        const col = /^#[0-9a-fA-F]{3,8}$/.test(b.color||'') ? b.color : 'var(--accent)';
        parts.push(`<span style="color:${col}">${renderInlineContent(b.content)}</span>`);
      }
      else if (b.type === 'gradspan') {
        const grad = makeLinearGradientCss(b.c1, b.c2);
        parts.push(`<span style="background:${grad};-webkit-background-clip:text;background-clip:text;color:transparent;display:inline;font-weight:inherit">${renderInlineContent(b.content)}</span>`);
      }
      else if (b.type === 'text') {
        const sizePx = [null,10,11,12,14,16,20,23,26,30][b.size] || 16;
        const colorStyle = b.color ? `color:${b.color.startsWith('#')?b.color:'var(--accent)'}` : '';
        const boldStyle = b.size >= 7 ? 'font-weight:700;' : '';
        parts.push(`<span style="font-size:${sizePx}px;${boldStyle}${colorStyle}">${renderInlineContent(b.content)}</span>`);
      }
      else if (b.content) parts.push(renderInlineContent(b.content));
    } else {
      parts.push(renderPlainInlineText(cleanLooseByteCodeText(tok.v)));
    }
  }
  return parts.join('');
}

function renderPlainInlineText(text) {
  const src = normalizeInlineLinks(text)
    .replace(/\\gt/g, '>').replace(/\\lt/g, '<')
    .replace(/<\/?(?:xt|[1-9]t|color:[^_\s>]+_[1-9]t|bt|it|mark|code|center|right|indent|quote|box|callout|badge|img|video|gallery|spacer|divider|line)\s*:?\s*/gi, '')
    .replace(/>\s*/g, '');
  const parts = [];
  const re = /\{(https?:\/\/[^}]+)\}\s*([^{}<]*)/g;
  let last = 0, m;
  while ((m = re.exec(src)) !== null) {
    if (m.index > last) parts.push(esc(src.slice(last, m.index)));
    const label = (m[2] || m[1]).trim();
    parts.push(`<a href="${esc(m[1])}" target="_blank" rel="noopener" style="text-decoration:underline;opacity:.85">${esc(label)}</a>`);
    last = m.index + m[0].length;
  }
  if (last < src.length) parts.push(esc(src.slice(last)));
  return parts.join('');
}
function findLast(arr, fn) {
  for (let i = arr.length - 1; i >= 0; i--) if (fn(arr[i])) return arr[i];
  return null;
}

function normalizeCssSize(v, fallback) {
  const s = String(v || '').trim();
  if (!s) return fallback;
  if (/^-?\d+(?:\.\d+)?$/.test(s)) return s + 'px';
  return s;
}

function parseGridLayoutSpec(rawSpec) {
  const spec = String(rawSpec || '2').trim();
  const compact = spec.replace(/\s+/g, '');
  const matrix = compact.match(/^(\d+)x(\d+)$/i);
  if (matrix) {
    const c = Math.max(1, Math.min(6, parseInt(matrix[1]) || 2));
    const r = Math.max(1, Math.min(6, parseInt(matrix[2]) || 2));
    return { cols: c, rows: r, template: `repeat(${c}, 1fr)`, rowsTemplate: `repeat(${r}, 1fr)` };
  }
  if (/^\d+(?:-\d+)+$/.test(compact)) {
    const nums = compact.split('-').map(n => Math.max(1, parseFloat(n) || 1));
    return { cols: nums.length, rows: 1, template: nums.map(n => `${n}fr`).join(' '), rowsTemplate: '' };
  }
  if (/^\d+$/.test(compact)) {
    const c = Math.max(1, Math.min(6, parseInt(compact) || 2));
    return { cols: c, rows: 1, template: `repeat(${c}, 1fr)`, rowsTemplate: '' };
  }
  const parts = spec.split(/\s+/).filter(Boolean);
  const ok = parts.length && parts.every(p => /^minmax\(.+\)$|^(?:\d+(?:\.\d+)?(?:fr|%|px|rem|em)|auto)$/i.test(p));
  if (ok) return { cols: parts.length, rows: 1, template: parts.join(' '), rowsTemplate: '' };
  return { cols: 2, rows: 1, template: 'repeat(2, 1fr)', rowsTemplate: '' };
}

function makeMeshLayerStyle(colorsInput, blurPx) {
  const colors = [...(colorsInput || [])].filter(Boolean);
  while (colors.length < 4) colors.push(colors[colors.length - 1] || '#0a0a0a');
  const positions = ['12% 18%', '86% 12%', '55% 82%', '25% 78%'];
  const grads = colors.slice(0, 4).map((c, i) =>
    `radial-gradient(circle at ${positions[i]}, ${c}cc 0%, transparent ${i === 2 ? '68%' : '58%'})`
  ).join(', ');
  const base = colors[3] || colors[colors.length - 1] || '#0a0a0a';
  return `background:${base};background-image:${grads};filter:blur(${blurPx || 80}px);opacity:.92;`;
}

function safeCssColor(c, fallback) {
  const s = String(c || '').trim();
  if (/^#[0-9a-fA-F]{3,8}$|^[a-zA-Z]{2,30}$|^rgba?\([\d\s,%.]+\)$/.test(s)) return s;
  return fallback || '#60a5fa';
}

function makeLinearGradientCss(c1, c2, angle) {
  return `linear-gradient(${angle || '135deg'}, ${safeCssColor(c1, '#60a5fa')}, ${safeCssColor(c2, '#a78bfa')})`;
}

function parseGradientParts(cmd) {
  const p = cmd.slice(cmd.indexOf(':') + 1).split('|').map(s => s.trim());
  return { c1: p[0] || '#60a5fa', c2: p[1] || '#a78bfa', text: p[2] || '', extra: p[3] || '' };

/* ─ 명령어 → 블록 객체 ─ */
function parseCmd(cmd) {
  // 빈 칸 <-> / <N-> → 인라인 가로 공백
  const hgapM = cmd.match(/^(\d+)-$/);
  if (cmd === '-' || hgapM) {
    const n = hgapM && hgapM[1] ? +hgapM[1] : 1;
    return { type: 'hgap', n };
  }

  // 제목
  if (/^xt:\s*/.test(cmd)) return { type: 'title', text: cmd.slice(cmd.indexOf(':')+1).trim() };

  // 이미지
  // 지원 형식:
  //   <img: URL>
  //   <img: size x:Q y:Q [align]>          ← 앞 img 블록에 크기 적용
  //   <img: URL size x:Q y:Q [align]>      ← URL + 크기 한 태그에
  if (/^img:\s*/.test(cmd)) {
    const after = cmd.slice(cmd.indexOf(':')+1).trim();
    // size only (URL 없이)
    if (/^size\s+x:\d+/i.test(after)) {
      const sm = after.match(/^size\s+x:(\d+)Q?\s+y:(\d+)Q?(?:\s+(up|middle|down))?/i);
      if (sm) return { type: 'img_size', sizeX: +sm[1], sizeY: +sm[2], align: sm[3]||'middle' };
    }
    // link: 추출
    const linkM = after.match(/\s+link:(https?:\/\/\S+)/i);
    const link = linkM ? linkM[1] : null;
    const clean = linkM ? (after.slice(0, linkM.index) + after.slice(linkM.index + linkM[0].length)).trim() : after;
    // URL + size
    const inlineSm = clean.match(/^(\S+)\s+size\s+x:(\d+)Q?\s+y:(\d+)Q?(?:\s+(up|middle|down))?/i);
    if (inlineSm) {
      return { type: 'img', url: inlineSm[1], sizeX: +inlineSm[2], sizeY: +inlineSm[3], align: inlineSm[4]||'middle', link };
    }
    return { type: 'img', url: clean, sizeX: null, sizeY: null, align: 'middle', link };
  }

  // 지원 형식: <video: URL> / <video: size x:Q y:Q [align]> / <video: URL size x:Q y:Q [align]>
  if (/^video:\s*/.test(cmd)) {
    const after = cmd.slice(cmd.indexOf(':')+1).trim();
    if (/^size\s+x:\d+/i.test(after)) {
      const sm = after.match(/^size\s+x:(\d+)Q?\s+y:(\d+)Q?(?:\s+(up|middle|down))?/i);
      if (sm) return { type: 'video_size', sizeX: +sm[1], sizeY: +sm[2], align: sm[3]||'middle' };
    }
    const inlineSm = after.match(/^(\S+)\s+size\s+x:(\d+)Q?\s+y:(\d+)Q?(?:\s+(up|middle|down))?/i);
    if (inlineSm) {
      return { type: 'video', url: inlineSm[1], sizeX: +inlineSm[2], sizeY: +inlineSm[3], align: inlineSm[4]||'middle' };
    }
    return { type: 'video', url: after, sizeX: null, sizeY: null, align: 'middle' };

  // 가로선
  const gx = cmd.match(/^(?:color:([^_]+)_)?grid\s+x/i);
  if (gx) return { type: 'hr', color: gx[1]||null };

  // 세로선
  const gy = cmd.match(/^(?:color:([^_]+)_)?grid\s+y(?:_l=(\d+)Q)?/i);
  if (gy) return { type: 'vr', color: gy[1]||null, lenQ: gy[2]?+gy[2]:null };

  // 색깔 텍스트
  const ct = cmd.match(/^color:([^_]+)_(\d)t:\s*([\s\S]*)/);
  if (ct) return { type: 'text', content: ct[3], size: +ct[2], color: ct[1] };

  // 그라데이션 텍스트 / 박스
  if (/^gradtext:\s*/.test(cmd)) {
    const g = parseGradientParts(cmd);
    const size = Math.min(9, Math.max(1, parseInt(g.extra) || 7));
    return { type:'gradtext', text:g.text, c1:g.c1, c2:g.c2, size };
  }
  if (/^gradbox:\s*/.test(cmd)) {
    const g = parseGradientParts(cmd);
    return { type:'gradbox', text:g.text, c1:g.c1, c2:g.c2, tone:g.extra || 'dark' };
  }
  if (/^gradshape:\s*/.test(cmd)) {
    const p = cmd.slice(cmd.indexOf(':') + 1).split('|').map(s => s.trim());
    const shape = (p[0] || 'rect').toLowerCase();
    const w = normalizeCssSize(p[3], '220px');
    const h = normalizeCssSize(p[4], shape === 'circle' ? w : '90px');
    return { type:'gradshape', shape, c1:p[1] || '#60a5fa', c2:p[2] || '#a78bfa', w, h, text:p[5] || '', tone:p[6] || 'dark' };

  // 일반 텍스트

  // 가운데 정렬 텍스트

  if (/^right:\s*/.test(cmd)) return { type: 'right', content: cmd.slice(cmd.indexOf(':')+1).trim() };

  if (/^indent:\s*/.test(cmd)) return { type: 'indent', content: cmd.slice(cmd.indexOf(':')+1).trim() };

  if (/^box:\s*/.test(cmd)) return { type: 'box', content: cmd.slice(cmd.indexOf(':')+1).trim() };

  if (/^callout:\s*/.test(cmd)) return { type: 'callout', content: cmd.slice(cmd.indexOf(':')+1).trim() };

  // 뱃지

    const xMax = rangeM ? +rangeM[2] : 10;

      .replace(/\s+range:\s*-?[\d.]+,-?[\d.]+/i, '')
      .replace(/\s+size:(small|medium|large)/i, '')
      .trim();

    const fns = fnStr.split('|').map(s => {
      const t = s.trim();
      return t.replace(/^y\s*=\s*/i, '');
    }).filter(Boolean);

  }

  // 표 (table)
  // <table: 헤더1|헤더2|헤더3 // 값1|값2|값3 // 값4|값5|값6>
  // 첫 행이 헤더, 이후 행이 데이터
  // header:no 옵션으로 헤더 없이 사용 가능
  if (/^table:\s*/.test(cmd)) {
    const raw = cmd.slice(cmd.indexOf(':')+1).trim();
    const noHeader = /\bheader:no\b/i.test(raw);

    const items  = clean.split('|').map(s => {
      const [k, v] = s.trim().split(':');

  }

  if (/^piechart:\s*/.test(cmd))  return parseChartCmd('piechart',  cmd);
  if (/^donut:\s*/.test(cmd))     return parseChartCmd('donut',     cmd);
  if (/^barchart:\s*/.test(cmd))  return parseChartCmd('barchart',  cmd);
  if (/^hbar:\s*/.test(cmd))      return parseChartCmd('hbar',      cmd);
  if (/^linechart:\s*/.test(cmd)) return parseChartCmd('linechart', cmd);
  if (/^areachart:\s*/.test(cmd)) return parseChartCmd('areachart', cmd);

  // ── flashinfo 25종 추가 ──

  // 1. 타임라인: <timeline: 2020:내용 | 2021:내용>
  if (/^timeline:\s*/.test(cmd)) {
    const raw = cmd.slice(cmd.indexOf(':')+1).trim();
    const items = raw.split('|').map(s => { const i = s.indexOf(':'); return { label: s.slice(0,i).trim(), text: s.slice(i+1).trim() }; }).filter(i=>i.label);

    return { type:'nlheader', title:p[0]||'', date:p[1]||'', color:p[2]||null };
